#
# Cosign-Policy for the Phase-3b Rust-CLI binaries that
# ``wirelang.persona_engine.rust_backend_switch`` subprocess-bridges
# to in production-mode. Declarative substrate, consumed by:
#
#   * ``tests/infra/test_cosign_policy_phase_3b.py`` (hermetic format
#     invariants).
#   * ``.github/workflows/cosign-verify-images.yml`` (Operator-Hand
#     ``workflow_dispatch`` job — Tag-20 follow-up will add a
#     ``cosign-verify-phase-3b-binaries`` job that consumes this
#     YAML).
#   * ``docs/operations/cosign-policy-phase-3b.md`` (Operator-Hand
#     verify recipe — humans read this YAML, run cosign, compare
#     digest to ``expected_image_digest`` slot).
#
# Tag-23 Mini-Welle update
# ------------------------
# Inventory extended from 4 to 5 binaries: ``bridge-diff`` (Tag-20
# Mini-Welle PR #175) is now a first-class policy entry. The Tag-22
# Quadlet installer (``quadlet/wakir-rust-cli.container``, PR #180)
# already inventoried all five binaries; this update closes the
# cross-substrate inventory gap so both files list the same five
# binaries byte-for-byte. No image-build path change.
#
# Tag-24 Mini-Welle update (ADR-0065 Phase-3c Trigger-Gate 2)
# -----------------------------------------------------------
# Inventory extended from 5 to 7 binaries in lock-step with the
# Tag-24 Quadlet installer update (Trigger-Gate 3). Two additions:
#
#   * ``subscribe-loop`` (Tag-22 Mini-Welle PR #181 wired the Python
#     production-default switch; the binary ships in the carrier
#     image at the canonical ``/opt/wakir/bin/wakir-persona-engine-
#     subscribe-loop`` path declared by ``DEFAULT_RUST_SUBSCRIBE_
#     LOOP_BIN`` in rust_backend_switch.py).
#   * ``anchor-emitter`` (Tag-23 Mini-Welle PR #184 wired the Python
#     production-default switch; the binary ships at
#     ``/opt/wakir/bin/wakir-persona-engine-anchor-emitter`` per
#     ``DEFAULT_RUST_ANCHOR_EMITTER_BIN``).
#
# Both bridges follow the same Sigstore-keyless-OIDC verification
# pattern as the prior five — same carrier image, same build
# workflow, same digest-resolver propagation. The cross-substrate
# parity test (test_cross_substrate_parity_with_quadlet_installer)
# enforces lock-step agreement with the Quadlet installer.
#
# Tag-29 Mini-Welle update (ADR-0066 Welle-2 image-build)
# -------------------------------------------------------
# Inventory extended from 7 to 8 binaries in lock-step with the
# Tag-29 Quadlet installer update. One addition:
#
#   * ``svid-workload-identity`` (Tag-25 Mini-Welle PR #191 wired
#     the Python production-default switch — Selin's resolver
#     recording ``binary_missing`` as Welle-2 precondition signal;
#     the binary now ships at
#     ``/opt/wakir/bin/wakir-persona-engine-svid-workload-identity``
#     per ``DEFAULT_RUST_SVID_WORKLOAD_IDENTITY_BIN``). The Rust
#     pendant skeleton (probe + info subcommands) lands in this
#     same Tag-29 Mini-Welle as the crate
#     ``persona-engine-svid-workload-identity`` (lib + bin); the
#     full Workload-API gRPC ``FetchX509SVID`` RPC is deferred to a
#     future Zone-L-reviewed crate revision (Tonic substrate larger
#     than the probe surface). The probe is sufficient to flip the
#     Welle-2 backend-decision from ``binary_missing`` to
#     ``binary_present``.
#
# Same Sigstore-keyless-OIDC verification pattern as the prior seven
# — same carrier image, same build workflow, same digest-resolver
# propagation. The cross-substrate parity test
# (test_cross_substrate_parity_with_quadlet_installer) enforces
# lock-step agreement with the Quadlet installer.
#
# Posture
# -------
# The 8 binaries are NOT free-standing artefacts — they ship inside
# the published ``ghcr.io/wakir-labs/wakir-persona-engine`` image
# (Containerfile.real, Sprint-Pengine-13+, BSL-1.1) at the canonical
# ``/opt/wakir/bin/wakir-persona-engine-<component>`` paths declared
# by ``wirelang/persona_engine/rust_backend_switch.py`` defaults.
# The image is keyless-signed via Sigstore against the GitHub-Actions
# OIDC identity of ``.github/workflows/build-wakir-persona-engine.yml``;
# verifying the image therefore transitively verifies the 8 binaries.
#
# Why keyless and not a pinned ``cosign.pub``: the WAT-Pipeline-Server
# substrate-pattern from ADR-0034 uses Sigstore-keyless throughout
# (no rotating private keys to operate); a static ``cosign.pub`` would
# only buy us added complexity. A static-key alternative recipe is
# documented in ``docs/operations/cosign-policy-phase-3b.md`` §6 for
# the air-gapped case where Sigstore-Rekor reachability is not
# guaranteed.
#
# Cross-review note
# -----------------
# Zone C (Container-Image-Pipeline x Tomás-OTS-Anchoring): the image
# this policy verifies is the same wakir-persona-engine image that
# Tomás's Quadlet ``quadlet/wakir-persona-tomas.container`` already
# pins; this policy adds the Rust-CLI binary surface as a first-class
# inventory item but does not change the image-build path or the
# digest-resolver workflow (``resolve-image-pins-ci.yml``).

schema_version: wakir.cosign-policy.phase-3b/1

policy:
  name: phase-3b-rust-cli-binaries
  description: >
    Cosign-keyless verification policy for the eight Phase-3b Rust-CLI
    binaries that the persona-engine production-default switch
    subprocess-bridges to (recovery, state-backing, fsm, v907-verify,
    bridge-diff, subscribe-loop, anchor-emitter, svid-workload-identity).

  # Sigstore-keyless OIDC identity of the GitHub-Actions runner that
  # builds and signs the carrier image. Same shape as the Sprint-9
  # Tag-4 wakir-provisioner policy (see IMAGE_PINS.md §2.5).
  certificate_identity_regexp: 'https://github\.com/wakir-labs/wakir-runtime/'
  certificate_oidc_issuer: 'https://token.actions.githubusercontent.com'

  # Carrier image — keyless-signed; the 5 binaries below ship inside
  # this image at the declared in-image paths. The digest slot uses
  # the same DIGEST_PENDING_KAI_CROSS_REVIEW placeholder convention
  # the Quadlet (wakir-persona-tomas.container) uses for the Tag-20
  # pre-resolution state; once Operator-Hand resolves it, the digest
  # propagates here AND into the Quadlet via the
  # resolve-image-pins-ci.yml workflow.
  carrier_image:
    registry: ghcr.io
    repository: wakir-labs/wakir-persona-engine
    expected_tag: 0.5.0-pilot
    expected_image_digest: sha256:DIGEST_PENDING_KAI_CROSS_REVIEW
    build_workflow: .github/workflows/build-wakir-persona-engine.yml
    containerfile: infra/persona-engine/Containerfile.real

# Inventory of the seven Phase-3b Rust-CLI binaries. Each entry is the
# subprocess-target of one ``WAKIR_*_BACKEND=rust`` ENV-switch wired
# in ``wirelang/persona_engine/rust_backend_switch.py``. The
# ``crate_path`` points at the crate that produces the binary; the
# ``in_image_path`` is the canonical install location inside the
# carrier image (matches the rust_backend_switch.py defaults). The
# inventory order matches the chronological landing order across
# Tag-17 through Tag-23 (recovery + state-backing PR #167, fsm
# PR #169, v907-verify PR #171, bridge-diff PR #175, subscribe-loop
# PR #181, anchor-emitter PR #184); the Tag-24 Quadlet installer
# (``quadlet/wakir-rust-cli.container``) iterates the same seven
# entries in alphabetical-by-component order.
binaries:

  - name: recovery
    component: persona-engine-recovery
    crate_path: wirelang-rust/crates/persona-engine-recovery
    in_image_path: /opt/wakir/bin/wakir-persona-engine-recovery
    env_switch: WAKIR_RECOVERY_BACKEND
    env_switch_value: rust
    env_binary_override: WAKIR_RUST_RECOVERY_BIN
    landed_pr: '#167'
    landed_tag: Tag-17 Mini-Welle
    purpose: >
      Persona-engine R1..R4 Recovery-Workflow subprocess-bridge.
      Schema-parity with wirelang/persona_engine/recovery_workflow.py.

  - name: state-backing
    component: persona-engine-state-backing
    crate_path: wirelang-rust/crates/persona-engine-state-backing
    in_image_path: /opt/wakir/bin/wakir-persona-engine-state-backing
    env_switch: WAKIR_STATE_BACKING_BACKEND
    env_switch_value: rust_inmemory|rust_natskv
    env_binary_override: WAKIR_RUST_STATE_BACKING_BIN
    landed_pr: '#167'
    landed_tag: Tag-17 Mini-Welle
    purpose: >
      NATS-KV Persona-State backing subprocess-bridge.
      Schema-parity with wirelang/persona_engine/state_backing.py.

  - name: fsm
    component: persona-engine-fsm
    crate_path: wirelang-rust/crates/persona-engine-fsm
    in_image_path: /opt/wakir/bin/wakir-persona-engine-fsm
    env_switch: WAKIR_FSM_BACKEND
    env_switch_value: rust
    env_binary_override: WAKIR_RUST_FSM_BIN
    landed_pr: '#169'
    landed_tag: Tag-18 Mini-Welle
    purpose: >
      Persona-engine lifecycle FSM (spec §3.3, six states, nine
      transitions) subprocess-bridge. Schema-parity with
      wirelang/persona_engine/lifecycle_state_machine.py.

  - name: v907-verify
    component: persona-engine-v907-verify
    crate_path: wirelang-rust/crates/persona-engine-v907-verify
    in_image_path: /opt/wakir/bin/wakir-persona-engine-v907-verify
    env_switch: WAKIR_V907_VERIFY_BACKEND
    env_switch_value: rust
    env_binary_override: WAKIR_RUST_V907_VERIFY_BIN
    landed_pr: '#171'
    landed_tag: Tag-19 Mini-Welle
    purpose: >
      V-907 persona-hash pin-compute + verify subprocess-bridge.
      Schema-parity with wirelang/persona_engine/v907_verify.py;
      hash-byte-identical against all V-907 pin-pack vectors.

  - name: bridge-diff
    component: persona-engine-bridge-diff
    crate_path: wirelang-rust/crates/persona-engine-bridge-diff
    in_image_path: /opt/wakir/bin/wakir-persona-engine-bridge-diff
    env_switch: WAKIR_BRIDGE_DIFF_BACKEND
    env_switch_value: rust
    env_binary_override: WAKIR_RUST_BRIDGE_DIFF_BIN
    landed_pr: '#175'
    landed_tag: Tag-20 Mini-Welle
    purpose: >
      Phase-3a/3b Doppelbetrieb diff-oracle subprocess-bridge.
      Schema-parity with
      wirelang/persona_engine/bridge_audit_diff_engine.py;
      byte-identical JCS + SHA-256 hash output AND byte-identical
      RFC-6901 field-path entries verified against all six
      cross-lang field-pin vectors per
      tests/fixtures/cross_lang_field_diff_fixtures.json (PR #166).

  - name: subscribe-loop
    component: persona-engine-subscribe-loop
    crate_path: wirelang-rust/crates/persona-engine-subscribe-loop
    in_image_path: /opt/wakir/bin/wakir-persona-engine-subscribe-loop
    env_switch: WAKIR_SUBSCRIBE_LOOP_BACKEND
    env_switch_value: rust
    env_binary_override: WAKIR_RUST_SUBSCRIBE_LOOP_BIN
    landed_pr: '#181'
    landed_tag: Tag-22 Mini-Welle
    purpose: >
      NATS-JetStream subscribe-loop ack-record subprocess-bridge.
      Schema-parity with wirelang/persona_engine/subscribe_ack.py
      (PR #172 ack-record Python sibling); byte-identical ack-record
      shape per tests/fixtures/subscribe-loop-cross-lang/fixtures.json.

  - name: anchor-emitter
    component: persona-engine-anchor-emitter
    crate_path: wirelang-rust/crates/persona-engine-anchor-emitter
    in_image_path: /opt/wakir/bin/wakir-persona-engine-anchor-emitter
    env_switch: WAKIR_ANCHOR_EMITTER_BACKEND
    env_switch_value: rust
    env_binary_override: WAKIR_RUST_ANCHOR_EMITTER_BIN
    landed_pr: '#184'
    landed_tag: Tag-23 Mini-Welle
    purpose: >
      WAT-anchor-envelope wire-shape emitter subprocess-bridge.
      Schema-parity with wirelang/persona_engine/anchor_emitter.py
      (PR #170 Python sibling); byte-identical envelope output per
      tests/fixtures/anchor-emitter-cross-lang/fixtures.json.

  - name: svid-workload-identity
    component: persona-engine-svid-workload-identity
    crate_path: wirelang-rust/crates/persona-engine-svid-workload-identity
    in_image_path: /opt/wakir/bin/wakir-persona-engine-svid-workload-identity
    env_switch: WAKIR_SVID_WORKLOAD_IDENTITY_BACKEND
    env_switch_value: rust
    env_binary_override: WAKIR_RUST_SVID_WORKLOAD_IDENTITY_BIN
    landed_pr: '#191'
    landed_tag: Tag-25 Mini-Welle (resolver), Tag-29 Mini-Welle (crate)
    purpose: >
      SPIFFE Workload-API socket-presence probe subprocess-bridge.
      Skeleton scope: probe + info subcommands (mirror of Python
      probe_workload_api_socket semantics in
      wirelang/persona_engine/svid_workload_identity.py). The full
      Workload-API gRPC FetchX509SVID RPC is deferred to a future
      Zone-L-reviewed crate revision (Tonic substrate larger than the
      probe surface).

# Operator-Hand verification recipe (human-readable canonical
# anchor; the prose recipe lives in
# docs/operations/cosign-policy-phase-3b.md §3).
verification:
  step_1_carrier_image: >
    cosign verify
    --certificate-identity-regexp 'https://github\.com/wakir-labs/wakir-runtime/'
    --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
    ghcr.io/wakir-labs/wakir-persona-engine:0.5.0-pilot@<resolved-digest>

  step_2_digest_cross_check: >
    crane digest ghcr.io/wakir-labs/wakir-persona-engine:0.5.0-pilot

  step_3_in_image_binary_probe: >
    podman run --rm --entrypoint /bin/sh
    ghcr.io/wakir-labs/wakir-persona-engine:0.5.0-pilot@<resolved-digest>
    -c 'for b in /opt/wakir/bin/wakir-persona-engine-recovery
                /opt/wakir/bin/wakir-persona-engine-state-backing
                /opt/wakir/bin/wakir-persona-engine-fsm
                /opt/wakir/bin/wakir-persona-engine-v907-verify
                /opt/wakir/bin/wakir-persona-engine-bridge-diff
                /opt/wakir/bin/wakir-persona-engine-subscribe-loop
                /opt/wakir/bin/wakir-persona-engine-anchor-emitter
                /opt/wakir/bin/wakir-persona-engine-svid-workload-identity; do
          test -x "$b" || { echo "missing or non-exec: $b"; exit 2; };
        done; echo OK'

  on_digest_mismatch: >
    Refuse rollout. The carrier image was either rebuilt without a
    coordinated pin update, or an unsigned/maliciously-signed image
    was pushed to the same tag. Halt. Zone-C cross-review the
    upstream signing event (Sigstore Rekor transparency log entry
    against the GitHub-Actions OIDC identity of the build workflow).

# Sandbox boundary
# ----------------
# The hermetic test surface
# (tests/infra/test_cosign_policy_phase_3b.py) validates the SHAPE
# of this YAML — schema_version, all 8 binaries listed, sha256 slot
# in canonical-form, mismatch fixture rejected. NO sandbox process
# calls cosign, crane, or skopeo against ghcr.io per
# feedback_sandbox_host_trennung.md. Live verification is
# Operator-Hand on a host with registry network egress and the
# cosign / crane CLIs installed.
