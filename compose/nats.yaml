#
# Phase-1b Sprint-2 Box-3 — single-node NATS-JetStream substrate for
# the orchestrator read-through cache (6 KV buckets: wakir-schemas,
# wakir-aip-cache, wakir-ftd-cache, wakir-ftd-poisoned,
# wakir-schema-registry-entries, wakir-federation-routes — the 5th
# bucket added Sprint-4 Tag-4 is a Phase-2-reserved schema-registry
# storage bucket with no Phase-1b consumer and bucket-config mirrors
# wakir-schemas; the 6th bucket added Sprint-4 Tag-5 is the V-908
# federation-route registry consumed by the Wirelang-side
# NatsKvRouteRegistry backend with bucket-config mirroring the
# Wirelang BUCKET_CONFIG byte-precisely).
#
# This compose file is the operator-facing bring-up artefact. It is
# pinned to a maintained alpine variant of the official ``nats``
# image and exposes only the loopback by default. JetStream storage
# is mapped to a named volume so that an operator-driven recreate
# (``docker compose down`` / ``up``) does not destroy the cache; a
# disk loss is the documented Phase-1 recovery path (see
# ``docs/orchestrator-nats-kv-phase-1-runbook.md`` §6.2).
#
# What this file does NOT do:
#   * No multi-node cluster (Phase-3 follow-up; ``replicas`` field on
#     the bucket initialiser is plumbed end-to-end already).
#   * No TLS termination (mTLS / SPIFFE JWT-SVID is a Sprint-3 item;
#     Phase-1b uses token auth via Infisical-injected env on the
#     orchestrator client side).
#   * No metrics scrape config (OTel collector is a separate compose
#     unit that joins this NATS via the user-defined network).
#
# Bring-up:
#
#   docker compose -f compose/nats.yaml up -d
#   nc -z 127.0.0.1 4222 && echo ok           # client port
#   curl -s http://127.0.0.1:8222/jsz | jq .  # JetStream introspection
#   python3 scripts/init-nats-buckets.py      # idempotent bucket init
#
# Tear-down (cache loss is acceptable in Phase-1):
#
#   docker compose -f compose/nats.yaml down -v   # -v drops the volume

services:

  nats:
    # NATS Phase-1b production-baseline pin (digest-pinned).
    #
    # Tag rationale (Box-3 verification stamp; full provenance in the
    # operator runbook §8):
    #   * ``2.10-alpine`` is no longer in the maintained-tags listing
    #     of the official ``nats`` Docker Hub repo.
    #   * ``2.14`` is fresh GA (released ~7 days before authoring of
    #     the original Box-3 tag-pin) — boring-tech-bias rules it out
    #     for Phase-1b.
    #   * ``2.11-alpine`` is the conservative maintained choice
    #     (2.11.17 GA, last alpine-tag push 2026-04-28).
    #
    # Digest-pin (Phase-2 Sprint-4 Tag-3, Cross-Review Zone-C upgrade
    # over the Sprint-2-Tag-3 tag-pin):
    #
    #   tag:           nats:2.11-alpine
    #   manifest-list: sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    #   amd64-image:   sha256:a7d440bf0240e664ed74fc17c70d616e6ff4bb9890dc26f7276589daedd1e196
    #   tag-pushed:    2026-04-28T01:57:25Z (UTC)
    #   resolved:      2026-05-11 via Docker Hub public registry API
    #                  https://registry.hub.docker.com/v2/repositories/library/nats/tags/2.11-alpine
    #
    # The manifest-list digest is the multi-arch-stable pin: every
    # container engine resolves it to the per-architecture image at
    # pull time without ambiguity. The amd64-image digest is recorded
    # for the operator who wants to bypass the manifest-list lookup
    # on amd64-only hosts (single ``--platform=linux/amd64`` pull
    # resolves to that exact image).
    #
    # Cosign-verification (optional opt-in for Phase-1b operators):
    # the official NATS image is not currently signed by Synadia with
    # a published cosign key, so cosign-verify against a vendor key
    # is a no-op in Phase-1b. An operator who wants signature-based
    # trust today can use ``cosign verify`` against the sigstore
    # public-good keyless transparency log for any future signed
    # release; the digest-pin above is the substantive trust anchor
    # for Phase-1b. See ``scripts/verify-image-digest.sh`` for the
    # hermetic-by-default digest-format gate and the opt-in cosign
    # invocation surface (``--with-cosign``).
    #
    # The hermetic test suite (``tests/orchestrator/test_compose_nats.py``)
    # accepts both tag-only and digest-pinned forms, so a future
    # operator who wants to roll back to tag-only for a debug bring-up
    # (or roll forward to a fresher 2.11-alpine alpine push) does not
    # break the contract surface.
    image: nats:2.11-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    container_name: wakir-nats
    command:
      - "--jetstream"
      - "--store_dir=/data/jetstream"
      - "--http_port=8222"
      - "--name=wakir-nats-phase1"
    ports:
      # Client port (NATS protocol). Loopback-only by default; an
      # operator who wants to expose this beyond the host can drop
      # the ``127.0.0.1:`` prefix.
      - "127.0.0.1:4222:4222"
      # Monitoring HTTP endpoint (``/varz``, ``/jsz``). Loopback-only
      # — never expose unauthenticated to a non-loopback interface.
      - "127.0.0.1:8222:8222"
    volumes:
      # JetStream persistence: a named volume survives container
      # recreate. ``docker compose down -v`` drops it deliberately.
      - jetstream_data:/data/jetstream
    networks:
      - wakir
    restart: unless-stopped
    # Health probe: hit the JetStream HTTP endpoint and require a
    # successful response. ``wget`` ships with the alpine variant of
    # the NATS image, ``curl`` does not — wget is the lower-friction
    # choice here.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O - http://127.0.0.1:8222/jsz >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Container-init hardening: drop all Linux capabilities (NATS
    # does not need any beyond the default network sockets, which it
    # gets via the unprivileged port mapping). ``no-new-privileges``
    # is a defence-in-depth: if a future bind to a privileged port
    # is needed, the operator must opt in explicitly.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # Phase-1 single-node: small resource envelope. These limits are
    # advisory under compose v2 (they apply on Swarm); they document
    # the expected shape for the Box-5 Helm-chart follow-up.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

volumes:
  jetstream_data:
    name: wakir-nats-jetstream-data

networks:
  wakir:
    name: wakir-orchestrator
    driver: bridge
