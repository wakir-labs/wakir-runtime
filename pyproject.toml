# Copyright (c) 2026 Callandor GmbH and contributors
#
# Build configuration for the wakir-runtime distribution.
#
# License posture
# ---------------
#
# Most modules under this project ship under Apache-2.0. The WAT
# (Wakir Audit Trail) operations module under `wat/` ships under
# Business Source License 1.1 with an automatic four-year conversion
# to Apache-2.0; see `wat/LICENSE-BSL.md` for the per-module text and
# the top-level `LICENSE` for Apache-2.0. Each source file carries its
# own SPDX identifier; the project-level identifier above is the
# union expression.
#
# Build backend
# -------------
#
# Setuptools is the boring-tech default: every Python install has it,
# every CI pipeline already knows how to drive it, and no extra wheel
# build dependency is pulled in. Hatchling would also work fine but
# adds a build-time dep without buying us anything for a pure-Python
# package with a flat module layout.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wakir-runtime"
version = "0.0.1.dev0"
description = "Wakir Labs reference runtime: Wirelang, WAT, and capability tokens."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0 AND BUSL-1.1" }
authors = [
    { name = "Callandor GmbH and contributors" },
]
keywords = [
    "audit-trail",
    "merkle",
    "opentimestamps",
    "bitcoin",
    "agents",
    "capability-tokens",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # JCS (RFC 8785) canonical JSON serialisation.
    # PyPI: https://pypi.org/project/rfc8785/  (URL-200-stamped 2026-05-06)
    # Maintainer: Trail of Bits. License: Apache-2.0.
    "rfc8785>=0.1.4",
    # SLIP-39 Shamir reference implementation.
    # PyPI: https://pypi.org/project/shamir-mnemonic/  (URL-200-stamped 2026-05-06)
    # Maintainer: SatoshiLabs. License: MIT.
    "shamir-mnemonic>=0.3.0",
    # EC and Ed25519 primitives for Two-Curve identity stack
    # (BIP-32 secp256k1 + SLIP-0010 Ed25519 derivation).
    # License: Apache-2.0 + BSD.
    "cryptography>=42",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    # JSON Schema validation for Wirelang Layer 0/1/2 conformance tests.
    "jsonschema>=4.21",
    # Hypothesis property-based testing for the external-verifier
    # parser/aggregator surface (Sprint-8 Tag-4, TV-DET-3 deepening).
    #
    # SCOPE-CONTRACT: Hypothesis is test-only — it MUST NOT appear in
    # the External-Verifier-Runtime-Surface, because that surface is
    # the brand-proof contract third parties run without any
    # Wakir-controlled deps. Keeping Hypothesis behind the `[test]`
    # extra preserves the zero-PyPI-surface promise of the verifier
    # itself; only the in-repo test suite imports it. Any future
    # refactor that pulls hypothesis into `dependencies = [...]`
    # above silently breaks ADR-0007 §verifier-surface posture.
    #
    # PyPI: https://pypi.org/project/hypothesis/  (URL-200-stamped 2026-05-13)
    # Maintainer: David R. MacIver. License: MPL-2.0.
    "hypothesis>=6.100",
]
# Real-NATS-client adapter, used by `scripts/init-nats-buckets.py`,
# `scripts/check-nats-kv-health.py`, `scripts/check-federation-evaluator-
# health.py` and the live-NATS-test-mode driver
# (`tests/orchestrator/test_live_nats_cross_validation.py`).
#
# Pin posture
# -----------
# Version is hard-pinned (`==`) — not `>=` — because nats-py 2.14.0
# is the version validated byte-identity-clean against the wheel
# digest in Phase-2 Sprint-4 Tag-2 (First-Time-Live-Smoke record,
# `agents-workspaces/kai/outbox/2026-05-11-phase-2-tag-2-first-time-
# live-smoke.md`). Bumps to 2.15.x or later require an explicit
# Live-Smoke re-run on a Bluefin/Silverblue build host plus a
# Cross-Review Zone-B paired-update if any client-side wire-format
# semantics shift (mock-vs-live cross-validation suite covers this).
#
# Hash pinning
# ------------
# pyproject.toml `[project.optional-dependencies]` cannot carry
# `--hash=sha256:...` markers (that is a pip-requirements-file
# feature, PEP-440 does not specify hash semantics for the project-
# metadata field). The byte-precise hash pin lives in the sibling
# `requirements-nats.txt` constraints file, which is the canonical
# install path for live-NATS-test-mode build hosts. See file header
# in `requirements-nats.txt` for hash provenance and install flow.
#
# PyPI: https://pypi.org/project/nats-py/  (URL-200-stamped 2026-05-11)
# Maintainer: Synadia (Waldemar Quevedo <wally@synadia.com>).
# License: Apache-2.0.
nats = [
    "nats-py==2.14.0",
]

[project.scripts]
wakir-merkle = "wat.cmd.aggregator_cli:main"
wakir-anchor = "wat.cmd.anchor_cli:main"
wakir-verify = "wat.verify.cli:main"
# 4-pole external-verifier CLI (Position-Paper §L4-References annex);
# see `wat/anchor/external_verifier/README.md`.
wat-verify = "wat.anchor.external_verifier.cli:main"
# Persona self-migration converter CLI (ADR-0036, V-907 third pillar);
# see wirelang/specs/self-migration-konverter-spec.md §7.
wakir-persona = "wirelang.persona.cli:main"

[project.urls]
Homepage = "https://wakir.dev"
Repository = "https://github.com/wakir-labs/wakir-runtime"

# ---------------------------------------------------------------------------
# Setuptools layout
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["wat*", "wirelang*"]
exclude = ["tests*", "docs*", "scripts*", "tooling*"]

[tool.setuptools.package-data]
wirelang = ["**/*.json"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:wat.*",
]
