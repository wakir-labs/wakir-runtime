#
# Build configuration for the wakir-runtime distribution.
#
# License posture
# ---------------
#
# This project is mixed-license. Apache-2.0 is the default for
# foundation code and verifier tooling; selected operational sub-trees
# ship under Business Source License 1.1 (BUSL-1.1) with a four-year
# auto-convert to Apache-2.0 per `LICENSE-BSL.md` at each BSL sub-tree
# root. CC-BY-4.0 covers documentation where marked. The authoritative
# path-to-license map lives in `LICENSING.md` at the repo root. Each
# source file carries its own SPDX identifier; the project-level
# identifier on the [project] table below is the union expression for
# distribution metadata (PEP-639).
#
# Build backend
# -------------
#
# Setuptools is the boring-tech default: every Python install has it,
# every CI pipeline already knows how to drive it, and no extra wheel
# build dependency is pulled in. Hatchling would also work fine but
# adds a build-time dep without buying us anything for a pure-Python
# package with a flat module layout.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wakir-runtime"
version = "0.0.1.dev0"
description = "Wakir Labs reference runtime: Wirelang, WAT, and capability tokens."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND BUSL-1.1"
license-files = [
    "LICENSE",
    "NOTICE",
    "LICENSES/Apache-2.0.txt",
    "LICENSES/BUSL-1.1.txt",
    "LICENSES/CC-BY-4.0.txt",
    "wat/LICENSE-BSL.md",
    "wirelang/federation/LICENSE-BSL.md",
    "wirelang/persona_engine/LICENSE-BSL.md",
    "infra/spire/federation/LICENSE-BSL.md",
    "infra/spire/agent/LICENSE-BSL.md",
    "infra/persona-engine/LICENSE-BSL.md",
]
authors = [
    { name = "Callandor GmbH and contributors" },
]
keywords = [
    "audit-trail",
    "merkle",
    "opentimestamps",
    "bitcoin",
    "agents",
    "capability-tokens",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # JCS (RFC 8785) canonical JSON serialisation.
    # PyPI: https://pypi.org/project/rfc8785/  (URL-200-stamped 2026-05-06)
    # Maintainer: Trail of Bits. License: Apache-2.0.
    "rfc8785>=0.1.4",
    # SLIP-39 Shamir reference implementation.
    # PyPI: https://pypi.org/project/shamir-mnemonic/  (URL-200-stamped 2026-05-06)
    # Maintainer: SatoshiLabs. License: MIT.
    "shamir-mnemonic>=0.3.0",
    # EC and Ed25519 primitives for Two-Curve identity stack
    # (BIP-32 secp256k1 + SLIP-0010 Ed25519 derivation).
    # License: Apache-2.0 + BSD.
    "cryptography>=42",
    # YAML front-matter parsing for axis-A persona-canonical-form
    # (V-907 pin-compute path). Imported eagerly by
    # `wirelang/persona/persona_canonical_form.py`, which the
    # `persona-engine` v907_verify code path imports lazily through
    # `wirelang.persona.persona_canonical_form`. Promoting PyYAML
    # from the `persona-engine-runtime` extra to a top-level
    # dependency closes the ADR-0061 §"Schritt 10" build-drift
    # symptom (52 wirelang test-suite failures with
    # `PersonaHashComputeError: persona_canonical_form missing`,
    # whose underlying cause is `ModuleNotFoundError: No module
    # named 'yaml'` raised from the eager `import yaml` line in
    # `persona_canonical_form.py`). The error message in
    # `v907_verify.py` swallows the original `ImportError` and
    # presents it as a packaging-missing-module symptom; the real
    # root cause is the missing transitive dep at the project root.
    # PyPI: https://pypi.org/project/PyYAML/  (URL-200-stamped 2026-05-16)
    # Maintainer: Ingy döt Net + Kirill Simonov. License: MIT.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    # JSON Schema validation for Wirelang Layer 0/1/2 conformance tests.
    "jsonschema>=4.21",
    # Hypothesis property-based testing for the external-verifier
    # parser/aggregator surface (Sprint-8 Tag-4, TV-DET-3 deepening).
    #
    # SCOPE-CONTRACT: Hypothesis is test-only — it MUST NOT appear in
    # the External-Verifier-Runtime-Surface, because that surface is
    # the brand-proof contract third parties run without any
    # Wakir-controlled deps. Keeping Hypothesis behind the `[test]`
    # extra preserves the zero-PyPI-surface promise of the verifier
    # itself; only the in-repo test suite imports it. Any future
    # refactor that pulls hypothesis into `dependencies = [...]`
    # above silently breaks ADR-0007 §verifier-surface posture.
    #
    # PyPI: https://pypi.org/project/hypothesis/  (URL-200-stamped 2026-05-13)
    # Maintainer: David R. MacIver. License: MPL-2.0.
    "hypothesis>=6.100",
]
# Real-NATS-client adapter, used by `scripts/init-nats-buckets.py`,
# `scripts/check-nats-kv-health.py`, `scripts/check-federation-evaluator-
# health.py` and the live-NATS-test-mode driver
# (`tests/orchestrator/test_live_nats_cross_validation.py`).
#
# Pin posture
# -----------
# Version is hard-pinned (`==`) — not `>=` — because nats-py 2.14.0
# is the version validated byte-identity-clean against the wheel
# digest in Phase-2 Sprint-4 Tag-2 (First-Time-Live-Smoke record,
# `agents-workspaces/kai/outbox/2026-05-11-phase-2-tag-2-first-time-
# live-smoke.md`). Bumps to 2.15.x or later require an explicit
# Live-Smoke re-run on a Bluefin/Silverblue build host plus a
# Cross-Review Zone-B paired-update if any client-side wire-format
# semantics shift (mock-vs-live cross-validation suite covers this).
#
# Hash pinning
# ------------
# pyproject.toml `[project.optional-dependencies]` cannot carry
# `--hash=sha256:...` markers (that is a pip-requirements-file
# feature, PEP-440 does not specify hash semantics for the project-
# metadata field). The byte-precise hash pin lives in the sibling
# `requirements-nats.txt` constraints file, which is the canonical
# install path for live-NATS-test-mode build hosts. See file header
# in `requirements-nats.txt` for hash provenance and install flow.
#
# PyPI: https://pypi.org/project/nats-py/  (URL-200-stamped 2026-05-11)
# Maintainer: Synadia (Waldemar Quevedo <wally@synadia.com>).
# License: Apache-2.0.
nats = [
    "nats-py==2.14.0",
]
# Sprint-Pengine-9 Bug-34c (structural fix) — the persona-engine
# container runtime needs the union of wirelang top-level deps PLUS
# the async clients for NATS-KV state-backing (OI-PEFR-1) and the
# SPIFFE Workload-API gRPC client (OI-PEFR-2). Containerfile.real
# installs this extra in one ``pip install '/opt/wakir-runtime/.
# [persona-engine-runtime]'`` invocation instead of a flat
# ``rfc8785 PyYAML shamir-mnemonic cryptography`` RUN-layer that
# drifts every time a new transitive dep lands.
#
# Why a separate extra (vs. ``nats`` reuse)
# ----------------------------------------
# The ``nats`` extra was scoped to scripts + the live-NATS-test-mode
# driver and pins ``nats-py==2.14.0`` byte-precise; the persona-engine
# can tolerate a lower bound (``>=2.6``) but inherits the 2.14.0 pin
# in production via ``requirements-nats.txt`` propagation. We name a
# new extra so the persona-engine surface and the NATS-cluster-bringup
# surface evolve independently (parity with the ADR-0007 verifier-
# surface zero-PyPI promise: a future split-package refactor can
# carve persona-engine into its own wheel without disturbing the
# Wirelang/WAT/NATS-script extras).
#
# Wheels referenced
# -----------------
# - rfc8785           — JCS canonicalisation for V-907 pin-compute
#                       (already a top-level dep; included here to
#                       give the extra a self-contained closure on a
#                       slim base image that does not install the
#                       package wheel itself).
# - PyYAML            — axis-A YAML frontmatter parsing for
#                       persona_canonical_form (V-907 transitive).
# - shamir-mnemonic   — Two-Curve identity recovery (top-level dep;
#                       transitive reach from persona-engine code
#                       paths that touch the identity substrate).
# - cryptography      — Ed25519 + secp256k1 primitives, BIP-32 +
#                       SLIP-0010 derivation (top-level dep).
# - nats-py           — OI-PEFR-1 NatsKvPersonaStateBacking-async;
#                       hard-pinned to 2.14.0 by requirements-nats.txt
#                       cross-validation. The bound is ``>=2.6`` in
#                       the extra (lowest version with asyncio JS-KV
#                       support); production substitutes via
#                       ``pip install -c requirements-nats.txt``.
# - grpcio            — OI-PEFR-2 SPIFFE Workload-API gRPC client.
#                       Bound is ``>=1.62`` (asyncio interceptor
#                       posture stable since 1.60; 1.62 carries the
#                       UDS-over-grpc fix that we tested against).
# - protobuf          — grpcio transitive; named explicitly so the
#                       ``protobuf==5.x`` posture is visible in
#                       the manifest (grpcio 1.62 ships with
#                       protobuf-runtime>=4.25,<6).
#
# PyPI URLs (all URL-200-stamped 2026-05-15):
#   - https://pypi.org/project/nats-py/
#   - https://pypi.org/project/grpcio/
#   - https://pypi.org/project/protobuf/
persona-engine-runtime = [
    "rfc8785>=0.1.4",
    "PyYAML>=6.0",
    "shamir-mnemonic>=0.3.0",
    "cryptography>=42",
    "nats-py>=2.6",
    "grpcio>=1.62",
    "protobuf>=4.25,<6",
]
# Sprint-SRE Tag-15 (Noa Bergstroem) — OpenTelemetry instrumentation
# wheels. Optional extra so the slim ``wakir-persona-engine`` image
# does NOT take a forced dep on the OTel SDK; deployments that wire
# a real OTLP collector install this extra explicitly via
# ``pip install '/opt/wakir-runtime/.[persona-engine-observability]'``
# (parity with the ``persona-engine-runtime`` install path).
#
# Why a separate extra vs. ``persona-engine-runtime`` reuse
# ---------------------------------------------------------
# Two distinct deployment profiles share the wakir-persona-engine
# image:
#
# 1. **Sandbox / hermetic-test profile.** Runs in CI containers with
#    no OTel collector reachable. Adding mandatory ``opentelemetry-*``
#    wheels would re-open the wheel-drift class of bugs that
#    Sprint-Pengine-9 Bug-34 closed (the slim image installs only the
#    wheels it actually exercises). The ``observability.py`` module
#    probes for the OTel API at runtime and degrades to structured-
#    JSON log lines if the wheels are absent — so hermetic tests do
#    not need this extra.
#
# 2. **Pilot / production profile.** Runs against an OTel collector
#    (``http://otel-collector:4317`` or equivalent). This extra is
#    installed in the production Containerfile only; the engine then
#    binds real MeterProvider / TracerProvider against the collector.
#
# Per-wheel rationale
# -------------------
# - opentelemetry-api      — abstract MeterProvider / TracerProvider
#                            interfaces; needed even for the no-op
#                            provider path (engine probes
#                            ``opentelemetry.metrics`` / ``trace`` at
#                            import time).
# - opentelemetry-sdk      — concrete MeterProvider + TracerProvider
#                            + PeriodicExportingMetricReader +
#                            BatchSpanProcessor; consumed only when
#                            the OTLP exporter is wired.
# - opentelemetry-exporter-otlp-proto-grpc
#                          — OTLPMetricExporter + OTLPSpanExporter
#                            (gRPC variant; the persona-engine NATS
#                            substrate already binds gRPC for SVID-
#                            fetch, so no new transport profile).
#
# PyPI URLs (all URL-200-stamped 2026-05-16):
#   - https://pypi.org/project/opentelemetry-api/
#   - https://pypi.org/project/opentelemetry-sdk/
#   - https://pypi.org/project/opentelemetry-exporter-otlp-proto-grpc/
#
# Version posture
# ---------------
# Lower bounds only (``>=1.27``) — the OTel SDK has been ABI-stable
# since 1.20 (2024-09); the lower bound matches the version Noa
# verified the engine API surface against during Sprint-SRE Tag-15
# (URL-200-stamped 2026-05-16). Production deployments substitute a
# byte-precise constraints file analogous to ``requirements-nats.txt``.
persona-engine-observability = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[project.scripts]
wakir-merkle = "wat.cmd.aggregator_cli:main"
wakir-anchor = "wat.cmd.anchor_cli:main"
wakir-verify = "wat.verify.cli:main"
# Doppel-Audit-Trail bridge-writer CLI (Sprint-9 Tag-1, Migrations-
# Plan-Schritt 5); see wat/anchor/bridge_audit_writer.py.
wakir-bridge-audit-write = "wat.cmd.bridge_audit_cli:main"
# 4-pole external-verifier CLI (Position-Paper §L4-References annex);
# see `wat/anchor/external_verifier/README.md`.
wat-verify = "wat.anchor.external_verifier.cli:main"
# Persona self-migration converter CLI (ADR-0036, V-907 third pillar);
# see wirelang/specs/self-migration-konverter-spec.md §7.
wakir-persona = "wirelang.persona.cli:main"

[project.urls]
Homepage = "https://wakir.dev"
Repository = "https://github.com/wakir-labs/wakir-runtime"

# ---------------------------------------------------------------------------
# Setuptools layout
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["wat*", "wirelang*"]
exclude = ["tests*", "docs*", "scripts*", "tooling*"]

[tool.setuptools.package-data]
wirelang = ["**/*.json"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:wat.*",
]
