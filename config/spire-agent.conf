# SPIRE-Agent Phase-2.2 Sprint-6 Tag-9 hermetic Mock/Stub config.
#
# Trust-domain: example.test (IANA-reserved, RFC 6761 §6.5; matches the
# SPIRE-Server in config/spire-server.conf).
# NOT a production stand — see ``compose/spire.yaml`` header.
#
# HCL format per SPIRE-Agent config reference. Validated by
# tests/orchestrator/test_compose_spire_agent.py against shape invariants;
# no live SPIRE-Agent runs against this file in the hermetic test suite
# (Phase-2.3 live-gated bring-up + SVID-fetch live-smoke is the next slot,
# Operator-Hand).

agent {
    # Data directory for the agent: bootstrap-trust-bundle cache,
    # SVID-cache, KeyManager-memory keys (in disk-KeyManager mode).
    # Mounted as a named volume in compose; ``compose down -v`` drops
    # it deliberately to force a re-attestation on next bring-up.
    data_dir = "/var/lib/spire/agent"

    log_level = "INFO"

    # Trust-domain literal — example.test is the hermetic-only marker.
    # MUST match the SPIRE-Server trust-domain (see
    # config/spire-server.conf §server.trust_domain). A drift here is
    # caught by tests/orchestrator/test_compose_spire_agent.py.
    trust_domain = "example.test"

    # Server-Admin-API endpoint. The agent dials the server's admin
    # socket on the shared ``spire_server_sockets`` named volume,
    # mounted in both containers at /run/spire/sockets. The compose
    # network ``wakir-orchestrator`` provides DNS for the server's
    # service-name; the gRPC address combines the service-name with
    # the SPIRE-Server bind_port (8081).
    #
    # In the hermetic Mock/Stub posture the agent attempts to reach
    # the server but the join_token attestation has no real token
    # (the value below is a documented placeholder). The intent is
    # to exercise the compose shape, NOT to issue a real SVID.
    server_address = "spire-server"
    server_port    = "8081"

    # Bootstrap trust-bundle path. In the hermetic substrate this
    # file is not pre-populated — the agent would on first run obtain
    # it via an insecure-bootstrap dance gated by the server's join-
    # token attestor. Phase-2.3+ live-gated bring-up writes the
    # trust-bundle to this path manually via an Operator-Hand
    # ``spire-server bundle show`` step.
    trust_bundle_path = "/var/lib/spire/agent/bootstrap.crt"

    # Insecure bootstrap is the join_token Phase-2 development mode.
    # Phase-3 production swaps this for trust_bundle_path-only
    # (operator pre-stages the trust-bundle) or x509pop-bootstrap
    # (Phase-3a federation).
    insecure_bootstrap = true

    # SPIFFE-Workload-API socket path. The agent listens on this Unix
    # socket; persona-container Workload-API consumers mount the
    # ``spire_agent_sockets`` volume read-only at the same path and
    # connect via ``unix:///run/spire/agent-sockets/api.sock``.
    socket_path = "/run/spire/agent-sockets/api.sock"
}

plugins {
    # NodeAttestor: join_token for Phase-2 manual enrollment.
    # The actual join-token value is supplied to the agent at startup
    # via ``-joinToken <token>`` on the command line (NOT in this
    # config file). In the hermetic substrate the agent's run-command
    # in compose/spire.yaml does not pass a join-token; the agent
    # will log an attestation-failure and retry. That is the
    # intended hermetic posture — exercise the compose shape, do not
    # attempt real attestation. Phase-2.3+ live-gated bring-up wires
    # the real join-token via an Operator-Hand
    # ``spire-server token generate`` step.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # KeyManager: in-memory is the Phase-2 hermetic choice. The
    # disk-KeyManager (Phase-2c+) persists keys to data_dir so the
    # agent retains its identity across restarts; the in-memory
    # variant forces a re-attestation on every restart, which is
    # what we want for the hermetic substrate (no key material
    # persists between compose down/up cycles).
    KeyManager "memory" {
        plugin_data {}
    }

    # WorkloadAttestor: unix is the SPIRE-default for unix-socket-
    # based workload attestation (selectors derived from the calling
    # process's uid/gid/pid/binary-path). The hermetic substrate
    # does not register real workloads, so this is shape-only.
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
