# SPIRE-Server Phase-2 Sprint-6 Tag-6 hermetic Mock/Stub config.
#
# Trust-domain: example.test (IANA-reserved, RFC 6761 §6.5).
# NOT a production stand — see ``compose/spire.yaml`` header.
#
# HCL format per SPIRE-Server config reference. Validated by
# tests/orchestrator/test_compose_spire.py against shape invariants;
# no live SPIRE-Server runs against this file in the hermetic test
# suite (Phase-2.3 live-gated bring-up is the next slot).

server {
    # Bind on loopback only inside the container. The container's
    # network namespace is the wakir-orchestrator bridge, so loopback
    # here is the container's own loopback — the gRPC port is not
    # reachable from outside the container without an explicit
    # ports: mapping in compose/spire.yaml (deliberately omitted in
    # Phase-2.1 to keep the surface hermetic).
    bind_address = "127.0.0.1"
    bind_port    = "8081"

    # Trust-domain literal — example.test is the hermetic-only
    # marker. Phase-2 production trust-domain is ``wakir.local``;
    # see docs/spiffe-z-a-jwt-svid-skizze.md §2.
    trust_domain = "example.test"

    # On-disk data directory (mounted as a named volume in compose).
    data_dir     = "/var/lib/spire/server"

    log_level    = "INFO"

    # JWT-SVID TTL: 15 minutes (SPIRE boring-default and the value
    # pinned in scripts/spiffe_skizze_constants.py as
    # JWT_SVID_TTL_SECONDS_PHASE_2 = 15 * 60).
    default_jwt_svid_ttl  = "15m"

    # X.509-SVID TTL: 1 hour (SPIRE boring-default).
    default_x509_svid_ttl = "1h"

    # CA-Key-Type: ec-p256 is the SPIRE default and the boring choice
    # for Phase-2 (faster than RSA, well-supported by spiffe-tls and
    # the Python ``spiffe`` package).
    ca_key_type = "ec-p256"

    # CA-TTL: 24 hours for the hermetic Mock/Stub mode. Production
    # default is 30 days; the short hermetic TTL forces the rotation
    # path to be exercised in Phase-2.6 (Trust-Bundle-Rotation-
    # Sequence) without waiting for real production time.
    ca_ttl = "24h"
}

plugins {
    # DataStore: SQLite is the Phase-2 boring-default. Phase-3a
    # migration path is SQLite-dump → Postgres-import.
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }

    # KeyManager: disk is the Phase-2 boring-default. Phase-3 path is
    # Vault-Transit-KeyManager (ADR-0020 §Vault 1.21 SPIFFE-Auth).
    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire/server/keys.json"
        }
    }

    # NodeAttestor: join_token for Phase-2 manual enrollment. Phase-3
    # K8s-PSAT-Attestor (K8s extension) or x509pop (Phase-3a).
    NodeAttestor "join_token" {
        plugin_data {}
    }
}
