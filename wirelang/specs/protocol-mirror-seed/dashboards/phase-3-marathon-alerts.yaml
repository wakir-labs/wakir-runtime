            increased by {{ $value }} in the last 10m. The state-
            backing migration self-aborted and reverted. Inspect
            migrate-version output; verify Welle-5 FSM did not
            already consume migrated state. Cross-check with
            Welle-rollback baseline alert.
          runbook_url: "https://wakir-labs.example/runbooks/welle-4-migration-rollback"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand + activity-log:append"

      - alert: WakirWelle4WriteLatencyP99Excess
        # Welle-4 state-backing write-latency P99 above 250ms
        # for >= 5m. Phase-2 acceptance threshold for the
        # state-backing tier (operator-tuned default).
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (
              rate(wakir_welle4_state_backing_write_latency_seconds_bucket[5m])
            )
          ) > 0.25
        for: 5m
        labels:
          severity: ticket
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-4
          component: state_backing
          kw_week: kw-26
          topology: doppel
        annotations:
          summary: "Welle-4 state-backing write-latency P99 > 250ms"
          description: >-
            P99 write-latency = {{ $value }}s for >= 5m. Above
            the 250ms Phase-2 acceptance threshold. Investigate
            persistence-tier IO (jetstream consumer-ack backpressure
            candidate). Welle-5 FSM may stall waiting on backing
            writes if untreated.
          runbook_url: "https://wakir-labs.example/runbooks/welle-4-write-latency"
          notify_path: "ticket:sre-ops + activity-log:append"

      # ---------------------------------------------------------
      # Tag-72 Welle-4 State-Backing-Alert-Routing-Erweiterung
      # (Noa SRE, Continuous-Mode-Marathon)
      # ---------------------------------------------------------
      # Two additional alarms close the Welle-4 state-backing
      # routing gap identified during Tag-71 stability-window
      # review. The existing Welle-4 alerts surface FAILURES
      # (READ-FAIL, migration-ROLLBACK, write-latency excess);
      # Tag-72 adds:
      #
      #   1. WakirPhase3Welle4StateBackingActive (info)
      #      Positive-state indicator. Fires when the
      #      state-backing tier has completed the KW-26 migration
      #      AND is serving reads/writes on the new backing. This
      #      is the positive-confirmation counterpart to the
      #      WakirWelle4StateBackingMigrationRollback page alert;
      #      it marks "state-backing is live and stable" so the
      #      AR-Hand audit trail closes the migration epoch
      #      without inferring success from absence-of-rollback.
      #      Routing class `welle-4-state-backing-info` (info-only).
      #
      #   2. WakirPhase3Welle4SnapshotRestoreTriggered (warning)
      #      Rollback-Pfad: snapshot-restore counter increases by
      #      >= 1 in a 5m window. Snapshot-restore is the
      #      manual-or-scripted recovery action that re-hydrates
      #      the state-backing from a known-good snapshot when
      #      the migration-rollback path is insufficient (e.g.
      #      silent corruption past the rollback window). Warning
      #      severity (NOT page): the trigger is human-initiated
      #      or scheduled, but the AR-Hand must see the event
      #      and audit-log it. Routing class
      #      `welle-4-state-backing-info` (notify the standard
      #      info channel + activity-log; no on-call page).
      #
      # Mutual exclusion contract:
      #   active=1 AND restore=0 -> steady-state; Active fires.
      #   active=1 AND restore=1 -> Restore fires; Active stays
      #       silent (the active recording-rule is gated on
      #       restore_in_progress=0 upstream).
      #   active=0 AND restore=0 -> migration in flight; nothing
      #       fires from this block (other Welle-4 alarms cover).
      #
      # Routing class `welle-4-state-backing-info` is added to
      # the bridge ROUTING_CLASS_CHANNELS table (Tag-72) and
      # channels to ntfy:ar-hand-info + activity-log:append.
      - alert: WakirPhase3Welle4StateBackingActive
        expr: |
          (
            wakir_welle4_state_backing_migration_complete == 1
          )
          and
          (
            wakir_welle4_state_backing_restore_in_progress == 0
          )
        for: 2m
        labels:
          severity: info
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          tag: tag-72
          welle: welle-4
          component: state_backing
          kw_week: kw-26
          topology: doppel
          routing_class: welle-4-state-backing-info
          mitigation: welle-4-state-backing-routing-extension
        annotations:
          summary: "Welle-4 state-backing live and stable (migration complete)"
          description: >-
            Welle-4 state-backing migration has reported complete
            (wakir_welle4_state_backing_migration_complete == 1)
            AND no snapshot-restore is in flight
            (wakir_welle4_state_backing_restore_in_progress == 0)
            for >= 2m. This is the positive-confirmation
            counterpart to the migration-rollback page alert:
            the KW-26 state-backing tier is serving reads/writes
            on the new backing. AR-Hand audit-trail marker; no
            operator action.
          runbook_url: "https://wakir-labs.example/runbooks/welle-4-state-backing-active"
          notify_path: "ntfy:ar-hand-info + activity-log:append"

      - alert: WakirPhase3Welle4SnapshotRestoreTriggered
        expr: increase(wakir_welle4_state_backing_snapshot_restore_total[5m]) >= 1
        for: 60s
        labels:
          severity: warning
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          tag: tag-72
          welle: welle-4
          component: state_backing
          kw_week: kw-26
          topology: doppel
          routing_class: welle-4-state-backing-info
          mitigation: welle-4-state-backing-routing-extension
          rollback_path: snapshot-restore
        annotations:
          summary: "Welle-4 state-backing snapshot-restore triggered (rollback path)"
          description: >-
            wakir_welle4_state_backing_snapshot_restore_total
            increased by {{ $value }} in the last 5m. A snapshot-
            restore is the rollback-Pfad recovery action that
            re-hydrates the state-backing from a known-good
            snapshot when migration-rollback is insufficient
            (e.g. silent corruption past the rollback window).
            Warning severity: the trigger is human-initiated or
            scheduled; AR-Hand must see the event for audit-log
            closure. Cross-check with WakirWelle4StateReadFail
            for the originating defect signature.
          runbook_url: "https://wakir-labs.example/runbooks/welle-4-snapshot-restore-triggered"
          notify_path: "ntfy:ar-hand-info + activity-log:append"

  - name: welle-5-alerts
    interval: 30s
    rules:
      - alert: WakirWelle5FsmPhantomTransition
        # Welle-5 lifecycle_state_machine: FSM-Phantom-Transition
        # SCOPED to welle-5. Distinct from Tag-45 A2 (which fires
        # on ANY welle's illegal-transition counter); this rule
        # filters to welle="welle-5" so the welle-5 page-page is
        # immediate and unambiguous on KW-26 doppel cutover.
        expr: wakir_lifecycle_fsm_illegal_transition_total{welle="welle-5"} > 0
        for: 60s
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-5
          component: lifecycle_state_machine
          kw_week: kw-26
          topology: doppel
        annotations:
          summary: "Welle-5 FSM-Phantom transition: from={{ $labels.from_state }} to={{ $labels.to_state }}"
          description: >-
            Welle-5 lifecycle_state_machine reported an illegal
            transition (from={{ $labels.from_state }},
            to={{ $labels.to_state }}, count={{ $value }}). KW-26
            doppel cutover with Welle-4 as state-backing partner;
            if Welle-4 has any state-read-fail in the same window,
            this is the Welle-4 -> Welle-5 cascade. AR-Hand-Stop
            + Reza Replay-Engine diff-vs-baseline.
          runbook_url: "https://wakir-labs.example/runbooks/welle-5-fsm-phantom"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand + activity-log:append"

      - alert: WakirWelle5LifecycleOrphanState
        # Welle-5: orphan-state in FSM. The lifecycle_state_machine
        # exposes an orphan-state counter when a transition leaves
        # an entity in a state with no outgoing edges and no
        # terminal classification.
        expr: wakir_welle5_lifecycle_orphan_state_total > 0
        for: 90s
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-5
          component: lifecycle_state_machine
          kw_week: kw-26
          topology: doppel
        annotations:
          summary: "Welle-5 lifecycle-FSM orphan-state detected"
          description: >-
            wakir_welle5_lifecycle_orphan_state_total = {{ $value }}
            for >= 90s. The FSM produced an entity in a state with
            no defined outgoing transitions and no terminal label.
            This is a spec-bug or migrated-state-corruption.
            Engage Welle-5 owner; replay via Reza engine to
            identify the trigger transition.
          runbook_url: "https://wakir-labs.example/runbooks/welle-5-orphan-state"
          notify_path: "pagerduty:sre-oncall + activity-log:append"

      - alert: WakirWelle5SignedOffBeforeWelle4Stable
        # KW-26 doppel ordering rule: Welle-5 audit-verifier must
        # NOT sign off until Welle-4 state-backing-self-check hash
        # has been stable for >= 10m. Fires when Welle-5 signs off
        # while Welle-4 hash recently changed.
        expr: |
          (
            wakir_welle_schluss_audit_signoff{welle="welle-5"} == 1
          )
          and
          (
            changes(wakir_state_backing_self_check_hash{welle="welle-4"}[10m]) > 0
          )
        for: 60s
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-5
          partner_welle: welle-4
          kw_week: kw-26
          topology: doppel
          ordering: welle-4-must-stabilize-first
        annotations:
          summary: "Welle-5 signed off while Welle-4 state-backing-hash still moving"
          description: >-
            Welle-5 audit-verifier signed off but Welle-4 state-
            backing-self-check-hash changed within the last 10m.
            ADR-0066 KW-26-doppel ordering: Welle-4 must stabilize
            BEFORE Welle-5 signs off, otherwise the verifier
            attested over a moving target. Audit invalid; rerun
            Welle-5 verification after Welle-4 hash quiet.
          runbook_url: "https://wakir-labs.example/runbooks/welle-5-signoff-ordering"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand + activity-log:append + henrik-audit-trail"

  - name: welle-6-alerts
    interval: 30s
    rules:
      - alert: WakirWelle6SubscribeLoopStall
        # Welle-6 subscribe_loop: NO messages flowing on the
        # JetStream subscriber for >= 2m. Subscriber-side stall
        # detection (publisher could still be live).
        expr: |
          rate(wakir_welle6_subscribe_loop_message_delivered_total[2m]) == 0
        for: 2m
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-6
          component: subscribe_loop
          kw_week: kw-27
          topology: doppel
        annotations:
          summary: "Welle-6 subscribe-loop stalled (no message delivery for >= 2m)"
          description: >-
            rate(wakir_welle6_subscribe_loop_message_delivered_total)
            = 0 over a 2m window. The subscriber is not receiving
            messages -- either consumer-ack failure, broker
            disconnect, or subject-binding lost. Check JetStream
            consumer state; verify NATS-Mode (Tag-41 Bug-42
            regression check); inspect SPIFFE auth.
          runbook_url: "https://wakir-labs.example/runbooks/welle-6-subscribe-loop-stall"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand + activity-log:append"

      - alert: WakirWelle6SubscribeLoopReplayStorm
        # Welle-6 subscribe_loop: REPLAY-STORM. JetStream re-
        # delivery counter spiking indicates consumer-ack flow
        # is failing and the broker is retrying. Distinct from
        # stall (which is zero traffic); replay-storm is
        # excessive traffic.
        expr: |
          rate(wakir_welle6_subscribe_loop_redelivery_total[5m]) > 10
        for: 2m
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-6
          component: subscribe_loop
          kw_week: kw-27
          topology: doppel
        annotations:
          summary: "Welle-6 subscribe-loop replay-storm: redelivery > 10 msg/s for 2m"
          description: >-
            rate(wakir_welle6_subscribe_loop_redelivery_total) =
            {{ $value }} msg/s sustained >= 2m. The broker is
            re-delivering messages because the consumer-ack flow
            is failing. Investigate consumer-ack-timeout config,
            consumer crash-loop, or downstream BackendDecision
            handler exception rate.
          runbook_url: "https://wakir-labs.example/runbooks/welle-6-replay-storm"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand + activity-log:append"

  - name: welle-7-alerts
    interval: 30s
    rules:
      - alert: WakirWelle7RecoveryRehearsalFail
