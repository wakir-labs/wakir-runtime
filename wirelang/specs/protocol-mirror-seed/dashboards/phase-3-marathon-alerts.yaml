      # alert; it is a cross-channel audit-trail marker that
      # closes Henrik's Tag-44 Pre-Mortem Class-B3 routing gap.
      #
      # Mutual exclusion with the Tag-45 default-path warning:
      #   ext=1 AND henrik=0 -> this alert (Tag-71, INFO).
      #   ext=0 AND henrik=1 -> Tag-45 alert (WARNING).
      #   both=0 -> pre-decision; nothing fires.
      #   both=1 -> rejected upstream by recording-rule pipeline.
      - alert: WakirPhase3Welle3PreAuditorDesignated
