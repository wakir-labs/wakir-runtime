        expr: increase(wakir_welle7_recovery_rehearsal_failure_total[15m]) > 0
        for: 60s
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-7
          component: recovery_workflow
          kw_week: kw-27
          topology: doppel
        annotations:
          summary: "Welle-7 recovery-rehearsal FAILED"
          description: >-
            wakir_welle7_recovery_rehearsal_failure_total
            increased by {{ $value }} in the last 15m. Pre-cutover
            recovery-rehearsal exit non-zero -- the recovery
            workflow cannot be relied on. Welle-7 cutover BLOCKED
            until rehearsal passes. Engage Welle-7 owner; cross-
            check Welle-4 state-backing snapshot age (recovery
            replays from there).
          runbook_url: "https://wakir-labs.example/runbooks/welle-7-recovery-rehearsal-fail"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand-critical + activity-log:append"

      - alert: WakirWelle7RecoveryWithoutPreAuditWarning
        # Welle-7 recovery_workflow: IIA-1130-default-path
        # WARNING parallel to Welle-3 B3 alert. Fires when Welle-7
        # schluss-audit-signoff arrives with auditor=henrik
        # (default) instead of an AR-designated externer Pre-
        # Auditor. Warning severity per Henrik Pre-Mortem B4
        # (low probability, spec gesetzt).
        expr: |
          (
            wakir_welle_schluss_audit_signoff{welle="welle-7", auditor="henrik"} == 1
          )
          and
          (
            wakir_welle_schluss_audit_signoff{welle="welle-7", auditor="external-pre-auditor"} == 0
          )
        for: 1m
        labels:
          severity: warning
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-7
          kw_week: kw-27
          topology: doppel
          standard: iia-1130
          failure_mode: B4
        annotations:
          summary: "Welle-7 Schluss-Audit-Signoff via Henrik (IIA-1130 default-path, parallels B3)"
          description: >-
            Welle-7 Schluss-Audit-Signoff carries auditor=henrik
            and no external-pre-auditor signoff is recorded. Same
            structure as Tag-45 B3 (Welle-3); Henrik Pre-Mortem B4
            tracks Welle-7 IIA-1130-Konflikt as low-probability /
            high-impact. Warning surface; AR-Hand-Entscheidung on
            external pre-auditor designation steht aus.
          runbook_url: "https://wakir-labs.example/runbooks/welle-7-iia-1130-default"
          notify_path: "ntfy:ar-hand-info + activity-log:append"

      - alert: WakirWelle7RecoveryReplayDivergence
        # Welle-7 recovery_workflow: REPLAY-DIVERGENCE. The
        # recovery replay produces a hash differing from the
        # baseline replay-vector. Counter from Reza Tag-37 replay
        # engine scoped to welle-7.
        expr: increase(wakir_welle7_recovery_replay_divergence_total[10m]) > 0
        for: 60s
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-7
          component: recovery_workflow
          kw_week: kw-27
          topology: doppel
        annotations:
          summary: "Welle-7 recovery replay-divergence vs baseline detected"
          description: >-
            wakir_welle7_recovery_replay_divergence_total increased
            by {{ $value }} in the last 10m. The recovery replay
            produced a state-hash differing from the baseline
            replay-vector. The recovery procedure is non-
            deterministic or the baseline is stale. Cross-check
            Welle-4 state-backing hash; rerun Reza replay engine
            with operator-hand snapshot.
          runbook_url: "https://wakir-labs.example/runbooks/welle-7-replay-divergence"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand + activity-log:append"

  # ---------------------------------------------------------------
  # Tag-64 Cutover-Day-Morgen Trinary-Verdict-Reactive-Routing
  # ---------------------------------------------------------------
  # Three alerts that fire on the trinary verdict class emitted by
  # the Selin Tag-64 Cutover-Day-Morgen Auto-Scheduler. Each alert
  # carries a `routing_class` label that the AlertManager route-tree
  # consumes to fan out into the correct channel set:
  #
  #   READY    -> routing_class=standard
  #               -> notify channel: ntfy:ar-hand-info
  #   CAUTION  -> routing_class=ops-on-call
  #               -> notify channels: pagerduty:sre-oncall + ntfy:ar-hand
  #   BLOCK    -> routing_class=ops-on-call-plus-management
  #               -> notify channels: pagerduty:sre-oncall +
  #                  pagerduty:management + ntfy:ar-hand +
  #                  activity-log:hold-marker
  #
  # All three feed the same recording rule
  # `wakir_cutover_day_morgen_verdict_class` (0=READY, 1=CAUTION,
  # 2=BLOCK). Exactly ONE of the three alarms must fire at any time
  # the verdict is published (mutual exclusion enforced by the
  # decision-equality matcher on the integer-encoded class value).
  - name: cutover-day-morgen-trinary-routing
    interval: 30s
    rules:
      - alert: WakirCutoverDayMorgenVerdictReady
        # READY: Selin Tag-64 Auto-Scheduler verdict = READY.
        # Informational - the AR-Hand sees a single ntfy ping on the
        # standard info topic. No page, no on-call wake-up. Short
        # for-window because the verdict-class metric is a level
        # value (a published verdict stays set until next decision).
        expr: wakir_cutover_day_morgen_verdict_class == 0
        for: 30s
        labels:
          severity: info
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          tag: tag-64
          verdict_class: ready
          routing_class: standard
        annotations:
          summary: "Cutover-Day-Morgen verdict: READY (go for T0 trigger)"
          description: >-
            Selin Tag-64 Cutover-Day-Morgen Auto-Scheduler verdict
            published as READY (verdict_class=0). Last-N Watch-Day
            practice-run verdicts green, Pre-Cutover-Sanity green,
            Stability-Window-Probe green. AR-Hand may proceed with
            T0 operator-trigger at 05:00 UTC. No action required.
          runbook_url: "https://wakir-labs.example/runbooks/cutover-day-morgen-ready"
          notify_path: "ntfy:ar-hand-info + activity-log:append"

      - alert: WakirCutoverDayMorgenVerdictCaution
        # CAUTION: Selin Tag-64 Auto-Scheduler verdict = CAUTION.
        # One or more inputs yellow (drift detected, not blocking).
        # Page the on-call SRE so the verdict-rationale is reviewed
        # before T0. Standard channel also receives a copy for
        # audit-trail completeness; the route-tree splits on the
        # `routing_class=ops-on-call` label.
        expr: wakir_cutover_day_morgen_verdict_class == 1
        for: 30s
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          tag: tag-64
          verdict_class: caution
          routing_class: ops-on-call
        annotations:
          summary: "Cutover-Day-Morgen verdict: CAUTION (drift detected; review before T0)"
          description: >-
            Selin Tag-64 Cutover-Day-Morgen Auto-Scheduler verdict
            published as CAUTION (verdict_class=1). One or more
            input gates yellow: review the Auto-Scheduler envelope
            (out/cutover-day-morgen-verdict.json) for which gate
            (last-N watch-day, sanity, stability) drifted. Decision
            authority: AR-Hand. SRE on-call must acknowledge within
            10 minutes; otherwise escalate to AR.
          runbook_url: "https://wakir-labs.example/runbooks/cutover-day-morgen-caution"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand + activity-log:append"

      - alert: WakirCutoverDayMorgenVerdictBlock
        # BLOCK: Selin Tag-64 Auto-Scheduler verdict = BLOCK.
        # One or more inputs red (defect detected); the go/no-go
        # for Cutover-Day must be re-deliberated. Page-storm:
        # pagerduty fans out to ops-on-call AND management; AR-Hand
        # sees the ntfy storm; a Mira-Hand-Hold-Marker is written
        # to the activity-log so the operator-trigger pipeline
        # cannot fire T0 without explicit unblock. The route-tree
        # splits on `routing_class=ops-on-call-plus-management`.
        expr: wakir_cutover_day_morgen_verdict_class == 2
        for: 30s
        labels:
          severity: page-storm
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          tag: tag-64
          verdict_class: block
          routing_class: ops-on-call-plus-management
        annotations:
          summary: "Cutover-Day-Morgen verdict: BLOCK (cutover go/no-go must be re-deliberated)"
          description: >-
            Selin Tag-64 Cutover-Day-Morgen Auto-Scheduler verdict
            published as BLOCK (verdict_class=2). One or more input
            gates red: review the Auto-Scheduler envelope (out/
            cutover-day-morgen-verdict.json) and the upstream gate
            verdicts immediately. Mira-Hand-Hold-Marker emitted to
            activity-log; T0 operator-trigger pipeline is HELD until
            explicit AR-Hand unblock. Escalation to AR after 5
            minutes of unacknowledged storm.
          runbook_url: "https://wakir-labs.example/runbooks/cutover-day-morgen-block"
          notify_path: "pagerduty:sre-oncall + pagerduty:management + ntfy:ar-hand + activity-log:hold-marker"
