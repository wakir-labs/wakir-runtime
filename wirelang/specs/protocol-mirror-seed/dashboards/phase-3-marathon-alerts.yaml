          description: >-
            AC-4 ('cross_modul_drift_count == 0 over marathon
            window') reads true while the live drift counter is
            > 0. Recording-rule lag or window-boundary drift.
            Henrik Tag-44 Pre-Mortem Class-C1. Hold AR-Hand-
            Final-Sign-Off; rebuild recording rule.
          runbook_url: "https://wakir-labs.example/runbooks/failure-mode-c1-marker-false-positive"
          notify_path: "pagerduty:sre-oncall + activity-log:append + henrik-marker-audit"

  - name: phase-3-marathon-failure-mode-hot-spot-welle-3-4
    interval: 30s
    rules:
      - alert: WakirPhase3HotSpotWelle3Welle4Coupling
        # Cross-Welle-Hot-Spot: Welle-3 -> Welle-4 structural
        # coupling per Henrik Pre-Mortem Section 3 "Strukturelle
        # Hot-Spots" item 1. Fires if BOTH conditions hold:
        # (a) Welle-3 bridge-audit-writer event-rate > 1.5x baseline
        # (b) Welle-4 state-backing-self-check delta != 0
        # for >= 2m. This is the precise coupling signal.
        expr: |
          (
            (
              rate(persona_engine_backend_decision_total{welle="welle-3",subject="audit-bridge"}[5m])
              /
              avg_over_time(rate(persona_engine_backend_decision_total{welle="welle-3",subject="audit-bridge"}[5m])[1h:5m] offset 24h)
            ) > 1.5
          )
          and
          (
            changes(wakir_state_backing_self_check_hash{welle="welle-4"}[5m]) > 0
          )
        for: 2m
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          failure_mode: A1+A5-coupling
          hot_spot: welle-3-to-welle-4
        annotations:
          summary: "Hot-Spot Welle-3->Welle-4: audit-bridge spike + state-backing-hash drift"
          description: >-
            Henrik Pre-Mortem Hot-Spot #1: Welle-3 audit-bridge
            event-rate elevated (>1.5x baseline) WHILE Welle-4
            state-backing-self-check hash changes detected. This
            is the precise A5+A1 coupling worst-case auslöser
            (Pre-Mortem Section 2.2). Immediate AR-Hand-Stop on
            Welle-4 cutover; quarantäne bridge-audit-writer.
          runbook_url: "https://wakir-labs.example/runbooks/hot-spot-welle-3-4"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand-critical + activity-log:append"

      - alert: WakirPhase3HotSpotWelle4Welle5Welle7Coupling
        # Hot-Spot #2: Welle-4 state-backing as persistence truth
        # for Welle-5/7. Fires when Welle-4 state-backing hash
        # drifts AND Welle-5 audit-verifier signs-off OR Welle-7
        # recovery-pre-audit reads state-backing.
        expr: |
          (
            changes(wakir_state_backing_self_check_hash{welle="welle-4"}[10m]) > 0
          )
          and
          (
            (wakir_welle_schluss_audit_signoff{welle="welle-5"} == 1)
            or
            (wakir_welle_pre_audit_state_backing_read_total{welle="welle-7"} > 0)
          )
        for: 5m
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          failure_mode: A3+A8-coupling
          hot_spot: welle-4-to-welle-5-welle-7
        annotations:
          summary: "Hot-Spot Welle-4->Welle-5/7: state-backing drift consumed by downstream welle"
          description: >-
            Welle-4 state-backing-self-check hash changed AND
            either Welle-5 audit-verifier already signed-off
            using that state, or Welle-7 recovery-pre-audit is
            reading state-backing. Henrik Pre-Mortem Hot-Spot
            #2. Cascade-risk: silent state-drift propagation to
            Welle-5/7. Pause Welle-5/7; rerun Pre-Cutover-Probe
            on Welle-4 with operator-hand snapshot.
          runbook_url: "https://wakir-labs.example/runbooks/hot-spot-welle-4-5-7"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand-critical + activity-log:append"

  # =============================================================
  # Tag-50 Welle-N-Specific Alert-Groups
  # Per-welle scoped alarms, separate from Tag-40/45 aggregate +
  # hot-spot rules. Each group contains 2-3 alarms specific to
  # the welle's component identity and KW-week role.
  # =============================================================

  - name: welle-1-alerts
    interval: 30s
    rules:
      - alert: WakirWelle1V907VerifyRustRateCollapse
        # Welle-1 v907_verify rust-self-score below 95% for >= 2m
        # indicates the rust-implementation is silently falling back
        # to the python path -- the cutover acceptance criterion
        # (>= 95% rust-rate on KW-24 doppel) is breached.
        expr: persona_engine_welle1_v907_verify_self_score < 95
        for: 2m
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-1
          component: v907_verify
          kw_week: kw-24
          topology: doppel
        annotations:
          summary: "Welle-1 v907_verify rust-self-score < 95% (KW-24 doppel)"
          description: >-
            persona_engine_welle1_v907_verify_self_score =
            {{ $value }}% sustained < 95 for >= 2m. ADR-0066
            KW-24-doppel rust-rate acceptance gate breached.
            Engage Welle-1 owner; rerun Phase-2 cross-modul
            stress-oracle; consider AR-Hand-Stop before Welle-2
            tracks the divergence into the doppel-week health-
            score.
          runbook_url: "https://wakir-labs.example/runbooks/welle-1-rust-rate-collapse"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand + activity-log:append"

      - alert: WakirWelle1Welle2DoppelDivergence
        # Welle-1 + Welle-2 are the KW-24 doppel-partners; their
        # self-scores should track within 5pp. Larger divergence
        # signals one welle is drifting alone and the doppel-health
        # tile turns red.
        expr: |
          abs(
            persona_engine_welle1_v907_verify_self_score
            -
            persona_engine_welle2_svid_workload_identity_self_score
          ) > 5
        for: 3m
        labels:
          severity: ticket
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-1
          partner_welle: welle-2
          kw_week: kw-24
          topology: doppel
        annotations:
          summary: "Welle-1/Welle-2 doppel divergence > 5pp on self-score"
          description: >-
            |Welle-1 self-score - Welle-2 self-score| = {{ $value }}pp
            sustained for >= 3m. The KW-24 doppel-partners should
            track tightly; large divergence indicates one welle's
            backend has shifted independently. Inspect both
            telemetry-emitter outputs and the Phase-2 stress-oracle.
          runbook_url: "https://wakir-labs.example/runbooks/welle-1-2-doppel-divergence"
          notify_path: "ticket:sre-ops + activity-log:append"

  - name: welle-2-alerts
    interval: 30s
    rules:
      - alert: WakirWelle2SvidRotationFailure
        # Welle-2 svid_workload_identity: SPIFFE SVID rotation
        # failures break workload-identity assertions on Welle-2
