          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand + activity-log:append"

      - alert: WakirWelle2SelfScoreCollapse
        # Welle-2 self-score below 95% (parallel to Welle-1).
        expr: persona_engine_welle2_svid_workload_identity_self_score < 95
        for: 2m
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-2
          component: svid_workload_identity
          kw_week: kw-24
          topology: doppel
        annotations:
          summary: "Welle-2 svid_workload_identity rust-self-score < 95% (KW-24 doppel)"
          description: >-
            persona_engine_welle2_svid_workload_identity_self_score
            = {{ $value }}% sustained < 95 for >= 2m. ADR-0066
            KW-24-doppel rust-rate acceptance gate breached for
            the Welle-2 leg. Engage Welle-2 owner; rerun Phase-2
