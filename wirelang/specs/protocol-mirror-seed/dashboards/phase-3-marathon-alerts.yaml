        # state-backing-migration tooling.
        expr: increase(wakir_welle4_state_backing_migration_rollback_total[10m]) > 0
        for: 60s
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-4
          component: state_backing
          kw_week: kw-26
          topology: doppel
        annotations:
