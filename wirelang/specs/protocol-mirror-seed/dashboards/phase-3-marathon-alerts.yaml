          runbook_url: "https://wakir-labs.example/runbooks/welle-2-self-score-collapse"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand + activity-log:append"

  - name: welle-3-alerts
    interval: 15s
    rules:
      - alert: WakirWelle3SelfReferenceTrapFire
        # Welle-3 SELF-REFERENCE-TRAP-FIRE: bridge_audit_writer
        # auditing its own BackendDecision stream. Tighter
        # threshold + faster window than the Tag-45 A5 alert; this
        # is the welle-scoped page that fires FIRST on KW-25 SOLO.
        # Distinct from Tag-45 A5 (which is the failure-mode-class
        # alert) and from the Hot-Spot #1 (which requires Welle-4
        # state-backing-hash drift coupling).
        expr: |
          (
            rate(persona_engine_backend_decision_total{welle="welle-3",subject="audit-bridge"}[2m])
            /
            avg_over_time(rate(persona_engine_backend_decision_total{welle="welle-3",subject="audit-bridge"}[2m])[1h:2m] offset 24h)
          ) >= 2
        for: 90s
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-3
          component: bridge_audit_writer
          kw_week: kw-25
          topology: solo
          critical: kw-25-solo
        annotations:
          summary: "Welle-3 Self-Reference-Trap fired (rate >= 2x baseline, 90s window)"
          description: >-
            BackendDecision-event-rate on Welle-3 audit-bridge
            >= 2x 24h-offset baseline for >= 90s. Welle-3 is on
            KW-25 SOLO -- bridge_audit_writer auditing itself is
            a recursion-loop signature. Immediate AR-Hand-Stop;
            quarantine bridge-audit-writer-events; per IIA-1130
            engage AR-designated externer Pre-Auditor (NOT Henrik
            for self-audit independence).
          runbook_url: "https://wakir-labs.example/runbooks/welle-3-self-reference-trap-fire"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand-critical + activity-log:append + henrik-iia-1130-trigger"

      - alert: WakirWelle3SoloTopologyViolation
        # Welle-3 KW-25 SOLO topology: NO parallel welle may be
        # active during the Welle-3 cutover window. Detection via
        # welle-state count: more than one welle in non-terminal
        # states (1=pre, 2=in, 3=rollback, 4=complete) while Welle-3
        # is in state 1 or 2 means a parallel welle is running.
        expr: |
          (
            persona_engine_phase_3c_welle_state{welle="welle-3"} == 1
            or
            persona_engine_phase_3c_welle_state{welle="welle-3"} == 2
          )
          and
          (
            count(persona_engine_phase_3c_welle_state == 1) + count(persona_engine_phase_3c_welle_state == 2) > 1
          )
        for: 60s
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-3
          kw_week: kw-25
          topology: solo
          critical: kw-25-solo
        annotations:
          summary: "Welle-3 SOLO topology violated: parallel welle active in KW-25"
          description: >-
            Welle-3 is in pre_cutover or in_cutover state AND at
            least one other welle is also in pre_cutover/in_cutover.
            ADR-0066 §Welle-3 forbids parallelism during KW-25 to
            preserve Henrik full-audit-bandwidth and avoid A5
            self-reference-trap amplification. Pause the conflicting
            welle immediately.
          runbook_url: "https://wakir-labs.example/runbooks/welle-3-solo-topology-violation"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand-critical + activity-log:append"

      - alert: WakirWelle3StressOracleDivergence
        # Welle-3 bridge_audit_writer self-score vs Phase-2 stress
        # oracle: divergence > 0.5pp is the ADR-0066 Welle-3
        # immediate-rollback trigger (per Henrik / Internal Audit
        # caution documented in the welle-status dashboard).
        expr: |
          abs(
            persona_engine_welle3_bridge_audit_writer_self_score
            -
            phase_2_acceptance_gate_cross_modul_stress_oracle{component="bridge_audit_writer"}
          ) > 0.5
        for: 60s
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-3
          component: bridge_audit_writer
          kw_week: kw-25
          topology: solo
        annotations:
          summary: "Welle-3 self-score diverges from stress-oracle by > 0.5pp"
          description: >-
            |Welle-3 self-score - Phase-2 stress-oracle| = {{ $value }}pp
            for >= 60s. ADR-0066 Welle-3 immediate-rollback trigger
            (Henrik caution in welle-status dashboard panel 43).
            Self-reading score has decoupled from the independent
            oracle -- bridge_audit_writer is reporting drift in its
            own self-audit pipeline. Initiate rollback procedure.
          runbook_url: "https://wakir-labs.example/runbooks/welle-3-stress-oracle-divergence"
          notify_path: "pagerduty:sre-oncall + ntfy:ar-hand-critical + activity-log:append"

  - name: welle-4-alerts
    interval: 30s
    rules:
      - alert: WakirWelle4StateReadFail
        # Welle-4 state_backing: STATE-READ-FAIL on the self-check.
        # Counter increments when a state-backing read returns a
        # hash that does not match the previously persisted value
        # (silent corruption detector). Coupling source for Hot-
        # Spot #2.
        expr: increase(wakir_welle4_state_backing_read_fail_total[5m]) > 0
        for: 60s
        labels:
          severity: page
          phase: phase-3-marathon
          team: sre
          owner: noa-sre
          adr: adr-0066
          welle: welle-4
          component: state_backing
          kw_week: kw-26
          topology: doppel
        annotations:
          summary: "Welle-4 state-backing READ-FAIL detected"
          description: >-
            wakir_welle4_state_backing_read_fail_total increased
            by {{ $value }} in the last 5m. State-backing read
            returned a hash mismatching the persisted value --
            silent corruption signature. Cascade risk into Welle-5
            audit-verifier and Welle-7 recovery (Hot-Spot #2).
