      # ---------------------------------------------------------
      # Tag-71 Welle-3 Pre-Auditor Routing Element (Noa SRE)
      # ---------------------------------------------------------
      # Positive-confirmation counterpart to
      # WakirPhase3FailureModeB3Iia1130DefaultPath: fires when the
      # AR-Hand has designated the external Pre-Auditor per the
      # welle-3-iia-1130-pre-decision-spec-2026-05-18.md, i.e. the
      # Schluss-Audit-Signoff for Welle-3 carries
      # auditor=external-pre-auditor instead of auditor=henrik.
