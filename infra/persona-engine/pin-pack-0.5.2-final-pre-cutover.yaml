# (Tag-48 PR #313): no crate added, no crate removed, no version
# bumped. The Tag-50 DRIFT-S4 reconciliation (Pin-Pack as SoT under
# spec v0.4.2 §4.1) and the Tag-51 10-Decision-Engine-Resilience
# contract are both pinned by reference in the companion manifest
# (`wirelang/persona_engine/MANIFEST-0.5.2-final-pre-cutover.md`).
#
# This file is the machine-readable counterpart to §3 of that
# manifest. It is consumed by:
#
#   * `wirelang/tests/persona_engine/test_manifest_0_5_2_final_pre_cutover.py`
#     — hermetic Tag-52 integrity tests verify each crate's
