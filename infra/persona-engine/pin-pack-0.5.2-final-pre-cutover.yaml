# Cross-cutting timeout knob; uniform across every Rust subprocess.
cross_backend:
  timeout_env: WAKIR_RUST_BACKEND_TIMEOUT_S
  default_timeout_s: 30

# Resilience contract pinned by reference (Tag-51 / PR #327).
resilience_contract:
  pinned_test_module: wirelang/tests/persona_engine/test_tag51_10_decision_engine_resilience.py
  pinned_test_count: 36
  invariant: "Under any degraded-backend posture (binary-missing, subprocess-timeout, validation-error), Stage-1 still emits exactly 10 BackendDecision records in canonical boot order."

# Spec source-of-truth pin (Tag-50 / PR #320, v0.4.2 §4.1).
spec_source_of_truth:
  spec_file: wirelang/specs/wirelang-spec-v0-4-2.md
  section: "4.1"
  drift_id: DRIFT-S4
  invariant: "Pin-Pack-0.5.2-final-pre-cutover.yaml is the single source of truth for the §4.1 ENV-flag schema. Where spec and Pin-Pack disagree, the spec is wrong and must be patched."

# Legacy-ENV detection hook (Tag-51 Reza / PR #329).
