#     cross-substrate gate cross-checks the manifest table against
#     this file and fails if the two diverge.
#
# Edit discipline
# ---------------
# Bumping a crate version here is an ADR-level decision: the
# Phase-3a Doppelbetrieb gate hashes the joint pin set, and a bump
# changes the parity fingerprint. Do not edit casually.

