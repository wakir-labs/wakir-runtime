#
# Phase-2 Sprint-8 Tag-1 — SPIRE-Server hermetic config for the
# ``partner.test`` trust-domain side of the Federation-Bundle-Endpoint
# substrate. Mirror of ``spire-server-wakir.conf`` with trust-domain
# and federates_with-peer swapped.
#
# See ``spire-server-wakir.conf`` header for the full rationale and
# the trust-domain choice. This file documents only the diff.

server {
    bind_address = "127.0.0.1"
    bind_port    = "8081"

    # Trust-domain literal — ``partner.test`` is the peer hermetic
    # federation trust-domain. The wakir side is ``wakir.test``.
    trust_domain = "partner.test"

    data_dir     = "/var/lib/spire/server"

    log_level    = "INFO"

    default_jwt_svid_ttl  = "15m"
    default_x509_svid_ttl = "1h"

    ca_key_type = "ec-p256"
    ca_ttl      = "24h"

    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port    = 8443
            profile = "https_spiffe"
        }
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire/server/keys.json"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }
}

# Federates-with block: peer is the wakir.test side.
federates_with "wakir.test" {
    bundle_endpoint_url     = "https://spire-server-wakir:8443"
    bundle_endpoint_profile = "https_spiffe" {
        endpoint_spiffe_id = "spiffe://wakir.test/spire/server"
    }
}
