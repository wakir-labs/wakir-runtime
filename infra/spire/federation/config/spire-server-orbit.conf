#
# Phase-2 Sprint-10 Tag-1 — SPIRE-Server hermetic config for the
# ``orbit.test`` trust-domain side of the Cross-VM Federation Live
# Trial. This is the **Partner-VM-Side** counterpart to
# ``spire-server-wakir.conf`` for the AR-decision dogfood-first
# topology: TWO Proxmox-VMs on the same host (Wakir-Side =
# ``wakir.test``, Partner-Side = ``orbit.test``), each running its own
# SPIRE-Server-Federation Quadlet stack, federated over a
# Proxmox-internal bridge network.
#
# Why ``orbit.test`` (and not ``partner.test``)?
#
#   The existing ``spire-server-partner.conf`` is the Sprint-8 Tag-1
#   **same-host hermetic** Federation peer (both servers on the same
#   ``wakir-federation`` bridge network inside ONE VM, via compose).
#   That config stays as the hermetic-test fixture and remains
#   byte-paired with ``spire-server-wakir.conf`` for the
#   cross-side-byte-parity invariant in
#   ``tests/test_spire_agent_federation_config.py``.
#
#   ``orbit.test`` is the **cross-VM** peer trust-domain — semantically
#   a different role (separate VM, separate cgroup-isolation, separate
#   Proxmox-snapshot lifecycle). The naming preserves Mira's
#   AR-2026-05-14-19:30-CEST Variante-C recommendation (Trust-Domain-
#   per-VM, ``.test`` TLD parity).
#
#   Both ``wakir.test`` and ``orbit.test`` are IANA-reserved per
#   RFC 6761 §6.5 (the ``.test`` reservation). Production Phase-3a
#   migrates both to the ``<FTD-ID>.wakir.dev`` family.
#
# Cross-VM DNS — what's different vs. spire-server-partner.conf:
#
#   The hermetic ``partner.test`` config peers with
#   ``https://spire-server-wakir:8443`` — the same-host Podman bridge
#   DNS. The Cross-VM ``orbit.test`` config MUST peer with the
#   **wakir-side VM's bundle-endpoint IP** (or a hostname mapped via
#   the Operator-Hand-installed ``/etc/hosts`` entry). The default
#   below assumes the Proxmox-internal bridge subnet 10.0.42.0/24
#   with the wakir-side VM at 10.0.42.10 (Recipe §3.2); operators on
#   alternative subnets MUST substitute the actual IP/hostname before
#   ``systemctl start``.
#
# Bring-up: see ``PARTNER_VM_BRING_UP_RECIPE.md`` (Sprint-10 Tag-1).

server {
    bind_address = "127.0.0.1"
    bind_port    = "8081"

    # Trust-domain literal — ``orbit.test`` is the Cross-VM peer hermetic
    # federation trust-domain. The wakir-side is ``wakir.test``.
    trust_domain = "orbit.test"

    data_dir     = "/var/lib/spire/server"

    log_level    = "INFO"

    default_jwt_svid_ttl  = "15m"
    default_x509_svid_ttl = "1h"

    ca_key_type = "ec-p256"
    ca_ttl      = "24h"

    # Federation block: bundle-endpoint listener. Profile parity with
    # the wakir-side (https_spiffe) so both VMs run the same posture.
    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port    = 8443
            profile = "https_spiffe"
        }
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire/server/keys.json"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }
}

# Federates-with block: peer is the wakir.test side on the OTHER VM.
#
# Cross-VM URL rationale: the peer hostname ``spire-server-wakir`` is
# resolved on this VM via an Operator-Hand-installed ``/etc/hosts``
# entry pointing at the wakir-side VM's IP on the Proxmox-internal
# bridge (default 10.0.42.10). The URL-shape (``https://spire-server-
# <peer-side>:8443``) is byte-identical to the same-host hermetic
# config — only the DNS-resolution layer changes, NOT the SPIRE-
# config-syntax. This preserves Reza's PR #51 adapter
# ``trust_domain_to_url`` map shape:
#
#   trust_domain_to_url={
#       "wakir.test": "https://spire-server-wakir:8443/bundle",
#       "orbit.test": "https://spire-server-orbit:8443/bundle",
#   }
#
# Note (Zone-A cross-review item, 2026-05-14 19:55 CEST): the SPIRE-
# server bundle-endpoint listener serves the bundle at the listener's
# root path; Reza's adapter pins the URL with a ``/bundle`` suffix.
# These are **distinct URL surfaces** in SPIRE — the bundle-endpoint
# accepts a configurable path prefix via ``federation.bundle_endpoint
# .acme.tos_accepted`` (web-PKI path-prefix is the ACME-acme-protocol
# variant, NOT the https_spiffe profile). For Phase-2c live-fetcher
# operation, EITHER the adapter strips the ``/bundle`` suffix before
# the HTTPS GET, OR the SPIRE-server is configured to serve at
# ``/bundle`` (https_web profile only). Zone-A item for tomorrow's
# AR-decision-slot.
federates_with "wakir.test" {
    bundle_endpoint_url     = "https://spire-server-wakir:8443"
    bundle_endpoint_profile = "https_spiffe" {
        endpoint_spiffe_id = "spiffe://wakir.test/spire/server"
    }
}
