#
# SPIRE-Server hermetic config for the
# ``wakir.test`` trust-domain side of the Federation-Bundle-Endpoint
# substrate. Paired with ``spire-server-partner.conf`` (the
# ``partner.test`` side) under ``infra/spire/federation/compose/spire-
# federation.yaml``.
#
# Trust-Domain rationale (hermetic-only):
#   ``wakir.test`` and ``partner.test`` are both IANA-reserved TLDs
#   per RFC 6761 §6.5 (the ``.test`` reservation). They are picked
#   to stay clearly distinguishable from the Phase-2 ``example.test``
#   hermetic substrate (compose/spire.yaml — single-server-side) and
#   from the Phase-3a production federation trust-domain
#   ``<FTD-ID>.wakir.dev``.
#
# What this config IS:
#   * Hermetic Mock/Stub config for a SPIRE-Server that participates in
#     a SPIFFE federation bundle exchange with one peer trust-domain
#     (``partner.test``).
#   * A ``federation`` HCL block per the SPIRE-Server config reference
#     (https://github.com/spiffe/spire/blob/main/doc/spire_server.md
#     §"Federation configuration") which declares the bundle-endpoint
#     listener address, port, and TLS profile.
#   * A ``federates_with`` block per the same reference which declares
#     the peer trust-domain, peer bundle-endpoint URL, and peer
#     SPIFFE-ID (the bootstrap trust-anchor).
#
# What this config is NOT:
#   * No live federation against a production peer (the peer URL points
#     at the hermetic ``spire-server-partner`` sidecar inside the
#     ``wakir-federation`` bridge network).
#   * No SVID issuance pre-loaded — the test surface for the X.509-SVID
#     cross-trust verify is the hermetic CLI-roundtrip
#     in ``infra/spire/federation/tests/test_spire_fed_bundle_cli.py``
#     and the operator-hand live-smoke documented in
#     ``infra/spire/federation/README.md`` §3.
#   * No NATS-JWT-Auth integration (Phase-2.4 surface is unchanged).
#
# Bring-up: see ``infra/spire/federation/README.md`` §2.

server {
    # Bind the gRPC API on all interfaces INSIDE the container's
    # network namespace — which is not the host's.
    #
    # The SPIRE-Agent runs in its OWN container and dials the server
    # over the ``wakir-federation`` bridge by its NetworkAlias
    # (``spire-server-<side>``, see the server Quadlet). A loopback
    # bind is the container's own loopback: the agent never reaches it
    # and crash-loops with ``connection refused`` on 8081 at every
    # attestation attempt. Measured on both pilot VMs 2026-09-22;
    # unchanged since the config landed, so the federation path never
    # worked for an agent in its own container. The single-org config
    # has bound 0.0.0.0 since the 2026-05-14 bring-up for exactly this
    # reason — the comment that used to sit here claimed an intent its
    # mechanism did not produce.
    #
    # What keeps the gRPC control-plane (token-generate, agent-list,
    # bundle-set) off the network is NOT this line. It is the Quadlet,
    # which publishes 8081 to the HOST loopback only
    # (``PublishPort=127.0.0.1:<HOST_GRPC_PORT>:8081``) and to nothing
    # else. Reachability is granted on the container network; host
    # exposure stays gated at the publish layer. Do not add a
    # PublishPort for 8081 on 0.0.0.0.
    #
    # The federation-bundle-endpoint (8443) remains the only
    # public-facing listener — see ``federation { bundle_endpoint }``.
    bind_address = "0.0.0.0"
    bind_port    = "8081"

    # Trust-domain literal — ``wakir.test`` is the wakir-side hermetic
    # federation trust-domain. The peer side is ``partner.test``.
    trust_domain = "wakir.test"

    data_dir     = "/var/lib/spire/server"

    log_level    = "INFO"

    default_jwt_svid_ttl  = "15m"
    default_x509_svid_ttl = "1h"

    ca_key_type = "ec-p256"

    # Short hermetic CA-TTL forces the rotation path exercise without
    # waiting for real production time. Production default is 30 days.
    ca_ttl = "24h"

    # Federation block: declares this server's own bundle-endpoint
    # listener — the public-facing HTTPS endpoint the peer fetches our
    # trust-bundle from. SPIRE supports two profiles:
    #   * ``https_web``: standard PKI; requires a web-PKI cert for the
    #     listener hostname. Production posture.
    #   * ``https_spiffe``: SPIFFE-authenticated; the listener uses an
    #     X.509-SVID issued by this very server (self-presenting) and
    #     the peer pins our trust-bundle as the bootstrap anchor.
    #     Hermetic-friendly because no web-CA is required.
    #
    # picks ``https_spiffe`` for the hermetic
    # bootstrap. Phase-3a production posture is expected to migrate to
    # ``https_web`` once the federation-trust-domain DNS-anchor and
    # web-PKI cert provisioning workflow is in place (ADR-0020 §V-908
    # P2-3 follow-up).
    #
    # Bug-31 substance-fix: SPIRE 1.14.6 does NOT accept
    # ``profile = "https_spiffe"`` as a flat attribute inside
    # ``bundle_endpoint`` — the HCL parser rejects it with
    # ``malformed configuration``. The profile MUST be either declared
    # as a named-block (``profile "https_spiffe" { ... }``) or omitted
    # entirely; ``https_spiffe`` is the default when unspecified. The
    # M-3 Live-Trial (2026-05-15 15:00 CEST) verified the empty form
    # works against a real SPIRE-Server. We omit the profile to keep
    # the config minimal and rely on the documented default. See
    # https://github.com/spiffe/spire/blob/v1.14.6/doc/spire_server.md
    # §"Federation configuration".
    #
    # Bug-32 substance-fix: ``federates_with`` blocks
    # MUST be nested inside ``server.federation { }`` per the SPIRE
    # 1.14.6 config-schema; the prior top-level placement (lines below
    # the closing ``server { }`` brace) emitted ``malformed configuration``
    # at parse-time. The block now sits beside ``bundle_endpoint``.
    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port    = 8443
        }

        # Federates-with block: declares the peer trust-domain we
        # federate with. The peer's bundle-endpoint URL points at the
        # ``spire-server-partner`` sidecar inside the
        # ``wakir-federation`` bridge network
        # (compose/spire-federation.yaml). The peer's
        # bootstrap-trust-anchor SPIFFE-ID is the partner's own
        # bundle-endpoint SVID under
        # ``spiffe://partner.test/spire/server``.
        #
        # Bug-30 substance-fix: ``bundle_endpoint_profile``
        # uses the named-block syntax (``attribute "value" { block }``),
        # NOT the rejected ``attribute = "value" { block }`` form.
        federates_with "partner.test" {
            bundle_endpoint_url = "https://spire-server-partner:8443"
            bundle_endpoint_profile "https_spiffe" {
                endpoint_spiffe_id = "spiffe://partner.test/spire/server"
            }
        }
    }
}

plugins {
    # DataStore: SQLite is the Phase-2 boring-default. Phase-3a path is
    # SQLite-dump → Postgres-import (mirror of compose/spire.yaml).
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }

    # KeyManager: disk is the Phase-2 boring-default. Phase-3 path is
    # Vault-Transit-KeyManager (ADR-0020 §Vault 1.21 SPIFFE-Auth).
    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire/server/keys.json"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }
}

# NOTE (Bug-32 substance-fix): the prior top-level
# ``federates_with "partner.test" { ... }`` block was moved inside
# ``server.federation { }`` above. The SPIRE 1.14.6 config-schema
# rejects top-level ``federates_with`` with ``malformed configuration``.
# The M-3 Live-Trial verified the nested
# form against a real SPIRE-Server.
