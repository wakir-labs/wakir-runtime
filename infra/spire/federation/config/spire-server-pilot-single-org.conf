#
# Phase-2 Sprint-9 Tag-5 — SPIRE-Server config for the SINGLE-ORG
# Phase-1b Pilot-VM bring-up (Bug 7 substance-fix per
# ``agents-workspaces/mira/outbox/2026-05-13-pilot-bringup-bug-bilanz.md``).
#
# Bug 7 root cause (PILOT_BRING_UP_TROUBLESHOOTING.md §H1):
#   The Sprint-8 Tag-1 ``spire-server-wakir.conf`` declares a
#   ``federates_with "partner.test"`` block plus a
#   ``federation { bundle_endpoint { ... } }`` block. On a single-org
#   pilot VM only the ``wakir`` side is installed — there IS no
#   ``partner`` peer. SPIRE-Server fails to resolve the peer DNS name
#   ``spire-server-partner`` inside the ``wakir-federation`` bridge
#   network and crash-loops on bundle-endpoint-fetch.
#
# This config is the SINGLE-ORG variant: no federates_with, no
# bundle-endpoint listener, no peer. It is the default for
# ``wakir-pilot-bootstrap.sh`` Phase-1b bring-up. Sprint-9-Tag-5
# bootstrap wires this file at ``/etc/wakir/spire-federation/
# spire-server-pilot-single-org.conf`` when ``WAKIR_PILOT_MODE=single-org``
# (the default). The Sprint-8 Tag-1 federation configs remain in place
# for the future Phase-2.1 dual-side bring-up (``WAKIR_PILOT_MODE=
# federation``).
#
# Trust-Domain rationale (hermetic-only):
#   ``wakir.test`` matches the agent-side config
#   (``spire-agent-pilot-single-org.conf``) and stays clearly
#   distinguishable from the Phase-2 ``example.test`` single-trust-domain
#   substrate and the Phase-3a production trust-domain
#   ``<FTD-ID>.wakir.dev``.
#
# What this config IS:
#   * SPIRE-Server config for a single trust-domain with NO federation
#     peer.
#   * gRPC API bound on container loopback (8081), reachable from the
#     paired agent via the ``wakir-federation`` bridge network's
#     internal DNS (``spire-server-wakir``).
#   * NodeAttestor: join_token (Phase-1b manual enrollment).
#   * KeyManager: disk (Phase-2 boring-default; same as the federation
#     variant).
#   * DataStore: SQLite (Phase-2 boring-default).
#
# What this config is NOT:
#   * No federation peer. No ``federates_with`` block.
#   * No bundle-endpoint listener. The single-org server does not export
#     its trust-bundle to a peer; agents fetch the bootstrap-bundle via
#     ``insecure_bootstrap = true`` (see agent-side config).
#   * No NATS-JWT-Auth integration (Phase-2.4 surface unchanged).
#
# Phase-2.1 federation upgrade-path:
#   Re-running ``wakir-pilot-bootstrap.sh`` with ``WAKIR_PILOT_MODE=
#   federation`` selects ``spire-server-wakir.conf`` instead of this
#   file and installs the second side (``partner``). The agent's
#   ``insecure_bootstrap`` flips to ``false`` and ``trust_bundle_path``
#   is wired to the per-side federated-bundles volume. No data loss —
#   the SQLite DataStore + disk KeyManager persist across the mode swap.

server {
    # Sprint-9-Tag-6 Bug 9 substance-fix: bind the gRPC API on
    # ``0.0.0.0`` inside the container, NOT on 127.0.0.1. The agent
    # runs in a separate container on the ``wakir-federation`` bridge
    # network and dials the server via its in-network DNS name
    # (``spire-server-wakir`` -- see ``NetworkAlias`` in the server
    # Quadlet, Bug 10 fix). Loopback-only bind would refuse the
    # cross-container connect and the agent would crash-loop with
    # ``connection refused`` on every attestation attempt
    # (live-bring-up 2026-05-14).
    #
    # The single-org pilot still does NOT expose a public-facing
    # bundle-endpoint on the host: the Quadlet ``PublishPort`` lines
    # bind only to the host loopback (127.0.0.1:8082, 127.0.0.1:8443),
    # so external network reachability is gated at the Podman publish
    # layer, not at the SPIRE bind layer. Phase-2.1 dual-side uses
    # ``spire-server-${side}.conf`` which already binds 0.0.0.0.
    bind_address = "0.0.0.0"
    bind_port    = "8081"

    # Trust-domain literal — ``wakir.test`` is the single-org pilot
    # trust-domain. No federation peer.
    trust_domain = "wakir.test"

    data_dir     = "/var/lib/spire/server"

    log_level    = "INFO"

    default_jwt_svid_ttl  = "15m"
    default_x509_svid_ttl = "1h"

    ca_key_type = "ec-p256"

    # Short hermetic CA-TTL forces the rotation path exercise without
    # waiting for real production time. Production default is 30 days.
    ca_ttl = "24h"

    # NOTE: deliberately NO ``federation { bundle_endpoint { ... } }``
    # block here. The single-org pilot does not export a bundle endpoint
    # because there is no peer to fetch it. Adding the block back would
    # bind a listener on 0.0.0.0:8443 that nobody consumes — harmless
    # but noisy. Phase-2.1 dual-side bring-up uses the
    # ``spire-server-wakir.conf`` variant which DOES carry this block.
}

plugins {
    # DataStore: SQLite (boring-default, mirrors federation variant).
    # Phase-3a migration path: SQLite-dump -> Postgres-import. Both
    # single-org and federation configs share this layout so the
    # mode-swap stays no-loss.
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/var/lib/spire/server/datastore.sqlite3"
        }
    }

    # KeyManager: disk (boring-default, mirrors federation variant).
    # Phase-3 path: Vault-Transit-KeyManager (ADR-0020 §Vault 1.21
    # SPIFFE-Auth).
    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire/server/keys.json"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }
}

# DELIBERATELY NO ``federates_with`` block. The single-org pilot has no
# federation peer. Phase-2.1 dual-side bring-up uses the
# ``spire-server-wakir.conf`` variant which carries the
# ``federates_with "partner.test"`` block.
