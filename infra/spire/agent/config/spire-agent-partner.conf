#
# Phase-2 Sprint-8 Tag-2 — SPIRE-Agent hermetic Mock/Stub config for the
# ``partner.test`` trust-domain side of the Federation-Agent-Sidecar
# substrate. Byte-precise mirror of ``spire-agent-wakir.conf`` with the
# partner trust-domain literal + partner-side server-address.
#
# See ``spire-agent-wakir.conf`` for the full header rationale. Only
# the trust-domain and server-address differ between the two configs;
# all other shape (plugins, socket-path, hardening, bundle-format,
# insecure_bootstrap = false) is identical to keep the cross-side
# byte-parity invariant in tests/test_spire_agent_federation_config.py.

agent {
    data_dir = "/var/lib/spire/agent"

    log_level = "INFO"

    # Trust-domain literal — ``partner.test`` matches the
    # SPIRE-Server-partner side (spire-server-partner.conf).
    trust_domain = "partner.test"

    # Server-Admin-API endpoint. The agent dials the partner-side
    # SPIRE-Server on the ``wakir-federation`` bridge network's
    # internal DNS. Port 8081 matches the partner-side server's gRPC
    # bind_port (see spire-server-partner.conf §server.bind_port).
    server_address = "spire-server-partner"
    server_port    = "8081"

    # Trust-bundle path — same convention as wakir-side: federated-
    # bundles ingest volume (read-only mount of the partner-side
    # server's bundles volume).
    trust_bundle_path = "/var/lib/spire/bundles/bootstrap.jwks"

    # Bundle format: JWKS (federation https_spiffe profile parity).
    trust_bundle_format = "spiffe"

    # Insecure bootstrap stays OFF for federation (parity with
    # wakir-side; production-style bootstrap exercise).
    insecure_bootstrap = false

    # SPIFFE-Workload-API socket path (SPIFFE-spec convention).
    socket_path = "/run/spire/agent-sockets/api.sock"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
