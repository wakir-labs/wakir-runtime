#
# Phase-2 Sprint-10 Tag-1 — SPIRE-Agent hermetic config for the
# ``orbit.test`` trust-domain side of the Cross-VM Federation Live
# Trial. Mirror of ``spire-agent-wakir.conf`` with the orbit
# trust-domain literal + orbit-side server-address.
#
# See ``spire-agent-wakir.conf`` and the companion
# ``spire-server-orbit.conf`` for the full rationale on the
# ``orbit.test`` naming choice and the Cross-VM DNS posture.
#
# Cross-VM DNS — the agent dials the SPIRE-Server on the SAME VM
# (loopback-via-bridge-network ``spire-server-orbit``), so the
# server_address below is symmetric with the wakir-side
# (``spire-server-wakir`` on the wakir-VM, ``spire-server-orbit``
# on the orbit-VM). Peer-bundle-fetch is Cross-VM and is handled
# by the federation listener on port 8443 plus the federates_with
# block on the SPIRE-Server side, NOT here.

agent {
    data_dir = "/var/lib/spire/agent"

    log_level = "INFO"

    # Trust-domain literal — ``orbit.test`` matches the
    # SPIRE-Server-orbit side (spire-server-orbit.conf).
    trust_domain = "orbit.test"

    # Server-Admin-API endpoint. The agent dials the orbit-side
    # SPIRE-Server on the ``wakir-federation`` bridge network's
    # internal DNS. Port 8081 matches the orbit-side server's gRPC
    # bind_port (see spire-server-orbit.conf §server.bind_port).
    server_address = "spire-server-orbit"
    server_port    = "8081"

    # Trust-bundle path — same convention as wakir-side: federated-
    # bundles ingest volume (read-only mount of the orbit-side
    # server's bundles volume).
    trust_bundle_path = "/var/lib/spire/bundles/bootstrap.jwks"

    # Bundle format: JWKS (federation https_spiffe profile parity).
    trust_bundle_format = "spiffe"

    # Insecure bootstrap stays OFF for federation (parity with
    # wakir-side; production-style bootstrap exercise).
    insecure_bootstrap = false

    # SPIFFE-Workload-API socket path (SPIFFE-spec convention).
    socket_path = "/run/spire/agent-sockets/api.sock"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
