#
# Phase-2 Sprint-8 Tag-2 — SPIRE-Agent hermetic Mock/Stub config for the
# ``wakir.test`` trust-domain side of the Federation-Agent-Sidecar
# substrate. Paired with ``spire-agent-partner.conf`` (the
# ``partner.test`` side) under
# ``infra/spire/agent/compose/spire-agent-federation.yaml``.
#
# Trust-Domain rationale (hermetic-only):
#   ``wakir.test`` matches the SPIRE-Server in
#   ``infra/spire/federation/config/spire-server-wakir.conf``. Both are
#   IANA-reserved TLDs per RFC 6761 §6.5 (.test reservation) and are
#   clearly distinguishable from the Phase-2 ``example.test`` single-
#   trust-domain substrate (config/spire-agent.conf — Sprint-6-Tag-9)
#   and from the Phase-3a production federation trust-domain
#   ``<FTD-ID>.wakir.dev``.
#
# What this config IS:
#   * Hermetic Mock/Stub config for a SPIRE-Agent that attests against
#     the wakir-side federation SPIRE-Server and pulls federated peer-
#     bundles for cross-trust-domain X.509-SVID verification.
#   * ``trust_bundle_path`` points at the federated-bundles ingest
#     volume (read-only mount of the server-side bundles volume), which
#     is the JWKS-format bundle staged by the Operator-Hand bootstrap
#     workflow in README §3b. The Tag-1 federation bundle-endpoint
#     listener is the long-term refresh source after bootstrap.
#   * Workload-API socket-path follows the Sprint-6-Tag-9 convention:
#     ``/run/spire/agent-sockets/api.sock``.
#
# What this config is NOT:
#   * No live SPIRE-Agent runs against this file in the hermetic test
#     suite (Phase-2.3 live-gated bring-up + SVID-fetch live-smoke is
#     Operator-Hand per ADR-0051 + feedback_sandbox_host_trennung.md).
#   * No real cross-trust X.509-SVID issuance — the hermetic surface
#     tests config shape + Workload-API socket-path convention; the
#     real issuance round-trip is Operator-Hand-pendet (README §3b).
#
# HCL format per SPIRE-Agent config reference. Validated by
# tests/test_spire_agent_federation_config.py against shape invariants.

agent {
    # Data directory for the agent: bootstrap-trust-bundle cache,
    # federated-bundle cache, SVID-cache, KeyManager-memory keys.
    # Mounted as a named volume in compose; ``compose down -v`` drops
    # it deliberately to force a re-attestation on next bring-up.
    data_dir = "/var/lib/spire/agent"

    log_level = "INFO"

    # Trust-domain literal — ``wakir.test`` matches the
    # SPIRE-Server-wakir side (spire-server-wakir.conf).
    trust_domain = "wakir.test"

    # Server-Admin-API endpoint. The agent dials the federation
    # SPIRE-Server on the ``wakir-federation`` bridge network's
    # internal DNS. Port 8081 matches the wakir-side server's gRPC
    # bind_port (see spire-server-wakir.conf §server.bind_port).
    server_address = "spire-server-wakir"
    server_port    = "8081"

    # Trust-bundle path. Phase-2 Sprint-8 Tag-2 wires this to the
    # federated-bundles ingest volume (read-only mount of the
    # server-side bundles volume). The Operator-Hand bootstrap
    # workflow stages the JWKS-format bundle at this path before the
    # agent first attests; after bootstrap the agent caches the
    # federated peer-bundles in ``data_dir`` and refreshes via the
    # Tag-1 federation bundle-endpoint listener.
    #
    # Hermetic-substrate-Posture: the ``bundles`` volume is shared
    # read-only between the server (read-write, owner) and the agent
    # (read-only consumer). The wakir-side agent reads the wakir-side
    # server's bundle from its own bundles volume; cross-trust
    # peer-bundles arrive via the ``federates_with`` block on the
    # server-side, NOT through this trust_bundle_path.
    trust_bundle_path = "/var/lib/spire/bundles/bootstrap.jwks"

    # Bundle format: JWKS matches the Sprint-8 Tag-1 federation
    # bundle-endpoint listener output (https_spiffe profile emits
    # JWKS, not PEM). The spire-fed-bundle CLI from
    # ``infra/spire/federation/bin/spire-fed-bundle`` also writes
    # JWKS, so the bootstrap roundtrip is JWKS-end-to-end.
    trust_bundle_format = "spiffe"

    # Insecure bootstrap stays OFF for federation — the trust_bundle_
    # path provides the bootstrap-anchor explicitly. Phase-2 single-
    # trust-domain substrate (config/spire-agent.conf) uses
    # ``insecure_bootstrap = true`` because the join_token attestor
    # does not require a pre-staged trust-bundle; the federation
    # posture is stricter to exercise the production-style bootstrap.
    insecure_bootstrap = false

    # SPIFFE-Workload-API socket path. Phase-2.3+ persona-container
    # Workload-API consumers mount the
    # ``wakir-spire-agent-wakir-sockets`` volume read-only at the
    # same path and connect via
    # ``unix:///run/spire/agent-sockets/api.sock``. This is the
    # SPIRE-Workload-API standard socket-path convention from the
    # SPIFFE spec (https://github.com/spiffe/spiffe/blob/main/standards/SPIFFE_Workload_API.md).
    socket_path = "/run/spire/agent-sockets/api.sock"
}

plugins {
    # NodeAttestor: join_token for Phase-2 manual enrollment.
    # The actual join-token value is supplied to the agent at startup
    # via ``-joinToken <token>`` on the command line. In the hermetic
    # substrate the agent's run-command in compose/spire-agent-
    # federation.yaml does not pass a join-token; the agent will log
    # an attestation-failure and retry. That is the intended hermetic
    # posture — exercise the compose+config shape, do not attempt real
    # attestation. Phase-2.3+ live-gated bring-up wires the real
    # join-token via an Operator-Hand
    # ``spire-server token generate`` step.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # KeyManager: in-memory is the Phase-2 hermetic choice (parity
    # with Sprint-6-Tag-9 single-trust-domain agent). Re-attestation
    # on every restart, no key material persists between compose
    # down/up cycles.
    KeyManager "memory" {
        plugin_data {}
    }

    # WorkloadAttestor: unix is the SPIRE-default for unix-socket-
    # based workload attestation (selectors derived from the calling
    # process's uid/gid/pid/binary-path). The hermetic substrate does
    # not register real workloads, so this is shape-only — the
    # cross-trust-domain selector mapping (which workload selectors
    # map to which trust-domain SVID) is exercised by the
    # spire-agent-fed-attest CLI Mock (bin/spire-agent-fed-attest)
    # and asserted by
    # tests/test_spire_agent_fed_attest_cli.py.
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
