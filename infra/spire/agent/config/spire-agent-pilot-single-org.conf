#
# Phase-2 Sprint-9 Tag-5 — SPIRE-Agent config for the SINGLE-ORG
# Phase-1b Pilot-VM bring-up (Bug 7 substance-fix per
# ``agents-workspaces/mira/outbox/2026-05-13-pilot-bringup-bug-bilanz.md``).
#
# Bug 7 root cause on the agent side (PILOT_BRING_UP_TROUBLESHOOTING.md §H1):
#   The Sprint-8 Tag-2 ``spire-agent-wakir.conf`` declares
#   ``insecure_bootstrap = false`` and
#   ``trust_bundle_path = "/var/lib/spire/bundles/bootstrap.jwks"``.
#   On a single-org pilot VM the federated-bundles volume is never
#   populated (no peer side exists to publish its bundle), so
#   ``bootstrap.jwks`` does not exist and the agent fails to bootstrap
#   the trust-anchor. Agent enters crash-loop or stays
#   ``inactive (dead)``.
#
# This config is the SINGLE-ORG variant: ``insecure_bootstrap = true``,
# no ``trust_bundle_path``. The agent obtains the local server's
# trust-bundle through the SPIRE-Server's gRPC API as part of the
# join-token attestation handshake.
#
# Trust-Domain rationale (hermetic-only):
#   ``wakir.test`` matches the server-side config
#   (``spire-server-pilot-single-org.conf``).
#
# What this config IS:
#   * SPIRE-Agent config for a single trust-domain with NO federation
#     peer.
#   * ``insecure_bootstrap = true`` — agent fetches the local server's
#     trust-bundle via the join-token attestation handshake. Parity
#     with the Sprint-6-Tag-9 single-trust-domain agent
#     (``config/spire-agent.conf``).
#   * Server-Admin-API at ``spire-server-wakir:8081`` on the
#     ``wakir-federation`` bridge network (bridge network is reused
#     for naming consistency even in single-org mode).
#   * Workload-API socket at ``/run/spire/agent-sockets/api.sock``
#     (SPIFFE-spec canonical).
#
# What this config is NOT:
#   * No federated-peer-bundle ingest. No ``trust_bundle_path``.
#   * No cross-trust-domain SVID issuance — single trust-domain only.
#
# Phase-2.1 federation upgrade-path:
#   Re-running ``wakir-pilot-bootstrap.sh`` with ``WAKIR_PILOT_MODE=
#   federation`` selects ``spire-agent-wakir.conf`` instead of this
#   file. The agent re-attests after the mode swap (in-memory
#   KeyManager forces a re-attestation on restart, by design).

agent {
    # Data directory for the agent: bootstrap-trust-bundle cache,
    # SVID-cache, KeyManager-memory keys. Mounted as a named volume in
    # the Quadlet template; ``podman volume rm`` drops it deliberately
    # to force a re-attestation on next bring-up.
    data_dir = "/var/lib/spire/agent"

    log_level = "INFO"

    # Trust-domain literal — ``wakir.test`` matches the server-side
    # single-org config (spire-server-pilot-single-org.conf).
    trust_domain = "wakir.test"

    # Server-Admin-API endpoint. The agent dials the SPIRE-Server on
    # the ``wakir-federation`` bridge network's internal DNS. Port 8081
    # matches the server's gRPC bind_port.
    server_address = "spire-server-wakir"
    server_port    = "8081"

    # Insecure bootstrap is ON for the single-org Phase-1b pilot.
    # Rationale: there is no federated-bundles volume to source a
    # pre-staged trust-anchor from. The agent obtains the local
    # server's trust-bundle via the join-token attestation handshake.
    # Parity with the Sprint-6-Tag-9 single-trust-domain agent
    # (config/spire-agent.conf §insecure_bootstrap).
    #
    # Phase-2.1 federation mode flips this to ``false`` and pairs it
    # with ``trust_bundle_path`` -- see ``spire-agent-wakir.conf``.
    insecure_bootstrap = true

    # NOTE: deliberately NO ``trust_bundle_path`` directive here. The
    # single-org pilot has no federated-bundles volume to source the
    # bootstrap anchor from. With ``insecure_bootstrap = true`` the
    # agent does not require a pre-staged trust-anchor file.

    # SPIFFE-Workload-API socket path. Phase-2.3+ persona-container
    # Workload-API consumers mount the per-side sockets volume
    # read-only at the same path and connect via
    # ``unix:///run/spire/agent-sockets/api.sock``. SPIFFE-spec
    # canonical path.
    socket_path = "/run/spire/agent-sockets/api.sock"
}

plugins {
    # NodeAttestor: join_token for Phase-1b manual enrollment.
    # The actual join-token value is supplied to the agent at startup
    # via ``-joinToken <token>`` on the command line. The Operator-Hand
    # workflow:
    #   1. On server: ``spire-server token generate -spiffeID
    #      spiffe://wakir.test/agent/pilot-1``
    #   2. Pass the token to the agent's startup command (Quadlet
    #      ``Exec=run -config /etc/spire/agent/agent.conf -joinToken <TOKEN>``).
    # Without a join-token the agent logs an attestation-failure and
    # retries indefinitely — that is the intended posture before the
    # Operator-Hand token-generate step.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # KeyManager: in-memory is the Phase-1b boring-default (parity
    # with Sprint-6-Tag-9 + Sprint-8-Tag-2 federation). Forces a
    # re-attestation on every restart.
    KeyManager "memory" {
        plugin_data {}
    }

    # WorkloadAttestor: unix (SPIRE-default for unix-socket-based
    # workload attestation; selectors derived from caller uid/gid/pid/
    # binary-path).
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
