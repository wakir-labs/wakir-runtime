# SPDX-License-Identifier: Apache-2.0
#
# Runtime acceptance gates
# ------------------------
#
# Required status check that pins the hermetic runtime acceptance-gate
# suite (`tests/infra/test_phase_2_acceptance_gates.py`) as a repository
# invariant. Every pull request against `main` and every push to `main`
# that touches the gated surfaces must pass this workflow.
#
# Gate contents (six stages, fail-fast per gate test)
# --------------------------------------------------
#
#   1. Bridge-forward symmetry -- fan-out symmetry and drop-rate bound
#      (<= 0.1 %) over a deterministic mock trace.
#   2. Consistency-score threshold -- dual-backend consistency score via
#      `bridge_audit_diff_engine` as hermetic proxy for the 6h roll-up.
#   3. V-907 hash-stability marker -- zero `PersonaHashDriftError`
#      events, `axis-a-pin` equals the build-time pin.
#   4. Recovery R1..R4 mock drill -- hermetic equivalent of the live
#      stress matrix (despawn + recovery, capability-token rotation, KV
#      persistence across VM reboot, WAT/OTS anchor-cycle failover).
#   5. Subscribe-loop lag mock -- output-reply timeliness p99 <= 45 s
#      over a mock histogram.
#   6. Aggregator -- all five gates back-to-back plus the cross-gate
#      non-interference invariant (gate-2 drift must not propagate
#      into gate-3 pin drift; gate-5 lag excursion must not flip gate-1
#      symmetry).
#
# Each stage runs exactly one test function (`pytest -k`) so the five
# gates plus the aggregator are individually visible as green/red in
# the PR check tab. That matches the quality-gate documentation
# topology (`docs/quality-gates/phase-2-doppelbetrieb.md`) and keeps
# drift localisation fast.
#
# Sandbox boundary
# ----------------
# All stages are hermetic: in-memory mocks, no podman, no NATS, no live
# VM. Nor is there a CI lane elsewhere that supplies the live half:
# `e2e-vm-acceptance-gate.yml` is hermetic too since ADR-0077 withdrew
# its real-VM job, and the workflow that named the live path was
# withdrawn in the same decision. Live acceptance is an operator-hand
# run on the substrate node, bounded by a dated exemption rather than
# by any job here.
#
# Required status check
# ---------------------
# The aggregator job's display name `runtime acceptance gates` is the
# branch-protection context. Branch protection matches the job display
# name (`jobs.<id>.name`), not the workflow name. Do not rename the job
# without updating `docs/ci/branch-protection-required-checks.md` in the
# same PR. The second place this note used to name,
# `scripts/ci/ci_aggregator.py`, was deleted under ADR-0075 §1
# (`docs/ci/retired-workflows.md`).
#
# Error propagation
# -----------------
# The aggregator carries `if: always()` and re-checks every
# `needs.<job>.result` before it runs anything else. A required context
# that *skips* when its dependency fails does not block a merge, so a
# `needs`-only aggregator would be a fail-open gate. Both halves are
# pinned by `tests/workflows/test_required_context_error_propagation.py`.
#
# Pattern parity
# --------------
# Trigger form, Python setup, dependency pin and stage layout match
# `license-gate.yml` and `hash-derivate-gate.yml`.
#
# The name no longer fits, on purpose (Welle 3, ADR-0075)
# ------------------------------------------------------
# Since the Welle-3 lane promotion this workflow also carries three jobs
# that are not Phase-2 acceptance gates at all: `lane-ci-meta`,
# `lane-wat-core` and `lane-hermetic-invariants`. They are here because
# ADR-0075 §1 makes in-workflow aggregation the binding pattern and the
# aggregator below is the only branch-protection context of this file —
# so a lane attached to it inherits enforcement without a new required
# context, without a branch-protection change, and without the exact-
# display-name failure class that left PR #102 pending forever.
#
# The price is a workflow whose name describes part of its contents.
# We carry that deliberately. **Renaming the aggregator job is
# forbidden**: its display name IS the branch-protection context, and
# renaming it would leave every pull request waiting for a check that
# never reports, i.e. it would switch this lane off while looking like
# tidying up.
#
# Every lane job runs pytest with `-rs`, so the skip reasons are in the
# log. A lane's skip balance is the difference between "these invariants
# are checked" and "these invariants are collected"; it has to be
# readable without re-running anything.
#
# Every job in `needs:` must also appear in the `GATE_RESULTS` block of
# the aggregator's first step. A job in one and not the other is a
# fail-open gate (finding R6). Two independent tests catch it:
# `tests/workflows/test_required_context_error_propagation.py` and
# `tests/lanes/test_required_inheritance.py`.

name: runtime-acceptance-gates

on:
  push:
    branches:
      - main
    # No `paths:` filter — see the pull_request note below; the same
    # invariant applies to pushes on `main`.
  # No `paths:` filter. This workflow feeds a required status context;
  # a required context that never reports leaves the pull request
  # pending forever, so it fires on every pull request.
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate-2-1-bridge-forward-symmetry:
    name: Gate-2-1 Bridge-Forward-Symmetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gate dependencies
        # Stdlib + pytest is sufficient; the test-module is hermetic
        # and pulls its diff-engine from the in-tree wirelang package.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.0"
      - name: Run Gate-2-1
        run: |
          python -m pytest tests/infra/test_phase_2_acceptance_gates.py \
            -k "test_gate_2_1_bridge_forward_symmetry" \
            -v --tb=short

  gate-2-2-konsistenz-score-threshold:
    name: Gate-2-2 Konsistenz-Score Threshold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.0"
      - name: Run Gate-2-2
        run: |
          python -m pytest tests/infra/test_phase_2_acceptance_gates.py \
            -k "test_gate_2_2_konsistenz_score_threshold" \
            -v --tb=short

  gate-2-3-v907-hash-stability-marker:
    name: Gate-2-3 V907-Hash-Stability-Marker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.0"
      - name: Run Gate-2-3
        run: |
          python -m pytest tests/infra/test_phase_2_acceptance_gates.py \
            -k "test_gate_2_3_v907_hash_stability_marker" \
            -v --tb=short

  gate-2-4-recovery-r1-r4-mock-drill:
    name: Gate-2-4 Recovery-R1..R4-Mock-Drill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.0"
      - name: Run Gate-2-4
        run: |
          python -m pytest tests/infra/test_phase_2_acceptance_gates.py \
            -k "test_gate_2_4_recovery_r1_r4_mock_drill" \
            -v --tb=short

  gate-2-5-subscribe-loop-lag-mock:
    name: Gate-2-5 Subscribe-Loop-Lag-Mock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.0"
      - name: Run Gate-2-5
        run: |
          python -m pytest tests/infra/test_phase_2_acceptance_gates.py \
            -k "test_gate_2_5_subscribe_loop_lag_mock" \
            -v --tb=short

  lane-ci-meta:
    name: Lane — CI meta (hermetic)
    runs-on: ubuntu-latest
    # Welle-3 lane promotion, step 2 (ADR-0075; CTO decision paper
    # §1.3 table A, §1.7).
    #
    # `tests/ci/` holds the hermetic tests about the CI substrate
    # itself: the branch-protection check-name audit that pins required
    # status contexts against actual job display-names (the PR #102
    # forever-pending class), and `test_validate_demo_proof_report.py`,
    # the test module of the report validator that `STABILITY.md` cites
    # as evidence. Neither ran in any workflow.
    #
    # Attached here rather than registered as its own required status
    # context: a new context needs a branch-protection change plus an
    # exact display name, and that is the failure class this lane is
    # partly about. The aggregator below inherits the enforcement — as
    # long as the job appears in BOTH `needs:` and the `GATE_RESULTS`
    # block. Adding it to only one of the two is the R6 fail-open
    # defect; `tests/lanes/test_required_inheritance.py` and
    # `tests/workflows/test_required_context_error_propagation.py`
    # catch that independently of each other.
    #
    # Whole directory, not a file list: a new module under `tests/ci/`
    # should be in this lane by default, not by someone remembering.
    # Two modules that were `optional-ci` (path-filtered probes for the
    # live-VM rotation state machine and the OTS pre-anchor activation)
    # are promoted along with them — both hermetic, both already on the
    # PR surface, and a path filter is not enforcement.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lane dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            "pytest>=8.0" \
            "pytest-subtests>=0.11" \
            "PyYAML>=6.0" \
            "jsonschema>=4.21" \
            "rfc8785>=0.1.4" \
            "cryptography>=42" \
            "shamir-mnemonic>=0.3.0"
      - name: Collect-gate (no module may vanish into an import guard)
        # A module-level `pytest.importorskip` on something this lane is
        # supposed to have installed yields zero node IDs and exit code
        # 0 — green, and the module is simply gone. The lane asserts its
        # own install set before it asserts anything about the code.
        run: |
          python tooling/ci/collect_gate.py --profile production --root tests/ci
      - name: Run CI-meta suite
        run: |
          python -m pytest tests/ci/ -v --tb=short -rs

  lane-wat-core:
    name: Lane — WAT core (hermetic, four-validator parity)
    runs-on: ubuntu-latest
    # Welle-3 lane promotion, step 3 (ADR-0075; CTO decision paper
    # §1.3 table A, §3/L2).
    #
    # `tests/wat/` is the proof path Phase 4 exists to seal: Merkle-root
    # construction and proof verification, manifest v1/v2 signature and
    # schema admission, the OTS full-verify path, cross-module anchor
    # pin consistency. 46 of its 47 modules ran in no workflow at all.
    # Own job because of runtime (~20 s of tests plus the Node install),
    # not because of subject matter.
    #
    # Node, and why it is here
    # ------------------------
    # `STABILITY.md` carries this repository's furthest-reaching
    # conformance claim: *two independent JSON-Schema implementations
    # validate our published schemas*, with
    # `tests/wat/test_external_verifier_parity.py` named as the guard.
    # Measured 2026-09-14: no workflow ran that module, and no workflow
    # in this repository installed Node at all — so the claim had been
    # executed zero times in CI. Putting the module in a lane without
    # Node would not have changed that; the Node half would keep
    # skipping and the lane would be green without checking.
    #
    # So the lane installs Node and both validator trees, and the step
    # below hard-fails if either is missing. Skipping is a legitimate
    # design for a developer machine; in the lane that makes the claim,
    # it is not.
    #
    # Determinism: `package-lock.json` is committed for both trees and
    # `npm ci` installs exactly the locked tree. A floating `^8.17.1`
    # resolved at job time would put an unreviewed upstream release on
    # the merge path.
    #
    # `fastjsonschema` is the third validator pole and is installed here
    # explicitly because `pyproject.toml` does not declare it anywhere —
    # same shape as the PyYAML line in `tests.yml`, and the same
    # follow-up: the declaration belongs in `pyproject.toml`. Until it
    # lands there, this line is what makes the four-pole parity test
    # actually run instead of skip.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lane dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            "pytest>=8.0" \
            "pytest-subtests>=0.11" \
            "PyYAML>=6.0" \
            "jsonschema>=4.21" \
            "rfc8785>=0.1.4" \
            "cryptography>=42" \
            "shamir-mnemonic>=0.3.0" \
            "fastjsonschema>=2.19"
      - name: Install the external verifier harnesses (npm ci, locked)
        run: |
          set -euo pipefail
          ( cd tooling/external-verifier-ajv && npm ci )
          ( cd tooling/external-verifier-hyperjump && npm ci )
      - name: Verify every validator pole is present
        # The parity module skips its Node halves when `node` is absent
        # or `node_modules` is missing, and its fastjsonschema halves
        # when that wheel is absent. Those skips are what made the
        # STABILITY.md claim unexecuted for four months. In this lane a
        # missing pole is a lane defect, not a skip.
        run: |
          set -euo pipefail
          node --version
          test -d tooling/external-verifier-ajv/node_modules
          test -d tooling/external-verifier-hyperjump/node_modules
          python - <<'PY'
          import importlib.util, sys
          missing = [m for m in ("jsonschema", "fastjsonschema") if importlib.util.find_spec(m) is None]
          if missing:
              print(f"validator poles missing: {missing}", file=sys.stderr)
              sys.exit(1)
          print("validator poles present: python-jsonschema, fastjsonschema, ajv, hyperjump")
          PY
      - name: Collect-gate (no module may vanish into an import guard)
        run: |
          python tooling/ci/collect_gate.py --profile production --root tests/wat
      - name: Run WAT core suite
        run: |
          python -m pytest tests/wat/ -v --tb=short -rs

  lane-hermetic-invariants:
    name: Lane — hermetic invariants (spec freeze, parity, routing)
    runs-on: ubuntu-latest
    # Welle-3 lane promotion, step 3 (ADR-0075; CTO decision paper
    # §1.3 table A). Four groups that are cheap, hermetic and carry a
    # named unchecked invariant each:
    #
    #   * `tests/specs/` (spec freeze) — the required v0.4.3 freeze-seal
    #     probe verifies the seal envelope, not the strict-superset
    #     property over v0.4.2.
    #   * cross-language parity — the Python/Rust wire agreement for
    #     bridge-forward, bridge-audit-writer, federation resolver, SVID
    #     workload identity, the federation frame parser and NATS
    #     subjects. The sibling suites inside `wirelang/` are required;
    #     these six sit under `tests/` and were not.
    #   * observability routing — an alert rule that stops routing to
    #     its receiver. This is criterion (b), an outage we actually had
    #     (27 silent hourly slots), not a hypothetical.
    #   * `test_bug_42_regression_suite.py` — a regression suite that
    #     never runs cannot regress.
    #   * the five hermetic counterparts of the required
    #     `verify-containerfile-base-image-digest-pins` context, which
    #     runs shell only.
    #
    # Explicit module list, not directory targets: three of these
    # directories are mixed, and pointing the runner at the whole
    # directory would pull in modules whose lane is a separate decision
    # — including one that is operator-hand on purpose. A new module in
    # these directories therefore lands `unassigned` and turns
    # `tests/lanes/test_lane_assignment.py` red until someone answers
    # "which gate runs this?". That is the intended cost.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lane dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            "pytest>=8.0" \
            "pytest-subtests>=0.11" \
            "PyYAML>=6.0" \
            "jsonschema>=4.21" \
            "rfc8785>=0.1.4" \
            "cryptography>=42" \
            "shamir-mnemonic>=0.3.0"
      - name: Collect-gate (superset of the lane's own modules)
        # Deliberately wider than the module list below: collection is
        # cheap, and a module in one of these directories that stops
        # being collectable is worth knowing about even when this lane
        # does not execute it.
        run: |
          python tooling/ci/collect_gate.py --profile production \
            --root tests/specs \
            --root tests/cli \
            --root tests/federation \
            --root tests/identity \
            --root tests/persona_engine \
            --root tests/observability \
            --root tests/orchestrator \
            --root tests/integration
      - name: Run hermetic invariant suites
        run: |
          python -m pytest -v --tb=short -rs \
            tests/specs/ \
            tests/cli/test_bridge_forward_cross_lang_parity.py \
            tests/federation/test_federation_frame_parser.py \
            tests/identity/test_federation_resolver_cross_lang_parity.py \
            tests/identity/test_svid_workload_identity_cross_lang_parity.py \
            tests/persona_engine/test_bridge_audit_writer_cross_lang_parity.py \
            tests/persona_engine/test_nats_subjects.py \
            tests/integration/test_bug_42_regression_suite.py \
            tests/orchestrator/test_compose_spire_cosign_pin.py \
            tests/orchestrator/test_nats_py_pin.py \
            tests/orchestrator/test_proxmox_resolve_image_pins.py \
            tests/orchestrator/test_verify_image_digest.py \
            tests/orchestrator/test_verify_image_digest_cosign_mock.py \
            tests/observability/test_aggregator_failure_rate_tracker.py \
            tests/observability/test_alert_rule_to_mira_notify_bridge.py \
            tests/observability/test_bilanz_generator_validation_runs.py \
            tests/observability/test_branch_protection_required_checks_doc.py \
            tests/observability/test_cosign_g1_g2_operator_setup_guide.py \
            tests/observability/test_lifecycle_state_machine_alert_routing.py \
            tests/observability/test_marathon_closeout_alert_routing.py \
            tests/observability/test_mira_notify_dlq.py \
            tests/observability/test_mira_notify_emitter.py \
            tests/observability/test_mira_notify_receiver.py \
            tests/observability/test_ots_probe_workflow_hygiene.py \
            tests/observability/test_phase_3_final_bilanz_generator.py \
            tests/observability/test_pre_cutover_daily_trend_analyzer.py \
            tests/observability/test_pre_cutover_probe_failure_rate_tracker.py \
            tests/observability/test_quadlet_15_binary_live_boot_test.py \
            tests/observability/test_quadlet_healthcmd_exec_form.py \
            tests/observability/test_recovery_workflow_alert_routing.py \
            tests/observability/test_stability_window_doc_mirror_routing.py \
            tests/observability/test_state_backing_alert_routing.py \
            tests/observability/test_subscribe_loop_alert_routing.py \
            tests/observability/test_substrate_heartbeat_emit.py \
            tests/observability/test_substrate_liveness_drill_obligation.py \
            tests/observability/test_substrate_liveness_probe.py \
            tests/observability/test_substrate_liveness_window.py \
            tests/observability/test_trinary_routing_verdict_tile.py

  lane-phase-3c-acceptance:
    name: Lane — Phase-3c cutover acceptance + rollback drills
    runs-on: ubuntu-latest
    # 19 modules, 207 tests: the written acceptance criteria (AC-1..AC-5,
    # DW-AC-1..5, CMD-AC-1..4, HC-AC-1..3) and the rollback drills for the
    # Phase-3c cutover of 2026-05-20, plus the Doppel-Welle extension per
    # ADR-0066.
    #
    # Why they are here now
    # ---------------------
    # They were the `phase-3c-opt-in` exemption group: skip-by-default
    # behind `WAKIR_PHASE_3C_E2E` / `WAKIR_PHASE_3C_DOPPEL_E2E` /
    # `WAKIR_PHASE_3C_ROLLBACK_DRILL` and the matching CLI flags, and no
    # workflow in this repository ever set one. The opt-in was never
    # taken; the acceptance criteria for a cutover that already happened
    # had never been executed. The exemption expired 2026-09-30 under
    # ADR-0075 §3, and the run it forced found a real regression: the
    # archaeology rename of 2026-09-14 had broken 21 f-string
    # placeholders in `_ac_assertions.py`, which disabled the suite's
    # entire failure half (15 negative controls raising NameError instead
    # of AssertionError). That defect merged green precisely because this
    # group ran nowhere.
    #
    # The earlier reason for keeping them out was drill character. The
    # measurement says otherwise: 207 tests, 0.6 s wall clock, no podman,
    # no NATS, no SSH, no network — the fixtures are hermetic oracles.
    # There is no cost argument for leaving them dark.
    #
    # What green here does and does not mean
    # --------------------------------------
    # It means the acceptance-criteria assertions hold their shape,
    # including their failure paths. It does **not** mean the 2026-05-20
    # cutover met AC-1..AC-5: the fixtures are placeholders with
    # hard-coded numbers, and 17 of the 207 are skipped a second time,
    # inside the modules, pending real perf gauges, SPIRE agents and
    # operator-hand drills. Those 17 are listed by the skip-gate step
    # below on every run rather than left to a grep.
    #
    # Same attachment as the other three lanes: a dependency of the
    # aggregator, not a new branch-protection context. It must appear in
    # BOTH `needs:` and the `GATE_RESULTS` block below; one without the
    # other is the R6 fail-open defect.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lane dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.0"
      - name: Collect-gate (no module may vanish into an import guard)
        run: |
          python tooling/ci/collect_gate.py --profile production \
            --root tests/acceptance/phase_3c
      - name: Run Phase-3c acceptance suite and rollback drills
        # All three opt-ins passed as CLI flags rather than env-vars: a
        # flag that no conftest registers is an immediate pytest error,
        # while a misspelt env-var is silently false. The failure mode
        # this lane is meant to end is the silent one. (The first run of
        # this job proved the point on itself: `--rollback-drill` came
        # back "unrecognized arguments" in 0.2 s rather than skipping 36
        # tests quietly.)
        #
        # `rollback_drill/` is named separately even though the parent
        # directory contains it. `pytest` only loads the conftests on the
        # paths given on the command line *before* parsing arguments, and
        # `--rollback-drill` is registered by the sub-directory conftest,
        # not the parent one. Naming the parent alone therefore cannot
        # accept the flag. Node IDs are de-duplicated, so the selection is
        # still 207.
        run: |
          python -m pytest \
            tests/acceptance/phase_3c/rollback_drill/ \
            tests/acceptance/phase_3c/ \
            --phase-3c-acceptance \
            --phase-3c-doppel-welle-acceptance \
            --rollback-drill \
            -v --tb=short -rs \
            --junitxml=phase-3c-report.xml
      - name: Skip-gate (a suite that skips itself is not a green suite)
        # pytest exits 0 when every selected test is skipped, so the step
        # above cannot distinguish "opt-in taken, 190 passed" from
        # "opt-in stopped resolving, 207 skipped". This step can.
        if: always()
        run: |
          python tooling/ci/skip_gate.py \
            --junit phase-3c-report.xml \
            --forbid-skip-reason "skip-by-default" \
            --min-executed 190

  runtime-acceptance-gates:
    name: runtime acceptance gates
    runs-on: ubuntu-latest
    # Aggregator depends on all five single-gate jobs so the green-light
    # signal at the bottom of the PR-Check-Run-Tab only fires once each
    # individual Gate plus the cross-gate-non-interference invariant
    # have passed.
    #
    # `if: always()` is load-bearing, not cosmetic. This job's display
    # name is the only branch-protection context of this lane (the five
    # gate jobs are not required contexts). Without `always()`, a red
    # gate job makes this job *skipped*, and GitHub does not block a
    # merge on a skipped required check — the lane would fail open. See
    # https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks
    # `always()` alone is not enough either: it only guarantees the job
    # runs. The first step below turns each `needs.*.result` into this
    # job's own exit code, so a green aggregator test can never paper
    # over a red gate job.
    needs:
      - gate-2-1-bridge-forward-symmetry
      - gate-2-2-konsistenz-score-threshold
      - gate-2-3-v907-hash-stability-marker
      - gate-2-4-recovery-r1-r4-mock-drill
      - gate-2-5-subscribe-loop-lag-mock
      - lane-ci-meta
      - lane-wat-core
      - lane-hermetic-invariants
      - lane-phase-3c-acceptance
    if: always()
    steps:
      - name: Require every gate job to have succeeded
        # Runs before anything else so an upstream failure cannot be
        # masked by a later green step. Any result other than `success`
        # (failure, cancelled, skipped, or an empty string when the job
        # never materialised) fails this job, and with it the required
        # context.
        env:
          GATE_RESULTS: |
            gate-2-1-bridge-forward-symmetry=${{ needs.gate-2-1-bridge-forward-symmetry.result }}
            gate-2-2-konsistenz-score-threshold=${{ needs.gate-2-2-konsistenz-score-threshold.result }}
            gate-2-3-v907-hash-stability-marker=${{ needs.gate-2-3-v907-hash-stability-marker.result }}
            gate-2-4-recovery-r1-r4-mock-drill=${{ needs.gate-2-4-recovery-r1-r4-mock-drill.result }}
            gate-2-5-subscribe-loop-lag-mock=${{ needs.gate-2-5-subscribe-loop-lag-mock.result }}
            lane-ci-meta=${{ needs.lane-ci-meta.result }}
            lane-wat-core=${{ needs.lane-wat-core.result }}
            lane-hermetic-invariants=${{ needs.lane-hermetic-invariants.result }}
            lane-phase-3c-acceptance=${{ needs.lane-phase-3c-acceptance.result }}
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            [ -n "${line}" ] || continue
            job="${line%%=*}"
            result="${line#*=}"
            if [ "${result}" != "success" ]; then
              echo "::error::gate job ${job} result=${result:-<none>} (expected success)"
              bad=1
            else
              echo "gate job ${job}: success"
            fi
          done <<< "${GATE_RESULTS}"
          if [ "${bad}" -ne 0 ]; then
            echo "runtime acceptance gates: at least one dependency job did not succeed" >&2
            exit 1
          fi
          echo "runtime acceptance gates: every dependency job succeeded"

      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.0"
      - name: Run aggregator
        # Drives the cross-gate aggregator that walks all five gates
        # back-to-back AND asserts the non-interference invariants
        # (Gate-2-2 drift must not propagate to Gate-2-3 pin set;
        # Gate-2-5 lag excursion must not flip Gate-2-1 symmetry).
        run: |
          python -m pytest tests/infra/test_phase_2_acceptance_gates.py \
            -k "test_gate_aggregator_phase_2_acceptance_all_green" \
            -v --tb=short
      - name: Runtime acceptance gates — Summary
        if: always()
        run: |
          {
            echo "# Runtime acceptance gates — Summary"
            echo ""
            echo "| Gate | Status |"
            echo "|---|---|"
            echo "| Gate-2-1 Bridge-Forward-Symmetry            | ${{ needs.gate-2-1-bridge-forward-symmetry.result }} |"
            echo "| Gate-2-2 Konsistenz-Score Threshold         | ${{ needs.gate-2-2-konsistenz-score-threshold.result }} |"
            echo "| Gate-2-3 V907-Hash-Stability-Marker         | ${{ needs.gate-2-3-v907-hash-stability-marker.result }} |"
            echo "| Gate-2-4 Recovery-R1..R4-Mock-Drill         | ${{ needs.gate-2-4-recovery-r1-r4-mock-drill.result }} |"
            echo "| Gate-2-5 Subscribe-Loop-Lag-Mock            | ${{ needs.gate-2-5-subscribe-loop-lag-mock.result }} |"
            echo "| Lane — CI meta (hermetic)                   | ${{ needs.lane-ci-meta.result }} |"
            echo "| Lane — WAT core                             | ${{ needs.lane-wat-core.result }} |"
            echo "| Lane — hermetic invariants                  | ${{ needs.lane-hermetic-invariants.result }} |"
            echo "| Lane — Phase-3c acceptance + rollback drills | ${{ needs.lane-phase-3c-acceptance.result }} |"
            echo "| Aggregator (Cross-Gate Non-Interference)    | ${{ job.status }} |"
            echo ""
            echo "Anchors: ADR-0058, docs/quality-gates/phase-2-doppelbetrieb.md."
          } >> "$GITHUB_STEP_SUMMARY"
