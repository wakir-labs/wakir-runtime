# SPDX-License-Identifier: Apache-2.0
#
# Tag-72 Welle-4 Integration-Smoke (Amara, Continuous-Mode)
# ---------------------------------------------------------
#
# Hermetic end-to-end simulation of the four Welle-4 substrates
# that fire in sequence on the canonical KW-26 Mi 2026-06-24
# cutover-Mittwoch / KW-26 Fr 2026-06-26 sign-off-Freitag
# Doppel-Welle-4+5 State-Backing Cutover-Day pipeline (per
# docs/quality-gates/phase-3-marathon-final-acceptance.md
# Marathon-Cadence row KW-26 and docs/quality-gates/
# pre-cutover-acceptance-run-order.md row Welle-4):
#
#   * Stage 1 -- Welle-4-Producer simulation (Selin Tag-72)
#   * Stage 2 -- Welle-4-Audit-Anchor simulation (Tomas Tag-72)
#   * Stage 3 -- Snapshot-Restore-Pflicht-Verifikation
#                (Tomas Tag-56 §J5 Rollback-Runbook)
#   * Stage 4 -- Forward-Block-Cascade-Test
#                (welle-4/5/6/7 blocked-on-Welle-4-DEFECT)
#   * Stage 5 -- Aggregate WELLE-4-INTACT / DRIFT / DEFECT
#
# Brief-vs-canonical reconciliation (Tag-71 lehre)
# ------------------------------------------------
#
# Auftrag-brief carried two non-canonical anchors that this
# workflow + the Tag-72 aggregator pin to canonical:
#
#   * Brief: "Welle-4 KW-25 Mo".
#     Canonical: KW-26 Mi 2026-06-24 (Doppel-Welle-4+5 parallel).
#   * Brief: "Tomas-Tag-56 Rollback-Workflow §J4".
#     Canonical: §J5 W4 state_backing + snapshot-restore-planned.
#
# Both deltas are surfaced on the aggregator envelope.
#
# Sandbox boundary (ADR-0034, Mira feedback_sandbox_host_trennung.md)
# --------------------------------------------------------------------
#
# This workflow is hermetic. It does NOT trigger the actual Welle-4
# substrates via gh workflow run; it does NOT call the Persona-
# Engine batch-writer; it does NOT touch the live-VM substrate;
# it does NOT POST to ntfy.sh. The simulation is built from
# stdlib-only helpers + on-disk synthetic bundles assembled inside
# the GitHub Actions sandbox. The actual Welle-4 trigger on
# 2026-06-24 (KW-26 Mi) is operator-hand.
#
# Decision shape
# --------------
#
# Stages emit per-stage verdict envelopes consumed by
# tooling/ci/aggregate_welle_4_integration.py:
#
#   * green   -> WELLE-4-INTACT contribution
#   * yellow  -> WELLE-4-DRIFT contribution
#   * red     -> WELLE-4-DEFECT contribution
#
# Any red collapses the aggregate to WELLE-4-DEFECT.
# Any yellow with zero red degrades to WELLE-4-DRIFT.
# All green yields WELLE-4-INTACT.
#
# Forward-cascade
# ---------------
#
# Per docs/quality-gates/phase-3-marathon-anti-patterns.md
# (AP-9 analogue for Welle-4 state-backing rollback) +
# docs/ci/phase-3-marathon-rollback-runbook.md J5, a Welle-4
# DEFECT (rollback) MUST yield blocked_wellen=(4,5,6,7). Stage 4
# probes the cascade-rule under three scenarios (Welle-4-INTACT,
# -DRIFT, -DEFECT) and verifies the forward-cascade mapping
# holds.
#
# Snapshot-restore-pflicht (Tag-56 §J5)
# -------------------------------------
#
# Welle-4 is the State-Backing welle. Per docs/ci/phase-3-marathon-
# rollback-runbook.md J5 (W4 state_backing rust->python +
# snapshot-restore-planned) and row 113 ("Welle-4 without
# --with-snapshot-restore=true -> yellow"), Welle-4 rollback
# REQUIRES a snapshot-restore plan. Stage 3 probes the
# READY / PLANNED-MISSING / PLAN-DEFECT trinary surface.
#
# Trigger surface
# ---------------
#
#   * workflow_dispatch -- manual probe for the marathon-team.
#   * pull_request -- runs on changes to the workflow itself, its
#     aggregator, or its tests.
#   * push (path-filtered) on changes to the same trio.
#
# Continuous-Mode (Mira, 2026-05-19)
# ----------------------------------
#
# Per feedback_continuous_mode_keine_pause_frage.md the workflow
# runs to completion on its own without per-stage approvals; per
# feedback_continuous_mode_keine_push_frage.md the merge of this
# PR is part of the Tag-72 substrate-set and happens automatically
# in the Marathon dispatch.
#
# Not a required status check
# ---------------------------
#
# Per feedback_branch_protection_check_names.md this workflow is
# NOT listed as a required status check. It is an integration-
# smoke probe; the underlying Welle-4 substrate workflows
# (welle-4-validation, welle-4-hot-spot-probe, phase-3-marathon-
# rollback) are the substrate gates. The structural-shape
# tests in tests/ci/test_welle_4_integration_tag72.py are the
# gating unit on PRs that touch the smoke.

name: welle-4-integration-smoke

on:
  workflow_dispatch:
    inputs:
      drift_inject:
        description: "Inject DRIFT verdict on stage (none|producer|audit_anchor|snapshot_restore|cascade)"
        required: false
        default: "none"
      defect_inject:
        description: "Inject DEFECT verdict on stage (none|producer|audit_anchor|snapshot_restore|cascade)"
        required: false
        default: "none"
  pull_request:
    paths:
      - ".github/workflows/welle-4-integration-smoke.yml"
      - "tooling/ci/aggregate_welle_4_integration.py"
      - "tests/ci/test_welle_4_integration_tag72.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/welle-4-integration-smoke.yml"
      - "tooling/ci/aggregate_welle_4_integration.py"
      - "tests/ci/test_welle_4_integration_tag72.py"

permissions:
  contents: read

concurrency:
  group: welle-4-integration-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  welle-4-integration-smoke:
    name: Welle-4 Integration-Smoke (hermetic)
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.aggregate.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare hermetic substrate working dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/stages
          mkdir -p out/aggregate
          echo "Tag-72 Welle-4 integration-smoke staging dirs ready."

      - name: Stage 1 -- Welle-4-Producer simulation (Selin Tag-72)
        id: stage1
        shell: bash
        env:
          DRIFT_INJECT: ${{ inputs.drift_inject }}
          DEFECT_INJECT: ${{ inputs.defect_inject }}
        run: |
          set -euo pipefail
          # Hermetic producer-stage: render the canonical Welle-4
          # state-file stub via the Tag-68 render-only helper and
          # verify the schema-pin invariants. The output envelope
          # carries WELLE-4-PRODUCER-READY/DRIFT/DEFECT.
          python3 tooling/ci/render_engine_state_file_stub.py \
            --welle 4 --kw KW-26 > out/stages/welle-4-rendered.json
          schema_version=$(python3 -c "import json; print(json.load(open('out/stages/welle-4-rendered.json'))['schema_version'])")
          welle_number=$(python3 -c "import json; print(json.load(open('out/stages/welle-4-rendered.json'))['welle_number'])")
          status_field=$(python3 -c "import json; print(json.load(open('out/stages/welle-4-rendered.json'))['status'])")
          verdict="WELLE-4-PRODUCER-READY"
          if [[ "$schema_version" != "tag-67-v1" ]]; then
            verdict="WELLE-4-PRODUCER-DEFECT"
          fi
          if [[ "$welle_number" != "4" ]]; then
            verdict="WELLE-4-PRODUCER-DEFECT"
          fi
          if [[ "$status_field" != "pending" ]]; then
            verdict="WELLE-4-PRODUCER-DEFECT"
          fi
          if [[ "${DRIFT_INJECT,,}" == "producer" ]]; then
            verdict="WELLE-4-PRODUCER-DRIFT"
            echo "::warning::drift_inject=producer; forced WELLE-4-PRODUCER-DRIFT"
          fi
          if [[ "${DEFECT_INJECT,,}" == "producer" ]]; then
            verdict="WELLE-4-PRODUCER-DEFECT"
            echo "::warning::defect_inject=producer; forced WELLE-4-PRODUCER-DEFECT"
          fi
          python3 - <<PY > out/stages/producer-verdict.json
          import json, datetime
          env = {
              "schema_version": 1,
              "stage": "welle_4_producer",
              "tag": "tag-72",
              "substrate": "selin-tag-72-welle-4-state-file-producer",
              "verdict": "$verdict",
              "rendered": json.load(open("out/stages/welle-4-rendered.json")),
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Stage-1 producer verdict: $verdict"

      - name: Stage 2 -- Welle-4-Audit-Anchor simulation (Tomas Tag-72)
        id: stage2
        shell: bash
        env:
          DRIFT_INJECT: ${{ inputs.drift_inject }}
          DEFECT_INJECT: ${{ inputs.defect_inject }}
        run: |
          set -euo pipefail
          # Hermetic audit-anchor stage: assemble a synthetic
          # Welle-4 sign-off bundle on disk and compute a
          # deterministic SHA-256 anchor across the bundle keys.
          # The Tomas Tag-72 wire-helper is not yet wired-in upstream;
          # this stage uses an inline hermetic equivalent computation
          # so the integration-smoke does not depend on the live
          # substrate. The compute matches the Tag-69/Tag-70/Tag-71
          # wire-helper shape (64-hex SHA-256 across canonical JSON).
          mkdir -p out/stages/bundle
          cp state/welle-4.json out/stages/bundle/welle-4.json
          cat > out/stages/bundle/welle-4-sign-off.json <<JSON
          {
            "welle_number": 4,
            "signoff_iso": "2026-06-26T17:00:00Z",
            "operator": "amara-welle-4-smoke",
            "schema_version": "tag-67-v1"
          }
          JSON
          cat > out/stages/bundle/welle-4-validation-last-verdict.json <<JSON
          {
            "welle_number": 4,
            "verdict": "WELLE-4-VALIDATION-READY",
            "schema_version": "tag-67-v1"
          }
          JSON
          cat > out/stages/bundle/welle-4-pre-auditor-decision.json <<JSON
          {
            "welle_number": 4,
            "decision": "PROCEED",
            "auditor": "henrik",
            "schema_version": "tag-67-v1"
          }
          JSON
          mkdir -p out/stages/markers
          # Compute the audit_trail_anchor hermetically (stdlib-
          # SHA-256 across sorted bundle paths + canonical JSON).
          python3 - <<PY
          import hashlib, json, pathlib
          bundle_dir = pathlib.Path("out/stages/bundle")
          paths = sorted(p for p in bundle_dir.iterdir() if p.is_file())
          h = hashlib.sha256()
          for p in paths:
              h.update(p.name.encode("utf-8"))
              h.update(b"\\x00")
              data = json.loads(p.read_text(encoding="utf-8"))
              h.update(json.dumps(data, sort_keys=True, separators=(",", ":")).encode("utf-8"))
              h.update(b"\\x00")
          anchor = h.hexdigest()
          marker = {
              "schema_version": 1,
              "kind": "welle-4-audit-trail-anchor-producer-envelope",
              "welle_number": 4,
              "audit_trail_anchor": anchor,
              "bundle_keys": [p.name for p in paths],
          }
          pathlib.Path("out/stages/markers/welle-4-audit-anchor.json").write_text(
              json.dumps(marker, indent=2, sort_keys=True) + "\\n",
              encoding="utf-8",
          )
          PY
          verdict="WELLE-4-AUDIT-ANCHOR-READY"
          anchor=$(python3 -c "import json; print(json.load(open('out/stages/markers/welle-4-audit-anchor.json'))['audit_trail_anchor'])" 2>/dev/null || echo "")
          if [[ ! "$anchor" =~ ^[0-9a-f]{64}$ ]]; then
            verdict="WELLE-4-AUDIT-ANCHOR-DEFECT"
          fi
          if [[ "${DRIFT_INJECT,,}" == "audit_anchor" ]]; then
            verdict="WELLE-4-AUDIT-ANCHOR-DRIFT"
            echo "::warning::drift_inject=audit_anchor; forced WELLE-4-AUDIT-ANCHOR-DRIFT"
          fi
          if [[ "${DEFECT_INJECT,,}" == "audit_anchor" ]]; then
            verdict="WELLE-4-AUDIT-ANCHOR-DEFECT"
            echo "::warning::defect_inject=audit_anchor; forced WELLE-4-AUDIT-ANCHOR-DEFECT"
          fi
          python3 - <<PY > out/stages/audit-anchor-verdict.json
          import json, datetime, os
          marker_path = "out/stages/markers/welle-4-audit-anchor.json"
          marker = None
          if os.path.exists(marker_path):
              try:
                  marker = json.load(open(marker_path))
              except Exception:
                  marker = None
          env = {
              "schema_version": 1,
              "stage": "welle_4_audit_anchor",
              "tag": "tag-72",
              "substrate": "tomas-tag-72-welle-4-audit-trail-anchor",
              "verdict": "$verdict",
              "marker": marker,
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Stage-2 audit-anchor verdict: $verdict"

      - name: Stage 3 -- Snapshot-Restore-Pflicht-Verifikation (Tomas Tag-56 §J5)
        id: stage3
        shell: bash
        env:
          DRIFT_INJECT: ${{ inputs.drift_inject }}
          DEFECT_INJECT: ${{ inputs.defect_inject }}
        run: |
          set -euo pipefail
          # Hermetic snapshot-restore-pflicht stage: Welle-4 is the
          # state-backing welle; its rollback path REQUIRES a
          # snapshot-restore plan because rolling back the state-
          # backing backend without a restored snapshot leaves the
          # agent-state inconsistent across the rust->python flip.
          # Per docs/ci/phase-3-marathon-rollback-runbook.md J5
          # (W4 state_backing rust->python + snapshot-restore-
          # planned) and row 113 ("Welle-4 without
          # --with-snapshot-restore=true -> yellow"), the stage
          # synthesises a snapshot-restore plan envelope and probes
          # the READY / PLANNED-MISSING / PLAN-DEFECT trinary
          # surface.
          mkdir -p out/stages/snapshot-restore-plan
          plan_present="true"
          plan_welle="4"
          plan_schema="tag-67-v1"
          if [[ "${DRIFT_INJECT,,}" == "snapshot_restore" ]]; then
            plan_present="false"
            echo "::warning::drift_inject=snapshot_restore; forced PLANNED-MISSING"
          fi
          if [[ "${DEFECT_INJECT,,}" == "snapshot_restore" ]]; then
            plan_present="true"
            plan_welle="3"  # Wrong-welle binding -> PLAN-DEFECT.
            echo "::warning::defect_inject=snapshot_restore; forced PLAN-DEFECT (wrong-welle binding)"
          fi
          python3 - <<PY > out/stages/snapshot-restore-plan/plan.json
          import json
          env = {
              "welle_number": int("$plan_welle"),
              "plan_present": ("$plan_present" == "true"),
              "with_snapshot_restore_flag": ("$plan_present" == "true"),
              "rollback_job_anchor": "J5",
              "rollback_modul_anchor": "state_backing",
              "schema_version": "$plan_schema",
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          # Map plan -> §J5 verdict surface.
          verdict="SNAPSHOT-RESTORE-READY"
          if [[ "$plan_present" != "true" ]]; then
            verdict="SNAPSHOT-RESTORE-PLANNED-MISSING"
          fi
          if [[ "$plan_welle" != "4" ]]; then
            verdict="SNAPSHOT-RESTORE-PLAN-DEFECT"
          fi
          python3 - <<PY > out/stages/snapshot-restore-verdict.json
          import json, datetime
          plan_env = json.load(open("out/stages/snapshot-restore-plan/plan.json"))
          env = {
              "schema_version": 1,
              "stage": "snapshot_restore_gate",
              "tag": "tag-72",
              "substrate": "tomas-tag-56-rollback-runbook-j5-welle-4-snapshot-restore-planned",
              "verdict": "$verdict",
              "plan_envelope": plan_env,
              "anchor_doc": "docs/ci/phase-3-marathon-rollback-runbook.md (J5, row 113)",
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Stage-3 snapshot-restore verdict: $verdict"

      - name: Stage 4 -- Forward-Block-Cascade-Test (welle-4/5/6/7)
        id: stage4
        shell: bash
        env:
          DRIFT_INJECT: ${{ inputs.drift_inject }}
          DEFECT_INJECT: ${{ inputs.defect_inject }}
        run: |
          set -euo pipefail
          # Hermetic forward-cascade-rule probe: under three Welle-4
          # verdict scenarios (INTACT, DRIFT, DEFECT), the cascade-
          # mapping must yield the documented forward-block
          # blocked_wellen tuple ((), (), (4,5,6,7)). The stage runs
          # all three probes and emits CASCADE-CONSISTENT iff all
          # three match; CASCADE-DRIFT on a single mismatch with
          # the DRIFT-probe; CASCADE-BREAK on any mismatch with the
          # INTACT or DEFECT probe.
          python3 - <<PY > out/stages/cascade-probe-result.json
          import importlib.util, json, pathlib, sys
          mod_path = pathlib.Path("tooling/ci/aggregate_welle_4_integration.py")
          spec = importlib.util.spec_from_file_location("agg_w4", mod_path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)
          probes = {
              "WELLE-4-INTACT": list(mod.downstream_blocked_wellen("WELLE-4-INTACT")),
              "WELLE-4-DRIFT": list(mod.downstream_blocked_wellen("WELLE-4-DRIFT")),
              "WELLE-4-DEFECT": list(mod.downstream_blocked_wellen("WELLE-4-DEFECT")),
          }
          expected = {
              "WELLE-4-INTACT": [],
              "WELLE-4-DRIFT": [],
              "WELLE-4-DEFECT": [4, 5, 6, 7],
          }
          mismatches = [k for k in probes if probes[k] != expected[k]]
          print(json.dumps({"probes": probes, "expected": expected, "mismatches": mismatches}, indent=2, sort_keys=True))
          PY
          mismatches=$(python3 -c "import json; print(len(json.load(open('out/stages/cascade-probe-result.json'))['mismatches']))")
          verdict="CASCADE-CONSISTENT"
          if [[ "$mismatches" -gt 0 ]]; then
            verdict="CASCADE-BREAK"
          fi
          if [[ "${DRIFT_INJECT,,}" == "cascade" ]]; then
            verdict="CASCADE-DRIFT"
            echo "::warning::drift_inject=cascade; forced CASCADE-DRIFT"
          fi
          if [[ "${DEFECT_INJECT,,}" == "cascade" ]]; then
            verdict="CASCADE-BREAK"
            echo "::warning::defect_inject=cascade; forced CASCADE-BREAK"
          fi
          python3 - <<PY > out/stages/cascade-verdict.json
          import json, datetime
          probe = json.load(open("out/stages/cascade-probe-result.json"))
          env = {
              "schema_version": 1,
              "stage": "downstream_block_cascade",
              "tag": "tag-72",
              "substrate": "selin-welle-4-forward-block-cascade-rule",
              "verdict": "$verdict",
              "probe_result": probe,
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Stage-4 cascade verdict: $verdict"

      - name: Stage 5 -- Aggregate WELLE-4-INTEGRATION verdict
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/ci/aggregate_welle_4_integration.py \
            --producer-envelope         out/stages/producer-verdict.json \
            --audit-anchor-envelope     out/stages/audit-anchor-verdict.json \
            --snapshot-restore-envelope out/stages/snapshot-restore-verdict.json \
            --cascade-envelope          out/stages/cascade-verdict.json \
            --iso-week 26 \
            --github-run-id "${GITHUB_RUN_ID:-}" \
            --github-sha    "${GITHUB_SHA:-}" \
            --github-ref    "${GITHUB_REF:-}" \
            --output        out/aggregate/welle-4-integration-verdict.json
          verdict=$(python3 -c "import json; print(json.load(open('out/aggregate/welle-4-integration-verdict.json'))['verdict'])")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo "## Tag-72 Welle-4 Integration-Smoke"
            echo ""
            echo "**Aggregated verdict:** \`$verdict\`"
            echo ""
            echo "**Per-stage verdicts:**"
            echo ""
            echo "- Stage 1 (Welle-4-Producer, Selin Tag-72): \`${{ steps.stage1.outputs.verdict }}\`"
            echo "- Stage 2 (Welle-4-Audit-Anchor, Tomas Tag-72): \`${{ steps.stage2.outputs.verdict }}\`"
            echo "- Stage 3 (Snapshot-Restore-Pflicht-Gate, Tomas Tag-56 J5): \`${{ steps.stage3.outputs.verdict }}\`"
            echo "- Stage 4 (Forward-Block-Cascade welle-4..7): \`${{ steps.stage4.outputs.verdict }}\`"
            echo ""
            echo "<details><summary>Welle-4-Integration envelope JSON</summary>"
            echo ""
            echo '```json'
            cat out/aggregate/welle-4-integration-verdict.json
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Welle-4-integration verdict envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welle-4-integration-verdict
          path: out/aggregate/welle-4-integration-verdict.json
          if-no-files-found: warn

      - name: Upload per-stage envelopes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welle-4-integration-stages
          path: out/stages/
          if-no-files-found: warn

      - name: Terminal-status gate
        shell: bash
        run: |
          set -euo pipefail
          verdict="${{ steps.aggregate.outputs.verdict }}"
          case "$verdict" in
            WELLE-4-INTACT)
              echo "Tag-72 Welle-4 integration-smoke INTACT"
              ;;
            WELLE-4-DRIFT)
              echo "::warning::Tag-72 Welle-4 integration-smoke DRIFT (operator-hand reads per-stage notes)"
              ;;
            WELLE-4-DEFECT)
              echo "::error::Tag-72 Welle-4 integration-smoke DEFECT (substrate contract break or snapshot-restore PLAN-DEFECT or cascade-break)"
              exit 1
              ;;
            *)
              echo "::error::unknown verdict: $verdict"
              exit 1
              ;;
          esac
