# SPDX-License-Identifier: Apache-2.0
#
# Phase-3c Welle-3 Validation Workflow — ADR-0065 + ADR-0066
# ----------------------------------------------------------
#
# Wired-substrate validation for the Phase-3c Welle-3 cutover
# (`bridge_audit_writer`, KW 25 solo per ADR-0066 §Welle-Sequenz).
# Runs the five Mira-Hand-defined acceptance steps for the Welle-3
# Cutover-Acceptance-Decision and emits a
# `cutover-acceptance-decision-welle-3.json` artifact.
#
# Henrik-Caution (ADR-0066 §"Bridge-Audit-Welle bleibt strikt solo")
# ------------------------------------------------------------------
#
# Welle-3 IS the bridge-audit cutover. The component being flipped
# (`bridge_audit_writer`, in-repo alias `anchor_emitter`) is itself
# the substrate behind the canonical cross-lang consistency oracle
# `tests/integration/test_bridge_audit_roundtrip_e2e.py`. Using that
# oracle to validate its own cutover would mean asking the subject
# under test to certify itself — Henrik (Internal Audit) flagged this
# in the ADR-0066 verification plan and demanded an *independent*
# consistency source for Step 4.
#
# Welle-3 Step 4 therefore replaces the bridge-audit-roundtrip-e2e
# call (used by Welle-1 PR #190 and Welle-2 PR #196) with the
# Phase-2-Acceptance-Gate cross-modul-stress aggregator
# (`scripts/doppelbetrieb-score-aggregator.py --mode=cross-modul-
# stress`, PR #197). That aggregator's three Cross-Modul axes are:
#
#   * cross-lang-pin-coverage (federation_frame, state_backing,
#     lifecycle_state_machine, subscribe_loop, recovery_workflow)
#   * cross-modul-fixture-stability
#   * cross-modul-rollup-integrity
#
# None of these axes use the bridge_audit_writer / anchor_emitter
# substrate as the source-of-truth oracle, so the signal is
# structurally independent from the subject under cutover. This
# satisfies the Henrik-Caution requirement.
#
# Component aliasing note
# -----------------------
#
# ADR-0065 §Welle-Sequenz lists `bridge_audit_writer` as the Welle-3
# component name; the in-repo dry-run + resolver substrate normalises
# this to the short form `anchor_emitter` via
# `scripts/phase-3c-cutover-dry-run.py:PHASE_3C_COMPONENT_ALIASES`.
# The two names refer to the same code-path:
#
#   ADR-0065 long-form: bridge_audit_writer
#   in-repo short-form: anchor_emitter
#   env-var (long):     WAKIR_BRIDGE_AUDIT_WRITER_BACKEND  (alias)
#   env-var (resolver): WAKIR_ANCHOR_EMITTER_BACKEND       (actual)
#
# The dry-run script accepts either component spelling at the CLI;
# we pass the ADR-0065 long-form so the workflow is self-documenting
# against the ADR vocabulary. Step 3 sets BOTH env-var spellings on
# the persona-boot step so:
#
#   * the ADR-0065-named env-var carries the Welle-3 vocabulary the
#     operator reads in the run-tab,
#   * the resolver's actual env-var
#     (`WAKIR_ANCHOR_EMITTER_BACKEND`) is what
#     `resolve_anchor_emitter_backend` reads at boot time.
#
# Distinction from sibling workflows
# ----------------------------------
#
# * `phase-3c-welle-1-validation.yml` (PR #190) — Welle-1 readiness
#   for `v907_verify`. Same 5-step pattern, different component, uses
#   bridge_audit_roundtrip_e2e as Step 4 (no Henrik-Caution conflict).
# * `phase-3c-welle-2-validation.yml` (PR #196) — Welle-2 readiness
#   for `svid_workload_identity`. Same 5-step pattern, parallel to
#   Welle-1 per ADR-0066 §Option-A+.
# * `phase-3c-welle-3-validation.yml` (THIS workflow) — Welle-3
#   readiness for `bridge_audit_writer`. Solo per ADR-0066.
#   Step 4 swapped to an independent oracle per Henrik-Caution.
# * `phase-2-acceptance-gate.yml` (PR #178, +PR #197 cross-modul-
#   stress mode) — daily ops rollup; this workflow reuses it as the
#   Step-4 independent oracle.
#
# NOT a required status check (per `feedback_branch_protection_check_
# names.md`): branch-protection enforcement is operator-hand-territory
# and lives outside this PR.
#
# Trigger surface
# ---------------
#
# * `schedule: cron "0 6 * * 3"` — every Wednesday at 06:00 UTC.
#   Same cadence as Welle-1 and Welle-2; the wednesday-cron slot is
#   the canonical readiness window three days before the Monday
#   Pilot-VM Live-Smoke. Welle-3 is solo in KW 25, so this workflow
#   runs alone on the Welle-3 wednesday.
#
# * `workflow_dispatch: {}` — manual run from the GitHub UI. The
#   dispatch inputs let the operator override the gate-aggregator
#   binary-count target, the dry-run boots count, and the cutover
#   feasibility-score band so a tighter or looser readiness floor
#   can be tested ad-hoc without editing the workflow.
#
# Gate-4 yellow tolerance
# -----------------------
#
# Identical posture to Welle-1/2: Gate-4 (backend-decision
# observability baseline) yields `yellow` when the
# `WAKIR_PHASE_3C_OBS_BASELINE_PATH` env-var is unset — that is the
# operator-hand-staged baseline-file substrate, which the
# GitHub-hosted runner does not have access to. The workflow
# therefore treats Gate-4-yellow as a warning (decision continues),
# but Gate-4-red (aggregator script missing) is a hard fail.
#
# Sandbox boundary
# ----------------
#
# All steps are hermetic: stdlib + pytest in-tree, no podman, no
# NATS, no live-VM, no Anthropic API, no SPIRE-Workload-API egress.
# The dry-run script uses its default stub binary-probe. The
# resolver gracefully falls back to Python when the (not-yet-shipped)
# Rust binary is missing; the dry-run uses the stub-probe-available
# path so the readiness signal reflects the resolver's decision-path
# rather than the binary's availability. The independent oracle in
# Step 4 (doppelbetrieb-score-aggregator --mode=cross-modul-stress)
# is also hermetic (stdlib + pytest in-tree).

# =============================================================================
# OPERATOR-PLAYBOOK (Tag-36 KW-25 Welle-3 Solo Cutover, ADR-0066)
# =============================================================================
#
# This workflow renders a `cutover-acceptance-decision-welle-3.json`
# envelope every Wednesday 06:00 UTC AND on every push-to-main that
# touches a Welle-3-relevant path. The envelope is the canonical
# go/no-go signal for the Monday Pilot-VM Live-Smoke of the
# `bridge_audit_writer` cutover.
#
# Operator decision rules (Mira-Hand final):
#
#   READY    -> Pre-flight smoke green, all five steps green, drift == 0,
#               self-reference-trap NOT detected. Cleared for Mo Live-Smoke.
#   CAUTION  -> Gate-4 yellow (observability baseline) is the only
#               yellow signal. Mira-Hand may proceed with operator
#               sign-off; the envelope records `henrik_caution_applied`.
#   BLOCK    -> Any of:
#                 * Pre-flight smoke fails (Selin's telemetry-emitter
#                   refuses to produce a snapshot).
#                 * Self-Reference-Trap detected (Step 2 health-check).
#                 * Cross-Modul-Drift > 0 (Step 4 health-check; strict
#                   threshold per Henrik-Caution Item 6, stricter than
#                   Welle-1/2's drift > 1 = CAUTION).
#                 * Henrik-Caution independent oracle red.
#                 * Decision feasibility-band below score-band-floor.
#               BLOCK signals must be reported to Mira before any
#               operator-hand-flip on Mo.
#
# Runbook anchors (Kai's Tag-32 + Tag-36 substrate):
#
#   * docs/operations/phase-3c-welle-3-runbook.md
#       — Full operator-cutover runbook (Mo/Mi/Do phases, rollback).
#   * docs/operations/welle-3-day-0-pipeline-runbook.md
#       — Day-0 orchestrator script wiring (Selin/Kai/Tomás contract).
#   * docs/operations/welle-3-telemetry-runbook.md
#       — Live telemetry interpretation (divergence-red-flag panel).
#
# Sister workflows: phase-3c-welle-1-validation.yml (PR #190),
# phase-3c-welle-2-validation.yml (PR #196). The bridge_audit_writer
# component IS the substrate behind those workflows' bridge-audit-
# roundtrip oracle, so Welle-3 deliberately swaps Step 4 to the
# independent cross-modul-stress aggregator (Henrik-Caution).
#
# =============================================================================

name: phase-3c-welle-3-validation

on:
  schedule:
    # Wednesday 06:00 UTC = ~08:00 CEST in May.
    - cron: "0 6 * * 3"
  workflow_dispatch:
    inputs:
      target-binary-count:
        description: "Gate-2/3 expected binary-inventory count (default 7)"
        required: false
        default: "7"
      boots:
        description: "Dry-run mocked-boot count (default 12)"
        required: false
        default: "12"
      score-band-floor:
        description: "Minimum cutover-feasibility band (GREEN/AMBER, default GREEN)"
        required: false
        default: "GREEN"
  # Push-to-main with Welle-3-relevant path-filter — Tag-36 addition.
  # Catches regressions in the substrate before the wednesday-cron
  # window so a broken Welle-3 readiness signal surfaces on PR-merge,
  # not three days into the cutover week.
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-3c-welle-3-validation.yml"
      - "scripts/phase-3c-trigger-gate-aggregator.py"
      - "scripts/phase-3c-cutover-dry-run.py"
      - "scripts/doppelbetrieb-score-aggregator.py"
      - "scripts/welle-3-telemetry-emitter.py"
      - "scripts/welle-3-day-0-pipeline.sh"
      - "wirelang/tests/persona_engine/test_rust_backend_switch.py"
      - "tests/acceptance/phase_3c/test_welle_3_bridge_audit_writer_e2e.py"
      - "tests/ci/test_phase_3c_welle_3_validation.py"
      - "tests/workflows/test_phase_3c_welle_3_validation.py"
      - "docs/operations/phase-3c-welle-3-runbook.md"
      - "docs/operations/welle-3-day-0-pipeline-runbook.md"
      - "docs/operations/welle-3-telemetry-runbook.md"

permissions:
  contents: read

jobs:
  phase-3c-welle-3-validation:
    name: Phase-3c Welle-3 Validation (bridge_audit_writer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ADR-0065 long-form component name (operator-facing vocabulary
      # consistent with the ADR's Welle-Sequenz table). The dry-run
      # script normalises this to the in-repo short form
      # `anchor_emitter` via PHASE_3C_COMPONENT_ALIASES.
      WELLE_COMPONENT: bridge_audit_writer
      WELLE_ENV_VAR: WAKIR_BRIDGE_AUDIT_WRITER_BACKEND
      # The resolver's actual env-var (the dry-run sets this
      # internally; we mirror it here so the run-tab self-documents
      # both spellings).
      WELLE_RESOLVER_ENV_VAR: WAKIR_ANCHOR_EMITTER_BACKEND
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        # Aggregator + dry-run are stdlib + PyYAML; pytest + the in-tree
        # wakir-runtime package are needed for the test-persona-boot
        # step and the doppelbetrieb-score-aggregator step.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.0"

      - name: Resolve dispatch inputs
        id: inputs
        env:
          INPUT_BINARY_COUNT: ${{ github.event.inputs.target-binary-count }}
          INPUT_BOOTS: ${{ github.event.inputs.boots }}
          INPUT_BAND: ${{ github.event.inputs.score-band-floor }}
        run: |
          BIN_COUNT="${INPUT_BINARY_COUNT:-7}"
          BOOTS="${INPUT_BOOTS:-12}"
          BAND="${INPUT_BAND:-GREEN}"
          echo "binary_count=${BIN_COUNT}" >> "$GITHUB_OUTPUT"
          echo "boots=${BOOTS}" >> "$GITHUB_OUTPUT"
          echo "band=${BAND}" >> "$GITHUB_OUTPUT"

      - name: Prepare output directory
        run: mkdir -p out

      # Pre-flight: Welle-3 telemetry smoke (Selin's emitter, Tag-31).
      #
      # Runs `scripts/welle-3-telemetry-emitter.py` in one-shot mode
      # against an empty decisions-JSONL substrate to verify the
      # telemetry-emitter binary loads, parses, and produces a
      # snapshot JSON without crashing. This is the Day-0-pipeline
      # contract's smoke-pre-flight (Kai's `welle-3-day-0-pipeline.sh`
      # Phase Mo, lifted into CI so a broken emitter surfaces on
      # PR-merge instead of three days into the cutover week).
      #
      # The smoke uses synthetic empty inputs (created on-the-fly).
      # If the emitter fails to start or returns a non-zero exit code,
      # the workflow records `pre_flight_smoke_ok=false` and Step 5
      # treats this as a hard BLOCK signal.
      - name: Pre-flight Welle-3 telemetry smoke (Selin's emitter)
        id: pre-flight-smoke
        continue-on-error: true
        run: |
          # Synthetic empty inputs — the emitter accepts an empty
          # decisions-JSONL and emits a zero-decision snapshot. We
          # only care that the binary runs end-to-end.
          : > out/pre-flight-decisions.jsonl
          python scripts/welle-3-telemetry-emitter.py \
            --decisions-jsonl out/pre-flight-decisions.jsonl \
            --out out/pre-flight-snapshot.json \
            > out/pre-flight.log 2>&1
          RC="$?"
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          if [ "$RC" = "0" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # Step 1: aggregate the five Phase-3c trigger-gates.
      #
      # Aggregator exit codes (see scripts/phase-3c-trigger-gate-
      # aggregator.py docstring):
      #   0 = all five gates green
      #   1 = at least one yellow, none red
      #   2 = at least one red
      #
      # We accept exit 0 and exit 1 (Gate-4 yellow tolerance, see
      # workflow header). Exit 2 fails the job at the
      # acceptance-decision-render step.
      - name: Step 1 — Phase-3c trigger-gate aggregator
        id: gate-aggregator
        continue-on-error: true
        run: |
          python scripts/phase-3c-trigger-gate-aggregator.py \
            --target-binary-count "${{ steps.inputs.outputs.binary_count }}" \
            --json \
            > out/trigger-gate-report.json
          RC=$?
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          if [ "$RC" = "0" ]; then
            echo "gate_status=green" >> "$GITHUB_OUTPUT"
          elif [ "$RC" = "1" ]; then
            echo "gate_status=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "gate_status=red" >> "$GITHUB_OUTPUT"
          fi

      # Step 2: cutover-dry-run for bridge_audit_writer.
      #
      # `--component bridge_audit_writer` uses the ADR-0065 long-form
      # name; the dry-run script normalises this internally to the
      # in-repo short form `anchor_emitter` via the
      # PHASE_3C_COMPONENT_ALIASES map. The dry-run uses its default
      # stub binary-probe (the Rust crate is not yet on the runner).
      # The resolver decides "rust" on the stubbed-available path,
      # yielding the same GREEN band the Welle-1/2 dry-runs produce —
      # that is the substance signal the Step-5 decision logic
      # measures.
      - name: Step 2 — cutover-dry-run (bridge_audit_writer)
        id: dry-run
        continue-on-error: true
        run: |
          python scripts/phase-3c-cutover-dry-run.py \
            --component "${WELLE_COMPONENT}" \
            --boots "${{ steps.inputs.outputs.boots }}" \
            --output out/dry-run-envelope.json
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # Health-Check: Self-Reference-Trap detector (Henrik-Caution).
      #
      # The Welle-3 cutover flips the `bridge_audit_writer` substrate.
      # That substrate is itself the BackendDecision-audit emitter
      # behind the canonical cross-lang consistency oracle
      # `tests/integration/test_bridge_audit_roundtrip_e2e.py`. If
      # any Step-4-oracle-reference in this workflow OR the
      # dry-run-envelope-recorded consistency-signal-source points
      # back at `bridge_audit_writer` / `anchor_emitter` /
      # `bridge_audit_roundtrip_e2e`, that is the
      # "subject-under-test certifies itself" self-reference trap
      # Henrik flagged in the ADR-0066 verification plan.
      #
      # This detector inspects the dry-run envelope (Step 2 output)
      # and the workflow-self-source for any of the trap strings; if
      # detected, the workflow records `self_reference_trap=true` and
      # Step 5 treats this as a hard BLOCK signal — even if every
      # other step is green. The detector encodes the Henrik-Caution
      # invariant as a runtime guard, so a future workflow edit that
      # accidentally re-introduces the bridge-audit-roundtrip oracle
      # cannot ship past CI.
      - name: Step 2.5 — Self-Reference-Trap detector (Henrik-Caution)
        id: self-reference-trap
        continue-on-error: true
        env:
          WORKFLOW_PATH: .github/workflows/phase-3c-welle-3-validation.yml
        run: |
          python - <<'PY'
          import json, os, pathlib, sys

          out_dir = pathlib.Path("out")
          trap_path = out_dir / "self-reference-trap.json"

          # Trap-strings: any reference that would make the subject
          # under cutover certify its own switch.
          TRAP_STRINGS = (
              "test_bridge_audit_roundtrip_e2e",
              "bridge_audit_roundtrip_e2e",
          )

          findings = []

          # Check 1: dry-run envelope must not name the trap oracle
          # as its consistency-signal-source.
          dry_path = out_dir / "dry-run-envelope.json"
          if dry_path.exists() and dry_path.stat().st_size > 0:
              try:
                  envelope = json.loads(dry_path.read_text("utf-8"))
              except json.JSONDecodeError:
                  envelope = {}
              src = json.dumps(envelope, sort_keys=True)
              for trap in TRAP_STRINGS:
                  if trap in src:
                      findings.append({
                          "where": "dry-run-envelope",
                          "trap": trap,
                      })

          # Check 2: the workflow-self must not (re-)introduce the
          # trap oracle in any step's `run:` body.
          wf_path = pathlib.Path(os.environ["WORKFLOW_PATH"])
          if wf_path.exists():
              wf_src = wf_path.read_text("utf-8")
              for trap in TRAP_STRINGS:
                  # Only flag in `run:`-context, not comments. We
                  # detect by checking the trap appears outside a
                  # leading `#` line.
                  for ln in wf_src.splitlines():
                      stripped = ln.lstrip()
                      if stripped.startswith("#"):
                          continue
                      if trap in ln:
                          findings.append({
                              "where": "workflow-self",
                              "trap": trap,
                              "line": ln.strip()[:120],
                          })

          trap_detected = bool(findings)
          report = {
              "schema": "wakir.phase-3c.welle-3.self-reference-trap/1",
              "trap_detected": trap_detected,
              "findings": findings,
              "henrik_caution": (
                  "Welle-3 subject (bridge_audit_writer) cannot use "
                  "bridge_audit_roundtrip oracle as consistency source."
              ),
          }
          trap_path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          # Exit 0 if no trap; exit 1 if trap detected. continue-on-
          # error lets Step 5 still render the decision envelope.
          sys.exit(1 if trap_detected else 0)
          PY
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # Step 3: test-persona-boot with WAKIR_BRIDGE_AUDIT_WRITER_
      # BACKEND=rust (ADR-0065 long-form) AND WAKIR_ANCHOR_EMITTER_
      # BACKEND=rust (resolver-actual).
      #
      # We exercise the resolver in-process by running the existing
      # rust_backend_switch test suite filtered to the anchor_emitter
      # test vectors (AE1..AE12+, see tests/persona_engine/
      # test_rust_backend_switch.py L2849+). Both env-vars are set
      # explicitly so the test captures the production-flip scenario
      # under both ADR-0065 vocabularies; the resolver still uses its
      # in-test binary-probe stubs, so no real Rust binary is invoked.
      #
      # The pytest filter uses `anchor_emitter` (the in-repo short
      # form) because the test function names follow the short-form
      # convention (test_anchor_emitter_*). The ADR-0065 long-form
      # `bridge_audit_writer` is captured in the env-var name + the
      # workflow's WELLE_COMPONENT pin.
      - name: Step 3 — test-persona-boot (rust backend opt-in)
        id: persona-boot
        continue-on-error: true
        env:
          WAKIR_BRIDGE_AUDIT_WRITER_BACKEND: rust
          WAKIR_ANCHOR_EMITTER_BACKEND: rust
        run: |
          python -m pytest \
            wirelang/tests/persona_engine/test_rust_backend_switch.py \
            -k "anchor_emitter" \
            --tb=short \
            -q \
            --junit-xml=out/persona-boot-junit.xml \
            | tee out/persona-boot.log
          # PIPESTATUS[0] is pytest's exit code (0 = pass, 5 = no
          # tests collected, anything else = failure).
          RC="${PIPESTATUS[0]}"
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"

      # Step 4 (Henrik-Caution) — independent cross-lang consistency
      # oracle via doppelbetrieb-score-aggregator --mode=cross-modul-
      # stress.
      #
      # Rationale: Welle-3 is the bridge_audit_writer cutover, which
      # IS the substrate behind the canonical bridge-audit-roundtrip
      # oracle Welle-1/2 use at Step 4. Asking the subject under test
      # to certify itself would defeat the purpose of the readiness
      # check; Henrik (Internal Audit) flagged this in the ADR-0066
      # verification plan and demanded an independent consistency
      # source for Welle-3.
      #
      # The cross-modul-stress mode of the Phase-2-Acceptance-Gate
      # aggregator runs three Cross-Modul axes:
      #
      #   * cross-lang-pin-coverage
      #   * cross-modul-fixture-stability
      #   * cross-modul-rollup-integrity
      #
      # None use bridge_audit_writer / anchor_emitter substrate as the
      # source-of-truth oracle. The aggregator exit code reflects the
      # threshold-pass verdict (default 3-of-3 in cross-modul-stress
      # mode). Exit 0 = independent oracle green; exit non-zero =
      # independent oracle red.
      #
      # Threshold: we use the aggregator's default cross-modul-stress
      # threshold (3); the workflow-level WELLE_BAND_FLOOR controls
      # the dry-run band-floor, not the independent-oracle threshold.
      - name: Step 4 — independent cross-lang consistency (Henrik-Caution)
        id: cross-modul-stress
        continue-on-error: true
        run: |
          python scripts/doppelbetrieb-score-aggregator.py \
            --mode=cross-modul-stress \
            --threshold 3 \
            --out out/cross-modul-stress-rollup.json \
            | tee out/cross-modul-stress.log
          RC="${PIPESTATUS[0]}"
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"

      # Step 4.5 — Cross-Modul-Drift check (drift > 0 = BLOCK).
      #
      # Henrik-Caution Item 6 (ADR-0066 verification plan, KW 25
      # solo posture) demands a stricter cross-modul-drift threshold
      # for Welle-3 than for Welle-1/2: ANY non-zero drift between the
      # five-modul Phase-3a substrate pin-set and the cutover-candidate
      # substrate is a BLOCK (Welle-1/2 used drift > 1 = CAUTION).
      #
      # The "drift" here is the absence of axis-pass on any of the
      # three Cross-Modul axes of the doppelbetrieb-score-aggregator
      # output (Step 4 rollup):
      #   * cross-lang-pin-coverage
      #   * cross-modul-fixture-stability
      #   * cross-modul-rollup-integrity
      #
      # drift := count(axes where axis_pass=false) on the
      # `cross-modul-stress-rollup.json`. drift==0 means all three
      # axes are green; drift>=1 means BLOCK.
      #
      # This is structurally stricter than the Step-4 threshold-pass
      # check: Step 4 may be threshold-pass=true even with one axis
      # failing (if the threshold is configured loose), but Welle-3
      # treats any axis-fail as a BLOCK.
      - name: Step 4.5 — Cross-Modul-Drift check (drift > 0 = BLOCK)
        id: drift-check
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib, sys

          out_dir = pathlib.Path("out")
          drift_path = out_dir / "cross-modul-drift.json"
          rollup_path = out_dir / "cross-modul-stress-rollup.json"

          rollup = {}
          if rollup_path.exists() and rollup_path.stat().st_size > 0:
              try:
                  rollup = json.loads(rollup_path.read_text("utf-8"))
              except json.JSONDecodeError:
                  rollup = {}

          # Aggregator schema: rollup may carry either a top-level
          # `axes` list or `result.axes`. Defensive parse: collect
          # any dict-shaped axis-entries with an `axis_pass` field.
          def _collect_axes(obj):
              found = []
              if isinstance(obj, dict):
                  if "axis_pass" in obj and (
                      "name" in obj or "axis" in obj
                  ):
                      found.append(obj)
                  for v in obj.values():
                      found.extend(_collect_axes(v))
              elif isinstance(obj, list):
                  for item in obj:
                      found.extend(_collect_axes(item))
              return found

          axes = _collect_axes(rollup)

          # If the aggregator did not emit per-axis records, fall
          # back to the threshold-pass flag: threshold_pass=false
          # is treated as drift>0 (any axis-fail).
          if not axes:
              tp = rollup.get("threshold_pass")
              drift = 0 if tp is True else (1 if tp is False else 0)
              axes_summary = []
          else:
              drift = sum(1 for a in axes if not a.get("axis_pass"))
              axes_summary = [
                  {
                      "axis": a.get("name") or a.get("axis"),
                      "axis_pass": bool(a.get("axis_pass")),
                  }
                  for a in axes
              ]

          # Welle-3-specific strict threshold: drift > 0 = BLOCK.
          # (Welle-1/2 used drift > 1 = CAUTION; Welle-3 is stricter
          # per Henrik-Caution Item 6.)
          block = drift > 0

          report = {
              "schema": "wakir.phase-3c.welle-3.cross-modul-drift/1",
              "drift": drift,
              "axes": axes_summary,
              "threshold_policy": "drift_gt_0_equals_block",
              "welle_1_2_policy": "drift_gt_1_equals_caution",
              "welle_3_strict": True,
              "block": block,
              "henrik_caution_item": 6,
          }
          drift_path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          sys.exit(1 if block else 0)
          PY
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # Step 5: cutover-acceptance-decision JSON envelope.
      #
      # Collapses the four upstream-step outcomes plus the gate-
      # aggregator report, the dry-run envelope, and the
      # independent-oracle rollup into a single JSON artifact that the
      # operator (Reza, Tomás, Henrik) reads to decide go/no-go for
      # the Welle-3 Mo Live-Smoke.
      #
      # Decision policy:
      #   * READY      — all four steps green; gate-status in
      #                  {green, yellow-with-only-gate-4-yellow}.
      #   * NOT-READY  — any step failed OR gate-status red OR
      #                  dry-run band below score-band-floor.
      #
      # Step 4 (Henrik-Caution): the independent oracle exit code
      # must be 0 (threshold-pass) for `ready_for_live_smoke == true`.
      # The aggregator's own threshold logic decides what "green"
      # means (3-of-3 Cross-Modul axes pass).
      #
      # The decision is a SOFT signal — Mira/Operator-Hand-Final.
      # The workflow exit-code reflects the decision so the GH UI
      # surfaces a clear pass/fail badge.
      - name: Step 5 — render cutover-acceptance-decision
        id: decision
        # Always run, even if upstream steps red (we want the
        # decision artifact to capture the failure state).
        if: always()
        env:
          GATE_RC: ${{ steps.gate-aggregator.outputs.rc }}
          DRY_RUN_RC: ${{ steps.dry-run.outputs.rc }}
          BOOT_RC: ${{ steps.persona-boot.outputs.rc }}
          STRESS_RC: ${{ steps.cross-modul-stress.outputs.rc }}
          SCORE_BAND_FLOOR: ${{ steps.inputs.outputs.band }}
          BOOTS_INPUT: ${{ steps.inputs.outputs.boots }}
          BIN_COUNT_INPUT: ${{ steps.inputs.outputs.binary_count }}
          PREFLIGHT_RC: ${{ steps.pre-flight-smoke.outputs.rc }}
          PREFLIGHT_OK: ${{ steps.pre-flight-smoke.outputs.ok }}
          SELF_REF_TRAP_RC: ${{ steps.self-reference-trap.outputs.rc }}
          DRIFT_CHECK_RC: ${{ steps.drift-check.outputs.rc }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys

          out_dir = pathlib.Path("out")
          decision_path = out_dir / "cutover-acceptance-decision.json"

          def _read_json(name):
              p = out_dir / name
              if not p.exists() or p.stat().st_size == 0:
                  return None
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  return None

          def _rc(env_name):
              v = os.environ.get(env_name) or "-1"
              try:
                  return int(v)
              except ValueError:
                  return -1

          gate_rc = _rc("GATE_RC")
          dry_rc = _rc("DRY_RUN_RC")
          boot_rc = _rc("BOOT_RC")
          stress_rc = _rc("STRESS_RC")
          preflight_rc = _rc("PREFLIGHT_RC")
          self_ref_rc = _rc("SELF_REF_TRAP_RC")
          drift_rc = _rc("DRIFT_CHECK_RC")
          floor = (os.environ.get("SCORE_BAND_FLOOR") or "GREEN").upper()

          trigger_report = _read_json("trigger-gate-report.json") or {}
          dry_run_envelope = _read_json("dry-run-envelope.json") or {}
          stress_rollup = _read_json("cross-modul-stress-rollup.json") or {}
          self_ref_report = _read_json("self-reference-trap.json") or {}
          drift_report = _read_json("cross-modul-drift.json") or {}

          # Gate-status: 0=green, 1=yellow (tolerable for Gate-4),
          # 2=red (hard fail).
          gate_ok = gate_rc == 0
          gate_tolerable = False
          if gate_rc == 1:
              # Yellow tolerated only when Gate-4 (observability
              # baseline) is the sole yellow.
              gates = trigger_report.get("gates", [])
              non_green = [
                  g for g in gates
                  if g.get("status") != "green"
              ]
              gate_tolerable = (
                  len(non_green) == 1
                  and non_green[0].get("id") == "gate-4"
              )
          dry_ok = dry_rc == 0
          boot_ok = boot_rc == 0
          # Step 4 (Henrik-Caution): exit 0 = threshold-pass on the
          # independent oracle. No "all-skip" path — the aggregator
          # is deterministic and always produces a verdict.
          stress_ok = stress_rc == 0

          band = (
              dry_run_envelope.get("feasibility", {}).get("band", "UNKNOWN")
          )
          band_order = {"GREEN": 3, "AMBER": 2, "RED": 1, "BLOCKED": 0}
          band_score = band_order.get(band, 0)
          floor_score = band_order.get(floor, 3)
          band_ok = band_score >= floor_score

          gate_signal = "green" if gate_ok else (
              "yellow_tolerated" if gate_tolerable else "red"
          )

          # Tag-36 additions (Welle-3 strict posture):
          # Pre-flight smoke must pass. Self-Reference-Trap must NOT
          # be detected. Cross-Modul-Drift must be 0.
          preflight_ok = preflight_rc == 0
          # self_ref_rc: 0 = no trap detected; 1 = trap detected.
          self_ref_clean = self_ref_rc == 0
          self_ref_trap_detected = bool(
              self_ref_report.get("trap_detected")
          )
          # drift_rc: 0 = drift==0; 1 = drift>0 (BLOCK).
          drift_clean = drift_rc == 0
          drift_value = drift_report.get("drift")

          # READY/CAUTION/BLOCK verdict policy:
          #   BLOCK   -> any hard signal flips: pre-flight smoke fails,
          #              self-reference-trap detected, drift > 0,
          #              gate-aggregator red, dry-run/boot/stress red,
          #              feasibility band below floor.
          #   CAUTION -> READY-eligible but gate-status is
          #              yellow-tolerated (Gate-4 observability
          #              baseline only).
          #   READY   -> everything green.
          hard_block_reasons = []
          if not preflight_ok:
              hard_block_reasons.append("pre_flight_smoke_failed")
          if self_ref_trap_detected or not self_ref_clean:
              hard_block_reasons.append("self_reference_trap_detected")
          if not drift_clean:
              hard_block_reasons.append("cross_modul_drift_nonzero")
          if not (gate_ok or gate_tolerable):
              hard_block_reasons.append("trigger_gate_aggregator_red")
          if not dry_ok:
              hard_block_reasons.append("dry_run_failed")
          if not boot_ok:
              hard_block_reasons.append("persona_boot_failed")
          if not stress_ok:
              hard_block_reasons.append("independent_oracle_red")
          if not band_ok:
              hard_block_reasons.append("feasibility_band_below_floor")

          if hard_block_reasons:
              verdict = "BLOCK"
          elif gate_tolerable:
              verdict = "CAUTION"
          else:
              verdict = "READY"

          ready = verdict == "READY"
          go_no_go = "GO" if verdict in ("READY", "CAUTION") else "NO-GO"

          decision = {
              "schema": "wakir.phase-3c.welle-3-validation/1",
              "welle": 3,
              "component": "bridge_audit_writer",
              "component_resolver_alias": "anchor_emitter",
              "env_var": "WAKIR_BRIDGE_AUDIT_WRITER_BACKEND",
              "env_var_resolver_alias": "WAKIR_ANCHOR_EMITTER_BACKEND",
              "henrik_caution_applied": True,
              "step_4_oracle": "doppelbetrieb-score-aggregator --mode=cross-modul-stress",
              "ready_for_live_smoke": ready,
              "verdict": verdict,
              "go_no_go": go_no_go,
              "hard_block_reasons": hard_block_reasons,
              "score_band_floor": floor,
              "observed_band": band,
              "pre_flight_smoke": {
                  "exit_code": preflight_rc,
                  "ok": preflight_ok,
                  "source_script": "scripts/welle-3-telemetry-emitter.py",
              },
              "self_reference_trap": {
                  "exit_code": self_ref_rc,
                  "clean": self_ref_clean,
                  "trap_detected": self_ref_trap_detected,
                  "findings_count": len(
                      self_ref_report.get("findings") or []
                  ),
                  "henrik_caution": (
                      "subject_under_cutover_cannot_certify_self"
                  ),
              },
              "cross_modul_drift_check": {
                  "exit_code": drift_rc,
                  "clean": drift_clean,
                  "drift": drift_value,
                  "threshold_policy": "drift_gt_0_equals_block",
                  "welle_3_strict": True,
                  "henrik_caution_item": 6,
              },
              "steps": {
                  "step_1_trigger_gates": {
                      "exit_code": gate_rc,
                      "status": gate_signal,
                  },
                  "step_2_cutover_dry_run": {
                      "exit_code": dry_rc,
                      "ok": dry_ok,
                  },
                  "step_3_persona_boot_rust": {
                      "exit_code": boot_rc,
                      "ok": boot_ok,
                  },
                  "step_4_cross_modul_stress": {
                      "exit_code": stress_rc,
                      "ok": stress_ok,
                      "henrik_caution": "independent_oracle",
                  },
              },
              "inputs": {
                  "target_binary_count": int(
                      os.environ.get("BIN_COUNT_INPUT") or "7"
                  ),
                  "boots": int(os.environ.get("BOOTS_INPUT") or "12"),
              },
              "trigger_report_summary": {
                  "all_green": trigger_report.get("all_green"),
                  "ready_for_phase_3c": trigger_report.get(
                      "ready_for_phase_3c"
                  ),
                  "gate_count": len(trigger_report.get("gates", [])),
              },
              "dry_run_summary": {
                  "feasibility_score": dry_run_envelope.get(
                      "feasibility", {}
                  ).get("cutover_feasibility_score"),
                  "band": band,
                  "boots": dry_run_envelope.get("boots"),
              },
              "cross_modul_stress_summary": {
                  "total_score": stress_rollup.get("total_score"),
                  "threshold": stress_rollup.get("threshold"),
                  "threshold_pass": stress_rollup.get("threshold_pass"),
                  "mode": stress_rollup.get("mode"),
              },
              "anchors": {
                  "adr_cutover": "decisions/0065-phase-3c-cutover-python-default-zu-rust-default.md",
                  "adr_acceleration": "decisions/0066-phase-3c-beschleunigung-option-a-plus.md",
                  "runbook": "docs/operations/phase-3c-welle-3-runbook.md",
                  "runbook_day_0": "docs/operations/welle-3-day-0-pipeline-runbook.md",
                  "runbook_telemetry": "docs/operations/welle-3-telemetry-runbook.md",
                  "welle_1_sibling": ".github/workflows/phase-3c-welle-1-validation.yml",
                  "welle_2_sibling": ".github/workflows/phase-3c-welle-2-validation.yml",
                  "independent_oracle": ".github/workflows/phase-2-acceptance-gate.yml",
                  "selin_smoke_emitter": "scripts/welle-3-telemetry-emitter.py",
                  "kai_day_0_pipeline": "scripts/welle-3-day-0-pipeline.sh",
              },
          }

          decision_path.write_text(
              json.dumps(decision, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(decision, indent=2, sort_keys=True))

          # Append a step-summary table for the run-tab.
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("# Phase-3c Welle-3 Validation — bridge_audit_writer\n\n")
                  f.write(
                      f"**Verdict:** {verdict}  -  "
                      f"**Go/No-Go:** {go_no_go}  -  "
                      f"**Band:** {band}  -  "
                      f"**Floor:** {floor}\n\n"
                  )
                  if hard_block_reasons:
                      f.write(
                          "**Hard-Block reasons:** "
                          + ", ".join(hard_block_reasons)
                          + "\n\n"
                      )
                  f.write(
                      "**Henrik-Caution:** Step 4 oracle is "
                      "`doppelbetrieb-score-aggregator --mode="
                      "cross-modul-stress` (independent of "
                      "bridge_audit_writer substrate). Drift > 0 = "
                      "BLOCK (stricter than Welle-1/2).\n\n"
                  )
                  f.write("| Step | Exit | Status |\n|---|---|---|\n")
                  f.write(
                      f"| Pre-flight Selin-Smoke | {preflight_rc} | "
                      f"{'OK' if preflight_ok else 'FAIL'} |\n"
                  )
                  f.write(
                      f"| 1. Trigger-Gates | {gate_rc} | "
                      f"{gate_signal} |\n"
                  )
                  f.write(
                      f"| 2. Dry-Run | {dry_rc} | "
                      f"{'OK' if dry_ok else 'FAIL'} |\n"
                  )
                  f.write(
                      f"| 2.5 Self-Reference-Trap | {self_ref_rc} | "
                      f"{'CLEAN' if self_ref_clean else 'TRAP'} |\n"
                  )
                  f.write(
                      f"| 3. Persona-Boot (rust) | {boot_rc} | "
                      f"{'OK' if boot_ok else 'FAIL'} |\n"
                  )
                  f.write(
                      f"| 4. Cross-Modul-Stress (Henrik) | "
                      f"{stress_rc} | "
                      f"{'OK' if stress_ok else 'FAIL'} |\n"
                  )
                  f.write(
                      f"| 4.5 Cross-Modul-Drift | {drift_rc} | "
                      f"{'OK (drift=0)' if drift_clean else 'BLOCK (drift>0)'} |\n"
                  )
                  f.write(
                      "\nArtifact: `cutover-acceptance-decision-welle-3` (this run).\n"
                      "\nAnchors: ADR-0065, ADR-0066, "
                      "docs/operations/phase-3c-welle-3-runbook.md, "
                      "docs/operations/welle-3-day-0-pipeline-runbook.md, "
                      "docs/operations/welle-3-telemetry-runbook.md.\n"
                  )

          # Exit-code semantics:
          #   0 = READY or CAUTION (operator may proceed; CAUTION
          #       requires Mira-Hand sign-off but does not fail CI).
          #   1 = BLOCK (hard-block reason present, operator must
          #       resolve before Mo Live-Smoke).
          sys.exit(0 if verdict in ("READY", "CAUTION") else 1)
          PY

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover-acceptance-decision-welle-3
          path: |
            out/cutover-acceptance-decision.json
            out/trigger-gate-report.json
            out/dry-run-envelope.json
            out/persona-boot.log
            out/persona-boot-junit.xml
            out/cross-modul-stress.log
            out/cross-modul-stress-rollup.json
            out/pre-flight-snapshot.json
            out/pre-flight.log
            out/self-reference-trap.json
            out/cross-modul-drift.json
          if-no-files-found: warn
          retention-days: 30
