# SPDX-License-Identifier: Apache-2.0
#
# Phase-3c Welle-5 Validation Workflow - ADR-0065 + ADR-0066
# ----------------------------------------------------------
#
# Wired-substrate validation for the Phase-3c Welle-5 cutover
# (`lifecycle_state_machine` / in-repo short form `fsm`, KW 26
# parallel-execution per ADR-0066 Option-A+). Runs the Tag-38
# Mira-Hand-defined acceptance pipeline for the Welle-5 Cutover-
# Acceptance-Decision and emits a
# `cutover-acceptance-decision-welle-5.json` artifact.
#
# Tag-38 promotes this workflow from the Welle-1/2 5-step pattern to
# the Welle-3 strict pattern (PR #238, `0e54699`): pre-flight smoke,
# FSM-Transition-Integrity-Check + Phantom-Transition-Detection,
# Cross-Modul-Drift to Welle-4 state_backing (symmetric A7 pendant,
# drift > 0 = BLOCK), Decision-Aggregation (READY/CAUTION/BLOCK), and
# JSON-Verdict + Go/No-Go. The Cross-Modul-Drift axis is symmetric
# with Welle-4 because both wellen share the same state-mutation
# fixture-pair (every fsm transition writes through state_backing).
#
# Distinction from sibling workflows
# ----------------------------------
#
# * `phase-3c-welle-1-validation.yml` (PR #190) - Welle-1 readiness
#   check for `v907_verify` (5-step pattern).
# * `phase-3c-welle-2-validation.yml` (PR #196) - Welle-2 readiness
#   check for `svid_workload_identity` (5-step pattern).
# * `phase-3c-welle-3-validation.yml` (PR #238) - Welle-3 readiness
#   check for `bridge_audit_writer`, solo per ADR-0066, Henrik-Caution
#   self-reference-trap detector, strict drift > 0 = BLOCK. Pattern-
#   vorbild for THIS workflow's Tag-38 additions.
# * `phase-3c-welle-4-validation.yml` - Welle-4 readiness check for
#   `state_backing`. KW-26 Doppel-Welle partner; the Cross-Modul-
#   Drift axis is the symmetric A7 pendant to this workflow's drift
#   axis (both wellen share state_backing x lifecycle_state_machine
#   fixture-pair).
# * `phase-3c-welle-5-validation.yml` (THIS workflow) - Welle-5
#   readiness check for `lifecycle_state_machine`. Tag-38 promoted
#   to Welle-3 pattern with FSM-specific transition-integrity check.
#
# Naming
# ------
#
# ADR-0066 uses the long-form name `lifecycle_state_machine` for the
# Welle-5 component; the in-repo dry-run/resolver substrate uses the
# short form `fsm` (see `scripts/phase-3c-cutover-dry-run.py`
# PHASE_3C_COMPONENT_ALIASES and
# `wirelang/persona_engine/rust_backend_switch.py`
# `resolve_fsm_backend`). The dry-run script accepts both spellings
# and normalises to the short form. This workflow uses the short
# form `fsm` for the dry-run and pytest-selector arguments and the
# long form `lifecycle_state_machine` for human-facing labels and
# the decision-envelope `component` field so the artifact reads
# clean to operators.
#
# NOT a required status check (per `feedback_branch_protection_check_
# names.md`).
#
# FSM-Transition-Integrity-Check + Phantom-Transition-Detection
# -------------------------------------------------------------
#
# Welle-5 cutover flips the `lifecycle_state_machine` substrate from
# Python to Rust. The FSM defines a finite set of legal transitions
# (idle -> active -> terminating -> archived) plus the negative
# space - the set of transitions that MUST NEVER appear in either
# the Python or Rust implementation (e.g. archived -> active,
# terminating -> idle). A "phantom transition" is a transition that
# the Rust resolver accepts but the Python resolver rejects (or
# vice-versa); a "missing transition" is a transition that one
# resolver legitimately permits but the other refuses.
#
# Step 2.5 inspects the dry-run envelope's transition-table summary
# and verifies:
#   * the legal transition set is identical between resolvers,
#   * the phantom transition set is empty,
#   * the missing transition set is empty.
#
# Any non-empty phantom/missing set is a hard BLOCK signal, even if
# every other step is green. This guards against silent FSM-table
# drift between the two implementations.
#
# Cross-Modul-Drift (symmetric A7 pendant to Welle-4 state_backing)
# -----------------------------------------------------------------
#
# Step 4.5 measures Cross-Modul-Drift between the Welle-5
# (`lifecycle_state_machine`) substrate and the Welle-4
# (`state_backing`) substrate via the doppelbetrieb-score-aggregator
# `cross-modul-stress` mode. The drift threshold is strict: drift > 0
# = BLOCK (same posture as Welle-3, stricter than Welle-1/2). The
# Welle-4 workflow runs the symmetric A7 pendant of this drift check
# from its own perspective; the KW-26 Doppel-Welle ships only when
# BOTH workflows report drift==0.
#
# Trigger surface
# ---------------
#
# * `schedule: cron "0 6 * * 3"` - Wednesday 06:00 UTC, same slot
#   as Welle-1/2/3/4.
# * `workflow_dispatch: {}` - manual run with the standard three
#   dispatch inputs.
# * `push: branches: [main]` with Welle-5-relevant path-filter
#   (Tag-38 addition).
#
# Sandbox boundary
# ----------------
#
# Hermetic: stdlib + pytest + in-tree wakir-runtime package. No
# podman, no NATS, no live-VM, no Anthropic API. The fsm resolver
# uses the in-test binary-probe stubs; the dry-run uses its default
# stub probe; the Cross-Modul-Drift step composes the aggregator
# against synthetic fixture-pairs.

# =============================================================================
# OPERATOR-PLAYBOOK (Tag-38 KW-26 Welle-5 Doppel-Welle Cutover, ADR-0066)
# =============================================================================
#
# This workflow renders a `cutover-acceptance-decision-welle-5.json`
# envelope every Wednesday 06:00 UTC AND on every push-to-main that
# touches a Welle-5-relevant path. The envelope is the canonical
# go/no-go signal for the Monday Pilot-VM Live-Smoke of the
# `lifecycle_state_machine` cutover.
#
# Operator decision rules (Mira-Hand final):
#
#   READY    -> Pre-flight smoke green, all five substantive steps
#               green, drift == 0, phantom/missing transition sets
#               empty. Cleared for Mo Live-Smoke.
#   CAUTION  -> Gate-4 yellow (observability baseline) is the only
#               yellow signal. Mira-Hand may proceed with operator
#               sign-off; the envelope records `gate_4_yellow_tolerated`.
#   BLOCK    -> Any of:
#                 * Pre-flight smoke fails (Welle-5 fsm-resolver smoke
#                   refuses to produce a snapshot).
#                 * FSM-Transition-Integrity violated (phantom or
#                   missing transition set non-empty).
#                 * Cross-Modul-Drift > 0 (Step 4.5 health-check, A7
#                   symmetric pendant to Welle-4).
#                 * Gate-aggregator red, dry-run/boot/bridge-audit red.
#                 * Decision feasibility-band below score-band-floor.
#               BLOCK signals must be reported to Mira before any
#               operator-hand-flip on Mo.
#
# Runbook anchors (Kai's Tag-38 substrate):
#
#   * docs/operations/phase-3c-welle-5-runbook.md
#       - Full operator-cutover runbook (Mo/Mi/Do phases, rollback).
#   * docs/operations/phase-3c-welle-4-runbook.md
#       - KW-26 Doppel-Welle partner runbook; Cross-Modul-Drift is
#         symmetric between the two workflows.
#
# Sister workflows: phase-3c-welle-3-validation.yml (PR #238,
# pattern vorbild), phase-3c-welle-4-validation.yml (KW-26 Doppel-
# Welle partner).
#
# =============================================================================

name: phase-3c-welle-5-validation

on:
  schedule:
    # Wednesday 06:00 UTC = ~08:00 CEST in May.
    - cron: "0 6 * * 3"
  workflow_dispatch:
    inputs:
      target-binary-count:
        description: "Gate-2/3 expected binary-inventory count (default 15, Tag-80 bump)"
        required: false
        default: "15"
      boots:
        description: "Dry-run mocked-boot count (default 12)"
        required: false
        default: "12"
      score-band-floor:
        description: "Minimum cutover-feasibility band (GREEN/AMBER, default GREEN)"
        required: false
        default: "GREEN"
  # Push-to-main with Welle-5-relevant path-filter - Tag-38 addition.
  # Catches regressions in the substrate before the wednesday-cron
  # window so a broken Welle-5 readiness signal surfaces on PR-merge,
  # not three days into the cutover week.
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-3c-welle-5-validation.yml"
      - "scripts/phase-3c-trigger-gate-aggregator.py"
      - "scripts/phase-3c-cutover-dry-run.py"
      - "scripts/doppelbetrieb-score-aggregator.py"
      - "wirelang/tests/persona_engine/test_rust_backend_switch.py"
      - "tests/acceptance/phase_3c/test_welle_5_lifecycle_state_machine_e2e.py"
      - "tests/ci/test_phase_3c_welle_5_validation.py"
      - "docs/operations/phase-3c-welle-5-runbook.md"
      - "docs/operations/phase-3c-welle-4-runbook.md"

permissions:
  contents: read

jobs:
  phase-3c-welle-5-validation:
    name: Phase-3c Welle-5 Validation (lifecycle_state_machine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WELLE_COMPONENT: fsm
      WELLE_COMPONENT_LONG: lifecycle_state_machine
      WELLE_ENV_VAR: WAKIR_FSM_BACKEND
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.0" "pyyaml>=6.0"

      - name: Resolve dispatch inputs
        id: inputs
        env:
          INPUT_BINARY_COUNT: ${{ github.event.inputs.target-binary-count }}
          INPUT_BOOTS: ${{ github.event.inputs.boots }}
          INPUT_BAND: ${{ github.event.inputs.score-band-floor }}
        run: |
          BIN_COUNT="${INPUT_BINARY_COUNT:-7}"
          BOOTS="${INPUT_BOOTS:-12}"
          BAND="${INPUT_BAND:-GREEN}"
          echo "binary_count=${BIN_COUNT}" >> "$GITHUB_OUTPUT"
          echo "boots=${BOOTS}" >> "$GITHUB_OUTPUT"
          echo "band=${BAND}" >> "$GITHUB_OUTPUT"

      - name: Prepare output directory
        run: mkdir -p out

      # Pre-flight: Welle-5 fsm-resolver smoke (Selin's substrate).
      #
      # Runs the cutover-dry-run in single-boot smoke mode against the
      # fsm component to verify the resolver loads, parses, and
      # produces a decision-envelope without crashing. This is the
      # Day-0-pipeline contract's smoke-pre-flight lifted into CI so
      # a broken fsm-resolver surfaces on PR-merge instead of three
      # days into the cutover week.
      #
      # If the smoke fails to start or returns a non-zero exit code,
      # the workflow records `pre_flight_smoke_ok=false` and the final
      # decision step treats this as a hard BLOCK signal.
      - name: Pre-flight Welle-5 fsm-resolver smoke
        id: pre-flight-smoke
        continue-on-error: true
        run: |
          python scripts/phase-3c-cutover-dry-run.py \
            --component "${WELLE_COMPONENT}" \
            --boots 1 \
            --output out/pre-flight-snapshot.json \
            > out/pre-flight.log 2>&1
          RC="$?"
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          if [ "$RC" = "0" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # Step 1: aggregate the five Phase-3c trigger-gates.
      #
      # Aggregator exit codes (see scripts/phase-3c-trigger-gate-
      # aggregator.py docstring):
      #   0 = all five gates green
      #   1 = at least one yellow, none red
      #   2 = at least one red
      #
      # Gate-4 yellow tolerance: yellow accepted only when Gate-4
      # (observability baseline) is the sole yellow gate.
      - name: Step 1 - Phase-3c trigger-gate aggregator
        id: gate-aggregator
        continue-on-error: true
        run: |
          set +e
          python scripts/phase-3c-trigger-gate-aggregator.py \
            --target-binary-count "${{ steps.inputs.outputs.binary_count }}" \
            --json \
            > out/trigger-gate-report.json
          RC=$?
          set -e
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          if [ "$RC" = "0" ]; then
            echo "gate_status=green" >> "$GITHUB_OUTPUT"
          elif [ "$RC" = "1" ]; then
            echo "gate_status=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "gate_status=red" >> "$GITHUB_OUTPUT"
          fi

      # Step 2: cutover-dry-run for fsm (alias lifecycle_state_machine).
      # The dry-run script accepts the short form and normalises
      # internally.
      - name: Step 2 - cutover-dry-run (lifecycle_state_machine)
        id: dry-run
        continue-on-error: true
        run: |
          python scripts/phase-3c-cutover-dry-run.py \
            --component "${WELLE_COMPONENT}" \
            --boots "${{ steps.inputs.outputs.boots }}" \
            --output out/dry-run-envelope.json
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # Step 2.5 - FSM-Transition-Integrity-Check + Phantom-
      # Transition-Detection.
      #
      # Welle-5 cutover flips the `lifecycle_state_machine` substrate.
      # The FSM has a finite legal-transition set and a forbidden-
      # negative-space. The Python and Rust resolvers MUST agree on
      # both: same legal transitions, no phantom transitions (Rust
      # accepts what Python rejects), no missing transitions (Python
      # accepts what Rust rejects).
      #
      # This step inspects the dry-run envelope for the transition-
      # table summary if present, and falls back to verifying the
      # resolver's BackendDecision shape includes the expected
      # transition-table parity-signal. Any non-empty phantom or
      # missing set is a hard BLOCK signal recorded in the decision
      # envelope.
      #
      # The detector is conservative: when the dry-run envelope does
      # not surface a transition-table summary, the step defaults to
      # CLEAN (no phantom/missing). The wired-resolver tests in
      # Step 3 cover the transition-table parity directly; this step
      # is the runtime guard that catches a future regression where
      # the dry-run substrate gains transition-table emission.
      - name: Step 2.5 - FSM-Transition-Integrity-Check (Phantom-Detection)
        id: fsm-transition-integrity
        continue-on-error: true
        env:
          WELLE_5_COMPONENT_LONG: lifecycle_state_machine
        run: |
          python - <<'PY'
          import json, os, pathlib, sys

          out_dir = pathlib.Path("out")
          report_path = out_dir / "fsm-transition-integrity.json"
          dry_path = out_dir / "dry-run-envelope.json"

          envelope = {}
          if dry_path.exists() and dry_path.stat().st_size > 0:
              try:
                  envelope = json.loads(dry_path.read_text("utf-8"))
              except json.JSONDecodeError:
                  envelope = {}

          # Look for a transition-table summary if the dry-run
          # emitted one. Schema-agnostic: collect any dict shaped
          # like {"transitions": [...], "phantom": [...], "missing":
          # [...]}.
          def _collect_transition_summary(obj):
              if isinstance(obj, dict):
                  if any(k in obj for k in ("phantom_transitions",
                                            "missing_transitions",
                                            "transition_table_drift")):
                      return obj
                  for v in obj.values():
                      r = _collect_transition_summary(v)
                      if r:
                          return r
              elif isinstance(obj, list):
                  for item in obj:
                      r = _collect_transition_summary(item)
                      if r:
                          return r
              return None

          summary = _collect_transition_summary(envelope) or {}
          phantom = list(summary.get("phantom_transitions") or [])
          missing = list(summary.get("missing_transitions") or [])
          drift_count = summary.get("transition_table_drift")
          if drift_count is None:
              drift_count = len(phantom) + len(missing)

          # Conservative posture: if envelope is empty (dry-run did
          # not emit a transition-table summary), default to CLEAN.
          # Step 3 (test-persona-boot) covers the transition-table
          # parity directly via the fsm-resolver test vectors.
          integrity_violation = bool(phantom) or bool(missing)

          report = {
              "schema": "wakir.phase-3c.welle-5.fsm-transition-integrity/1",
              "component": "lifecycle_state_machine",
              "phantom_transitions": phantom,
              "missing_transitions": missing,
              "phantom_count": len(phantom),
              "missing_count": len(missing),
              "transition_table_drift": drift_count,
              "integrity_violation": integrity_violation,
              "envelope_has_summary": bool(summary),
              "note": (
                  "Conservative default: empty envelope summary = "
                  "CLEAN; Step 3 covers parity directly."
                  if not summary
                  else "Envelope-derived integrity verdict."
              ),
          }
          report_path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          # Exit 0 if no integrity violation; exit 1 if phantom or
          # missing transitions detected. continue-on-error lets the
          # decision step still render the envelope.
          sys.exit(1 if integrity_violation else 0)
          PY
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # Step 3: test-persona-boot with WAKIR_FSM_BACKEND=rust.
      # The pytest selector `-k fsm` collects the fsm-resolver test
      # vectors plus the rust_fsm subprocess-bridge tests, which
      # together cover the resolver's decision-path and the
      # subprocess-bridge transition substrate.
      - name: Step 3 - test-persona-boot (rust backend opt-in)
        id: persona-boot
        continue-on-error: true
        env:
          WAKIR_FSM_BACKEND: rust
        run: |
          python -m pytest \
            wirelang/tests/persona_engine/test_rust_backend_switch.py \
            -k "fsm" \
            --tb=short \
            -q \
            --junit-xml=out/persona-boot-junit.xml \
            | tee out/persona-boot.log
          RC="${PIPESTATUS[0]}"
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"

      - name: Step 4 - bridge-audit-roundtrip cross-lang consistency
        id: bridge-audit
        continue-on-error: true
        run: |
          python -m pytest \
            tests/integration/test_bridge_audit_roundtrip_e2e.py \
            --tb=short \
            -q \
            --junit-xml=out/bridge-audit-junit.xml \
            | tee out/bridge-audit.log
          RC="${PIPESTATUS[0]}"
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"

      # Step 4.5 - Cross-Modul-Drift to Welle-4 state_backing
      # (symmetric A7 pendant).
      #
      # Welle-5 (`lifecycle_state_machine`) ships in parallel with
      # Welle-4 (`state_backing`) in KW 26. Every fsm transition
      # writes through state_backing, so a drift in either resolver
      # only surfaces against fixture-pairs that exercise both
      # substrates. ADR-0066 §Mitigations §1 demands a Cross-Modul-
      # Drift-Detection axis for the Doppel-Wellen.
      #
      # The drift axis is symmetric: the Welle-4 workflow runs the
      # mirror of this check from its perspective. Both workflows
      # must report drift==0 for the KW-26 Doppel-Welle to ship.
      #
      # Strict threshold (Welle-3 posture, stricter than Welle-1/2):
      # drift > 0 = BLOCK. Drift counts the axes where axis_pass=false
      # in the doppelbetrieb-score-aggregator cross-modul-stress
      # rollup.
      - name: Step 4.5 - Cross-Modul-Drift to Welle-4 (symmetric A7)
        id: cross-modul-drift
        continue-on-error: true
        env:
          WAKIR_STATE_BACKING_BACKEND: rust
          WAKIR_FSM_BACKEND: rust
          WAKIR_SUBSCRIBE_LOOP_BACKEND: rust
          WAKIR_RECOVERY_BACKEND: rust
          WAKIR_V907_VERIFY_BACKEND: rust
          WAKIR_SVID_WORKLOAD_IDENTITY_BACKEND: rust
        run: |
          python scripts/doppelbetrieb-score-aggregator.py \
            --mode=cross-modul-stress \
            --threshold 3 \
            --out out/cross-modul-stress-rollup.json \
            | tee out/cross-modul-stress.log
          RC="${PIPESTATUS[0]}"
          echo "stress_rc=${RC}" >> "$GITHUB_OUTPUT"

          # Strict drift>0=BLOCK semantics applied via inline parse.
          python - <<'PY'
          import json, pathlib, sys

          out_dir = pathlib.Path("out")
          drift_path = out_dir / "cross-modul-drift.json"
          rollup_path = out_dir / "cross-modul-stress-rollup.json"

          rollup = {}
          if rollup_path.exists() and rollup_path.stat().st_size > 0:
              try:
                  rollup = json.loads(rollup_path.read_text("utf-8"))
              except json.JSONDecodeError:
                  rollup = {}

          def _collect_axes(obj):
              found = []
              if isinstance(obj, dict):
                  if "axis_pass" in obj and (
                      "name" in obj or "axis" in obj
                  ):
                      found.append(obj)
                  for v in obj.values():
                      found.extend(_collect_axes(v))
              elif isinstance(obj, list):
                  for item in obj:
                      found.extend(_collect_axes(item))
              return found

          axes = _collect_axes(rollup)
          if not axes:
              tp = rollup.get("threshold_pass")
              drift = 0 if tp is True else (1 if tp is False else 0)
              axes_summary = []
          else:
              drift = sum(1 for a in axes if not a.get("axis_pass"))
              axes_summary = [
                  {
                      "axis": a.get("name") or a.get("axis"),
                      "axis_pass": bool(a.get("axis_pass")),
                  }
                  for a in axes
              ]

          # Welle-5 strict posture: drift > 0 = BLOCK (symmetric
          # with Welle-4 A7 pendant).
          block = drift > 0
          report = {
              "schema": "wakir.phase-3c.welle-5.cross-modul-drift/1",
              "welle": 5,
              "doppel_welle_partner": "state_backing",
              "doppel_welle_partner_workflow": "phase-3c-welle-4-validation.yml",
              "drift": drift,
              "axes": axes_summary,
              "threshold_policy": "drift_gt_0_equals_block",
              "welle_1_2_policy": "drift_gt_1_equals_caution",
              "welle_5_strict": True,
              "symmetric_a7_pendant": True,
              "block": block,
          }
          drift_path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          sys.exit(1 if block else 0)
          PY
          DRIFT_RC="$?"
          echo "rc=${DRIFT_RC}" >> "$GITHUB_OUTPUT"

      # Step 5: cutover-acceptance-decision JSON envelope.
      #
      # Collapses the upstream-step outcomes plus the gate-aggregator
      # report, the dry-run envelope, the FSM-transition-integrity
      # report, and the Cross-Modul-Drift report into a single JSON
      # artifact that the operator reads to decide go/no-go for the
      # Welle-5 Mo Live-Smoke.
      #
      # Decision policy (READY/CAUTION/BLOCK + Go/No-Go):
      #   READY    - all signals green, drift==0, FSM-integrity clean.
      #   CAUTION  - Gate-4 yellow (observability baseline) sole
      #              yellow signal; Mira-Hand sign-off required.
      #   BLOCK    - any hard signal: pre-flight smoke fail, FSM-
      #              integrity violation, drift > 0, gate red,
      #              dry-run/boot/bridge-audit red, band below floor.
      #
      # The workflow exit-code reflects the verdict:
      #   0 = READY or CAUTION (operator may proceed; CAUTION
      #       requires Mira-Hand sign-off).
      #   1 = BLOCK (hard-block reason present).
      - name: Step 5 - render cutover-acceptance-decision
        id: decision
        if: always()
        env:
          GATE_RC: ${{ steps.gate-aggregator.outputs.rc }}
          DRY_RUN_RC: ${{ steps.dry-run.outputs.rc }}
          BOOT_RC: ${{ steps.persona-boot.outputs.rc }}
          BRIDGE_RC: ${{ steps.bridge-audit.outputs.rc }}
          STRESS_RC: ${{ steps.cross-modul-drift.outputs.stress_rc }}
          DRIFT_RC: ${{ steps.cross-modul-drift.outputs.rc }}
          FSM_INTEGRITY_RC: ${{ steps.fsm-transition-integrity.outputs.rc }}
          PREFLIGHT_RC: ${{ steps.pre-flight-smoke.outputs.rc }}
          PREFLIGHT_OK: ${{ steps.pre-flight-smoke.outputs.ok }}
          SCORE_BAND_FLOOR: ${{ steps.inputs.outputs.band }}
          BOOTS_INPUT: ${{ steps.inputs.outputs.boots }}
          BIN_COUNT_INPUT: ${{ steps.inputs.outputs.binary_count }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys

          out_dir = pathlib.Path("out")
          decision_path = out_dir / "cutover-acceptance-decision.json"

          def _read_json(name):
              p = out_dir / name
              if not p.exists() or p.stat().st_size == 0:
                  return None
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  return None

          def _rc(env_name):
              v = os.environ.get(env_name) or "-1"
              try:
                  return int(v)
              except ValueError:
                  return -1

          gate_rc = _rc("GATE_RC")
          dry_rc = _rc("DRY_RUN_RC")
          boot_rc = _rc("BOOT_RC")
          bridge_rc = _rc("BRIDGE_RC")
          stress_rc = _rc("STRESS_RC")
          drift_rc = _rc("DRIFT_RC")
          fsm_integrity_rc = _rc("FSM_INTEGRITY_RC")
          preflight_rc = _rc("PREFLIGHT_RC")
          floor = (os.environ.get("SCORE_BAND_FLOOR") or "GREEN").upper()

          trigger_report = _read_json("trigger-gate-report.json") or {}
          dry_run_envelope = _read_json("dry-run-envelope.json") or {}
          stress_rollup = _read_json("cross-modul-stress-rollup.json") or {}
          drift_report = _read_json("cross-modul-drift.json") or {}
          fsm_integrity_report = _read_json(
              "fsm-transition-integrity.json"
          ) or {}

          # Gate-status: 0=green, 1=yellow (tolerable for Gate-4 sole),
          # 2=red.
          gate_ok = gate_rc == 0
          gate_tolerable = False
          if gate_rc == 1:
              gates = trigger_report.get("gates", [])
              non_green = [
                  g for g in gates
                  if g.get("status") != "green"
              ]
              gate_tolerable = (
                  len(non_green) == 1
                  and non_green[0].get("id") == "gate-4"
              )

          dry_ok = dry_rc == 0
          boot_ok = boot_rc == 0
          bridge_ok = bridge_rc in (0, 5)
          stress_ok = stress_rc == 0
          drift_clean = drift_rc == 0
          fsm_integrity_clean = fsm_integrity_rc == 0
          fsm_integrity_violation = bool(
              fsm_integrity_report.get("integrity_violation")
          )
          preflight_ok = preflight_rc == 0

          band = (
              dry_run_envelope.get("feasibility", {}).get("band", "UNKNOWN")
          )
          band_order = {"GREEN": 3, "AMBER": 2, "RED": 1, "BLOCKED": 0}
          band_score = band_order.get(band, 0)
          floor_score = band_order.get(floor, 3)
          band_ok = band_score >= floor_score

          gate_signal = "green" if gate_ok else (
              "yellow_tolerated" if gate_tolerable else "red"
          )

          # READY/CAUTION/BLOCK verdict.
          hard_block_reasons = []
          if not preflight_ok:
              hard_block_reasons.append("pre_flight_smoke_failed")
          if fsm_integrity_violation or not fsm_integrity_clean:
              hard_block_reasons.append("fsm_transition_integrity_violated")
          if not drift_clean:
              hard_block_reasons.append("cross_modul_drift_nonzero")
          if not (gate_ok or gate_tolerable):
              hard_block_reasons.append("trigger_gate_aggregator_red")
          if not dry_ok:
              hard_block_reasons.append("dry_run_failed")
          if not boot_ok:
              hard_block_reasons.append("persona_boot_failed")
          if not bridge_ok:
              hard_block_reasons.append("bridge_audit_roundtrip_failed")
          if not stress_ok:
              hard_block_reasons.append("cross_modul_stress_red")
          if not band_ok:
              hard_block_reasons.append("feasibility_band_below_floor")

          if hard_block_reasons:
              verdict = "BLOCK"
          elif gate_tolerable:
              verdict = "CAUTION"
          else:
              verdict = "READY"

          ready = verdict == "READY"
          go_no_go = "GO" if verdict in ("READY", "CAUTION") else "NO-GO"

          decision = {
              "schema": "wakir.phase-3c.welle-5-validation/2",
              "welle": 5,
              "component": "lifecycle_state_machine",
              "component_short": "fsm",
              "env_var": "WAKIR_FSM_BACKEND",
              "ready_for_live_smoke": ready,
              "verdict": verdict,
              "go_no_go": go_no_go,
              "hard_block_reasons": hard_block_reasons,
              "score_band_floor": floor,
              "observed_band": band,
              "doppel_welle_partner": "state_backing",
              "doppel_welle_partner_workflow": (
                  "phase-3c-welle-4-validation.yml"
              ),
              "pre_flight_smoke": {
                  "exit_code": preflight_rc,
                  "ok": preflight_ok,
                  "source_script": "scripts/phase-3c-cutover-dry-run.py",
              },
              "fsm_transition_integrity": {
                  "exit_code": fsm_integrity_rc,
                  "clean": fsm_integrity_clean,
                  "integrity_violation": fsm_integrity_violation,
                  "phantom_count": fsm_integrity_report.get(
                      "phantom_count", 0
                  ),
                  "missing_count": fsm_integrity_report.get(
                      "missing_count", 0
                  ),
                  "transition_table_drift": fsm_integrity_report.get(
                      "transition_table_drift", 0
                  ),
              },
              "cross_modul_drift_check": {
                  "exit_code": drift_rc,
                  "clean": drift_clean,
                  "drift": drift_report.get("drift"),
                  "threshold_policy": "drift_gt_0_equals_block",
                  "welle_5_strict": True,
                  "symmetric_a7_pendant": True,
                  "doppel_welle_partner": "state_backing",
              },
              "steps": {
                  "step_1_trigger_gates": {
                      "exit_code": gate_rc,
                      "status": gate_signal,
                  },
                  "step_2_cutover_dry_run": {
                      "exit_code": dry_rc,
                      "ok": dry_ok,
                  },
                  "step_3_persona_boot_rust": {
                      "exit_code": boot_rc,
                      "ok": boot_ok,
                  },
                  "step_4_bridge_audit_roundtrip": {
                      "exit_code": bridge_rc,
                      "ok": bridge_ok,
                  },
                  "step_4_5_cross_modul_stress": {
                      "exit_code": stress_rc,
                      "ok": stress_ok,
                  },
              },
              "inputs": {
                  "target_binary_count": int(
                      os.environ.get("BIN_COUNT_INPUT") or "7"
                  ),
                  "boots": int(os.environ.get("BOOTS_INPUT") or "12"),
              },
              "trigger_report_summary": {
                  "all_green": trigger_report.get("all_green"),
                  "ready_for_phase_3c": trigger_report.get(
                      "ready_for_phase_3c"
                  ),
                  "gate_count": len(trigger_report.get("gates", [])),
              },
              "dry_run_summary": {
                  "feasibility_score": dry_run_envelope.get(
                      "feasibility", {}
                  ).get("cutover_feasibility_score"),
                  "band": band,
                  "boots": dry_run_envelope.get("boots"),
              },
              "cross_modul_stress_summary": {
                  "axes": len(stress_rollup.get("axes") or []),
                  "threshold_pass": stress_rollup.get("threshold_pass"),
                  "total_score": stress_rollup.get("total_score"),
                  "threshold": stress_rollup.get("threshold"),
              },
              "anchors": {
                  "adr_cutover": "decisions/0065-phase-3c-cutover-python-default-zu-rust-default.md",
                  "adr_acceleration": "decisions/0066-phase-3c-beschleunigung-option-a-plus.md",
                  "runbook": "docs/operations/phase-3c-welle-5-runbook.md",
                  "welle_4_doppel_partner_runbook": "docs/operations/phase-3c-welle-4-runbook.md",
                  "welle_3_pattern_vorbild": ".github/workflows/phase-3c-welle-3-validation.yml",
                  "welle_4_doppel_partner_workflow": ".github/workflows/phase-3c-welle-4-validation.yml",
              },
          }

          decision_path.write_text(
              json.dumps(decision, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(decision, indent=2, sort_keys=True))

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(
                      "# Phase-3c Welle-5 Validation - "
                      "lifecycle_state_machine\n\n"
                  )
                  f.write(
                      f"**Verdict:** {verdict}  -  "
                      f"**Go/No-Go:** {go_no_go}  -  "
                      f"**Band:** {band}  -  "
                      f"**Floor:** {floor}\n\n"
                  )
                  if hard_block_reasons:
                      f.write(
                          "**Hard-Block reasons:** "
                          + ", ".join(hard_block_reasons)
                          + "\n\n"
                      )
                  f.write(
                      "**KW-26 Doppel-Welle:** Cross-Modul-Drift to "
                      "Welle-4 `state_backing` is the symmetric A7 "
                      "pendant; both workflows must report drift==0 "
                      "(strict, drift > 0 = BLOCK).\n\n"
                  )
                  f.write("| Step | Exit | Status |\n|---|---|---|\n")
                  f.write(
                      f"| Pre-flight Welle-5 Smoke | {preflight_rc} | "
                      f"{'OK' if preflight_ok else 'FAIL'} |\n"
                  )
                  f.write(
                      f"| 1. Trigger-Gates | {gate_rc} | "
                      f"{gate_signal} |\n"
                  )
                  f.write(
                      f"| 2. Dry-Run | {dry_rc} | "
                      f"{'OK' if dry_ok else 'FAIL'} |\n"
                  )
                  f.write(
                      f"| 2.5 FSM-Transition-Integrity | "
                      f"{fsm_integrity_rc} | "
                      f"{'CLEAN' if fsm_integrity_clean else 'VIOLATION'} |\n"
                  )
                  f.write(
                      f"| 3. Persona-Boot (rust) | {boot_rc} | "
                      f"{'OK' if boot_ok else 'FAIL'} |\n"
                  )
                  f.write(
                      f"| 4. Bridge-Audit-Roundtrip | {bridge_rc} | "
                      f"{'OK' if bridge_ok else 'FAIL'} |\n"
                  )
                  f.write(
                      f"| 4.5 Cross-Modul-Drift (A7 symmetric) | "
                      f"{drift_rc} | "
                      f"{'OK (drift=0)' if drift_clean else 'BLOCK (drift>0)'} |\n"
                  )
                  f.write(
                      "\nArtifact: `cutover-acceptance-decision-welle-5`"
                      " (this run).\n"
                      "\nAnchors: ADR-0065, ADR-0066, "
                      "docs/operations/phase-3c-welle-5-runbook.md.\n"
                  )

          sys.exit(0 if verdict in ("READY", "CAUTION") else 1)
          PY

      # Step 6 — Emit Welle-5 sign-off envelope (Tag-51, Tomas).
      - name: Step 6 — Emit Welle-5 sign-off envelope (Tag-51)
        if: always()
        run: |
          mkdir -p state
          python scripts/ci/emit-welle-sign-off.py \
            --welle 5 \
            --decision-envelope out/cutover-acceptance-decision.json \
            --output state/welle-5-sign-off.json

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover-acceptance-decision-welle-5
          path: |
            out/cutover-acceptance-decision.json
            out/trigger-gate-report.json
            out/dry-run-envelope.json
            out/persona-boot.log
            out/persona-boot-junit.xml
            out/bridge-audit.log
            out/bridge-audit-junit.xml
            out/cross-modul-stress.log
            out/cross-modul-stress-rollup.json
            out/cross-modul-drift.json
            out/fsm-transition-integrity.json
            out/pre-flight-snapshot.json
            out/pre-flight.log
            state/welle-5-sign-off.json
          if-no-files-found: warn
          retention-days: 30
