# SPDX-License-Identifier: Apache-2.0
#
# Cosign + digest-resolver pre-build verification of the SPIRE-Federation
# image pins.
#
# Posture (corrected 2026-09-21 — the paragraph this replaces
# described a workflow_dispatch-only posture that PR #503 ended):
#   All three jobs run on `workflow_dispatch`, on `push` to main and
#   on every `pull_request`, with no path filter. The no-path-filter
#   part is deliberate and load-bearing: `cosign verify SPIRE images`
#   is a required status context, and a required context that does
#   not report on every pull request leaves the PR forever-pending
#   (feedback_branch_protection_check_names.md).
#
#   Only that first job is required. `digest-verify python:3.13-slim`
#   and `cosign verify wakir-provisioner` rode onto the PR surface
#   with #503 without a decision of their own.
#
# The trigger cut (Zone-C cross-review, Tomas Reinhart 2026-09-21)
#   The line is NOT "does this ask something live?" — job 1 asks
#   something live too, and it stays. The line is "does this follow a
#   third party's calendar?":
#
#     * `digest-verify python:3.13-slim` — DockerHub rebuilds
#       `python:3.13-slim` on its own schedule. An unrelated pull
#       request can neither cause that nor fix it. It runs on
#       `schedule` from 2026-09-21 (`if: github.event_name !=
#       'pull_request'`), and the structural half of what it used to
#       cover — that all pin sites carry the same digest — lives in
#       the required, hermetic job
#       `verify-containerfile-base-image-digest-pins` since #546. No
#       coverage is lost.
#     * `cosign verify wakir-provisioner` — STAYS on the pull-request
#       surface. Cross-review for moving it was REFUSED: this is our
#       image, in our registry, built by our workflow, pinned in our
#       Quadlet. Nothing in it follows anyone else's calendar, so it
#       fails the very test that moves job 2. Its pin is currently
#       dangling (the pinned digest 404s) and that red is true; being
#       red is not an argument for belonging somewhere else, or every
#       finding would justify its own invisibility. The fix is the
#       provisioner rebuild + pin refresh, not a trigger change.
#
#   What the cut does NOT do: it does not take liveness off the
#   pull-request surface. Job 1 is itself a live network check —
#   `cosign verify` against Sigstore plus a `crane digest` cross-check
#   with `exit 2` on drift — and it is the only one of the three that
#   can block anything. The cut removes the two liveness exposures
#   that block nothing and leaves the one that blocks everything.
#   Tracked separately, not in this file.
#
#   The scheduled surface only became a place where a failure is
#   noticed on 2026-09-21: `.github/actions/report-scheduled-failure`
#   (runbook: docs/operations/scheduled-workflow-failure-receiver.md)
#   is wired in below. Before it, moving a check to `schedule` did not
#   make it loud, it made it unobserved.
#
# Why a workflow at all if it's manual-only:
#   * Reproducibility — the resolution recipe in
#     infra/spire/federation/IMAGE_PINS.md is documented but ad-hoc;
#     running it in GitHub Actions gives a logged, archived,
#     git-rev-pinned attestation of who-ran-it-when.
#   * Drift detection — an operator running this on a schedule (once
#     the Zone-C policy approves the egress) catches an upstream
#     re-push of a "stable" tag within hours, not days.
#   * Eventual-PR-gate — when Zone-C approves the GHCR-network
#     access, the trigger surface flips to `pull_request` with a path
#     filter on the federation pin files, and CI refuses merges that
#     reference a digest that does not match the live cosign verdict.
#
# Sandbox boundary:
#   This workflow ONLY runs on GitHub-Actions runners, which are
#   host-of-record (not the claude-dev sandbox). No part of this job
#   is reachable from the sandbox per
#   feedback_sandbox_host_trennung.md.

name: cosign-verify-images

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Verbose cosign output (true/false)'
        required: false
        default: 'false'
  # PR gate per docs/operations/cosign-strict-mode-activation.md §S1.
  # No path filter: the job `cosign verify SPIRE images` is a required
  # status context and must report on every pull request
  # (docs/ci/branch-protection-required-checks.md, trigger discipline).
  # The other two jobs inherit this trigger surface without a decision
  # of their own — see the Posture note above.
  push:
    branches:
      - main
  pull_request:
  # Calendar axis for the job that follows someone else's calendar.
  # 05:15 UTC keeps it clear of the 06:30 drift probe and the 07:30
  # readiness check, so an operator reading the Actions tab sees three
  # distinct blocks. This is an ADDITIONAL axis: jobs 1 and 3 keep
  # reporting on every pull request exactly as before.
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Job 1: SPIRE-Server + SPIRE-Agent — GHCR + Sigstore cosign verify.
  # ------------------------------------------------------------------
  cosign-verify-spire:
    name: cosign verify SPIRE images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install crane (digest cross-resolver)
        run: |
          set -euo pipefail
          CRANE_VERSION="0.20.2"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o /tmp/crane.tar.gz
          tar -C /tmp -xzf /tmp/crane.tar.gz crane
          sudo install -m 0755 /tmp/crane /usr/local/bin/crane
          crane version

      - name: Extract pinned tag + digest from compose files
        id: pins
        run: |
          set -euo pipefail
          SERVER_PIN=$(grep -oE 'ghcr\.io/spiffe/spire-server:[^@ "]+@sha256:[^ "]+' \
              infra/spire/federation/compose/spire-federation.yaml | head -n1)
          AGENT_PIN=$(grep -oE 'ghcr\.io/spiffe/spire-agent:[^@ "]+@sha256:[^ "]+' \
              infra/spire/agent/compose/spire-agent-federation.yaml | head -n1)

          if [[ -z "$SERVER_PIN" || -z "$AGENT_PIN" ]]; then
            echo "::error::failed to extract pinned image references"
            exit 1
          fi

          # Split TAG@DIGEST.
          SERVER_TAG=$(echo "$SERVER_PIN" | sed -E 's|.*spire-server:([^@]+)@.*|\1|')
          SERVER_DIGEST=$(echo "$SERVER_PIN" | sed -E 's|.*@(sha256:[a-f0-9]+).*|\1|')
          AGENT_TAG=$(echo "$AGENT_PIN" | sed -E 's|.*spire-agent:([^@]+)@.*|\1|')
          AGENT_DIGEST=$(echo "$AGENT_PIN" | sed -E 's|.*@(sha256:[a-f0-9]+).*|\1|')

          echo "server_tag=${SERVER_TAG}"       >> "$GITHUB_OUTPUT"
          echo "server_digest=${SERVER_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "agent_tag=${AGENT_TAG}"         >> "$GITHUB_OUTPUT"
          echo "agent_digest=${AGENT_DIGEST}"   >> "$GITHUB_OUTPUT"

          echo "Pinned server: ghcr.io/spiffe/spire-server:${SERVER_TAG}@${SERVER_DIGEST}"
          echo "Pinned agent:  ghcr.io/spiffe/spire-agent:${AGENT_TAG}@${AGENT_DIGEST}"

      - name: Halt if placeholder digests are still present
        run: |
          set -euo pipefail
          if [[ "${{ steps.pins.outputs.server_digest }}" == "sha256:DIGEST_PENDING_TOMAS_REVIEW" || \
                "${{ steps.pins.outputs.agent_digest }}" == "sha256:DIGEST_PENDING_TOMAS_REVIEW" ]]; then
            echo "::error::pins still carry the DIGEST_PENDING_TOMAS_REVIEW placeholder — Operator-Hand resolution has not been applied yet."
            exit 1
          fi

      - name: Cosign-verify spire-server
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp 'https://github\.com/spiffe/spire/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            ghcr.io/spiffe/spire-server:${{ steps.pins.outputs.server_tag }}@${{ steps.pins.outputs.server_digest }}

      - name: Cosign-verify spire-agent
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp 'https://github\.com/spiffe/spire/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            ghcr.io/spiffe/spire-agent:${{ steps.pins.outputs.agent_tag }}@${{ steps.pins.outputs.agent_digest }}

      - name: Cross-check digests via crane
        run: |
          set -euo pipefail
          CRANE_SERVER=$(crane digest ghcr.io/spiffe/spire-server:${{ steps.pins.outputs.server_tag }})
          CRANE_AGENT=$(crane digest ghcr.io/spiffe/spire-agent:${{ steps.pins.outputs.agent_tag }})

          echo "crane server: $CRANE_SERVER"
          echo "pinned server: ${{ steps.pins.outputs.server_digest }}"
          echo "crane agent:  $CRANE_AGENT"
          echo "pinned agent:  ${{ steps.pins.outputs.agent_digest }}"

          if [[ "$CRANE_SERVER" != "${{ steps.pins.outputs.server_digest }}" ]]; then
            echo "::error::server digest drift detected — possible upstream re-push"
            exit 2
          fi
          if [[ "$CRANE_AGENT" != "${{ steps.pins.outputs.agent_digest }}" ]]; then
            echo "::error::agent digest drift detected — possible upstream re-push"
            exit 2
          fi
          echo "OK: pinned digests match the live registry digests"

  # ------------------------------------------------------------------
  # Job 2: python:3.13-slim — DockerHub, no Sigstore. crane + skopeo
  #        cross-check only.
  # ------------------------------------------------------------------
  cosign-verify-python:
    name: digest-verify python:3.13-slim
    # The one line of the trigger cut. `python:3.13-slim` is rebuilt by
    # DockerHub on DockerHub's schedule; a pull request can neither
    # cause that drift nor fix it. Skipped rather than removed, so the
    # job name stays visible (grey) on the PR instead of silently
    # disappearing, which reads like a deleted check.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install crane
        run: |
          set -euo pipefail
          CRANE_VERSION="0.20.2"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o /tmp/crane.tar.gz
          tar -C /tmp -xzf /tmp/crane.tar.gz crane
          sudo install -m 0755 /tmp/crane /usr/local/bin/crane
          crane version

      - name: Install skopeo
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo jq
          skopeo --version

      - name: Extract pinned tag + digest from every python pin site
        id: pin
        run: |
          set -euo pipefail
          # Until 2026-09-21 this step read ONE file and, of that file,
          # the first match:
          #
          #   grep -oE '...' infra/spire/federation/provisioner/Containerfile \
          #     | head -n1
          #
          # The python base layer is pinned in THREE files. A change that
          # refreshed the provisioner Containerfile alone turned this job
          # GREEN while two files stayed on the old digest — a green
          # verdict about pins the job never read.
          #
          # The site list now comes from
          # tooling/ci/verify_image_pin_consistency.py, the same module
          # the required hermetic gate uses, so the live check and the
          # structural check cannot disagree about WHERE the pins are.
          python3 tooling/ci/verify_image_pin_consistency.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --report pin-consistency.json
          python3 - <<'EOF' | tee -a "$GITHUB_OUTPUT"
          import json, os, sys

          report = json.load(open("pin-consistency.json"))
          groups = [
              g for g in report["groups"]
              if g["image"] == "python" and g["tag"] == "3.13-slim"
          ]
          if not groups:
              print("::error::no python:3.13-slim pin found anywhere in the tree", file=sys.stderr)
              raise SystemExit(1)
          group = groups[0]
          for site in group["sites"]:
              print(f"site {site['path']}:{site['line_no']} -> sha256:{site['digest']}", file=sys.stderr)
          if group["placeholder_tokens"]:
              print(f"::error::python pin still carries placeholder(s): {group['placeholder_tokens']}", file=sys.stderr)
              raise SystemExit(1)
          if len(group["digests"]) != 1:
              print(f"::error::python pin sites disagree with each other: {group['digests']}", file=sys.stderr)
              raise SystemExit(1)
          print(f"site_count={len(group['sites'])}")
          print("tag=3.13-slim")
          print(f"digest={group['digests'][0]}")
          EOF
          echo "Pinned python:3.13-slim across all sites (see step log)"

      - name: Halt if fewer pin sites than expected were read
        run: |
          set -euo pipefail
          # A coverage regression is silent by nature: narrowing the scan
          # back to one file would make this job green again. The count is
          # asserted so the narrowing has to be stated.
          # Placeholder rejection and cross-site agreement are enforced in
          # the extraction step above.
          if [[ "${{ steps.pin.outputs.site_count }}" -lt 3 ]]; then
            echo "::error::expected at least 3 python:3.13-slim pin sites, read ${{ steps.pin.outputs.site_count }}"
            exit 1
          fi
          echo "OK: ${{ steps.pin.outputs.site_count }} pin site(s) read, all in agreement"

      - name: skopeo inspect (manifest-list)
        id: skopeo
        run: |
          set -euo pipefail
          SKOPEO_DIGEST=$(skopeo inspect docker://python:${{ steps.pin.outputs.tag }} | jq -r '.Digest')
          echo "skopeo_digest=${SKOPEO_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "skopeo: $SKOPEO_DIGEST"

      - name: crane digest cross-check
        id: crane
        run: |
          set -euo pipefail
          CRANE_DIGEST=$(crane digest python:${{ steps.pin.outputs.tag }})
          echo "crane_digest=${CRANE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "crane: $CRANE_DIGEST"

      - name: Refuse merge on digest drift
        run: |
          set -euo pipefail
          if [[ "${{ steps.skopeo.outputs.skopeo_digest }}" != "${{ steps.crane.outputs.crane_digest }}" ]]; then
            echo "::error::skopeo vs crane disagree — registry inconsistency, halt"
            exit 2
          fi
          if [[ "${{ steps.skopeo.outputs.skopeo_digest }}" != "${{ steps.pin.outputs.digest }}" ]]; then
            echo "::error::pinned python digest != live digest — possible upstream re-push"
            echo "::error::pinned=${{ steps.pin.outputs.digest }}"
            echo "::error::live  =${{ steps.skopeo.outputs.skopeo_digest }}"
            exit 2
          fi
          echo "OK: pinned digest matches live registry digest (skopeo + crane)"

  # ------------------------------------------------------------------
  # Job 3: ghcr.io/wakir-labs/wakir-provisioner — GHCR + Sigstore
  #        keyless cosign verify against the build workflow's OIDC
  #        identity.
  # ------------------------------------------------------------------
  cosign-verify-wakir-provisioner:
    name: cosign verify wakir-provisioner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install crane (digest cross-resolver)
        run: |
          set -euo pipefail
          CRANE_VERSION="0.20.2"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o /tmp/crane.tar.gz
          tar -C /tmp -xzf /tmp/crane.tar.gz crane
          sudo install -m 0755 /tmp/crane /usr/local/bin/crane
          crane version

      - name: Extract pinned tag + digest from quadlet
        id: pin
        run: |
          set -euo pipefail
          PIN=$(grep -oE 'ghcr\.io/wakir-labs/wakir-provisioner:[^@ "]+@sha256:[^ "]+' \
              quadlet/wakir-nats-kv-bucket-init.container | head -n1)
          if [[ -z "$PIN" ]]; then
            echo "::error::failed to extract wakir-provisioner image pin from quadlet"
            exit 1
          fi
          TAG=$(echo "$PIN" | sed -E 's|.*wakir-provisioner:([^@]+)@.*|\1|')
          DIGEST=$(echo "$PIN" | sed -E 's|.*@(sha256:[a-f0-9]+).*|\1|')
          echo "tag=${TAG}"       >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pinned: ghcr.io/wakir-labs/wakir-provisioner:${TAG}@${DIGEST}"

      - name: Halt if placeholder digest is still present
        run: |
          set -euo pipefail
          if [[ "${{ steps.pin.outputs.digest }}" == "sha256:DIGEST_PENDING_TOMAS_REVIEW" ]]; then
            echo "::error::wakir-provisioner pin still carries DIGEST_PENDING_TOMAS_REVIEW placeholder"
            exit 1
          fi

      - name: Refuse a dangling pin (the manifest must exist)
        run: |
          set -euo pipefail
          # Measured 2026-09-21: the pinned digest
          # sha256:9af7ee68... returned MANIFEST_UNKNOWN from ghcr.io
          # (anonymous AND authenticated), while the tag 0.1.2 resolved
          # to a different, unsigned manifest. The tag had been
          # re-pushed; the old manifest was gone and only its orphaned
          # `sha256-...sig` tag remained.
          #
          # `cosign verify` was GREEN across all of that, because it
          # checks the signature stored under the `.sig` tag derived
          # from the digest — it does not need the image manifest to
          # exist. A signature over an image that is no longer in the
          # registry is not a supply-chain guarantee; it is a receipt
          # for something that has been thrown away, and the Quadlet
          # that carries this pin cannot pull.
          #
          # So existence is checked separately, and it is fatal. Unlike
          # a base-image tag rebuild, this is not a third party's
          # release calendar: the remedy is entirely ours (rebuild and
          # re-sign the tag, or re-pin to a signed digest that exists).
          REF="ghcr.io/wakir-labs/wakir-provisioner@${{ steps.pin.outputs.digest }}"
          if ! crane manifest "${REF}" > /dev/null 2>&1; then
            echo "::error::dangling image pin — ${REF} does not resolve in the registry"
            echo "::error::the tag ${{ steps.pin.outputs.tag }} currently resolves to $(crane digest ghcr.io/wakir-labs/wakir-provisioner:${{ steps.pin.outputs.tag }} 2>/dev/null || echo '<unresolvable>')"
            echo "::error::remedy: re-run build-wakir-provisioner.yml with push=true (rebuild + Sigstore-sign), then refresh the pin; or re-pin to an existing signed digest"
            exit 2
          fi
          echo "OK: pinned manifest exists in the registry"

      - name: Cosign-verify (Sigstore keyless OIDC)
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp 'https://github\.com/wakir-labs/wakir-runtime/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            ghcr.io/wakir-labs/wakir-provisioner:${{ steps.pin.outputs.tag }}@${{ steps.pin.outputs.digest }}

      - name: Cross-check digest (advisory — Cosign-Verify is the gate)
        run: |
          set -euo pipefail
          # Corrected 2026-09-21. This comment used to claim that a
          # mismatch between the pinned digest and `crane digest TAG`
          # was expected, because ghcr.io supposedly wraps the signed
          # image in a signature manifest with its own digest. That
          # explanation is wrong: cosign stores the signature under a
          # separate `sha256-<digest>.sig` TAG and does not change the
          # digest the image tag resolves to.
          #
          # The wrong explanation was load-bearing. It turned the one
          # step that noticed the mismatch into a `::notice::`, and the
          # mismatch it explained away was real: the tag had been
          # re-pushed and the pinned manifest was gone. An explanation
          # that makes a true signal look expected is more expensive
          # than no check at all.
          #
          # Existence is now enforced in the step above. What is left
          # here is genuinely advisory: the pin may legitimately name a
          # digest that the tag no longer points at, because the pin is
          # the contract and the tag is mutable. A mismatch means the
          # tag moved — worth seeing, not worth failing a build over,
          # since the pinned manifest has already been proven to exist
          # and to be signed.
          CRANE_INDEX=$(crane digest ghcr.io/wakir-labs/wakir-provisioner:${{ steps.pin.outputs.tag }})
          CRANE_PLATFORM=$(crane digest --platform linux/amd64 \
              ghcr.io/wakir-labs/wakir-provisioner:${{ steps.pin.outputs.tag }})
          echo "pinned (cosign-signed): ${{ steps.pin.outputs.digest }}"
          echo "crane (registry-index): $CRANE_INDEX"
          echo "crane (--platform linux/amd64): $CRANE_PLATFORM"
          if [[ "$CRANE_PLATFORM" == "${{ steps.pin.outputs.digest }}" ]] || \
             [[ "$CRANE_INDEX" == "${{ steps.pin.outputs.digest }}" ]]; then
            echo "OK: pinned wakir-provisioner digest matches a registry-side digest"
          else
            echo "::notice::pinned digest does not match either registry digest — Sigstore wrapper layer expected; Cosign-Verify (above) is the authoritative gate"
          fi

  # ------------------------------------------------------------------
  # Receiver for the non-PR surface.
  #
  # Job 2 now runs on `schedule`, and a scheduled failure had no reader
  # in this repository until 2026-09-21 (measured: 40 workflow files, 0
  # executable notification steps). Moving a check to a calendar
  # without a receiver does not make it loud, it makes it invisible —
  # so the receiver is part of the same change, not a follow-up.
  #
  # It watches all three jobs, not only job 2: a failure of job 1 or 3
  # on `push: main` had no reader either. `issues: write` is scoped to
  # this job; the three verify jobs keep `contents: read`.
  #
  # Expected on the first push to main after this lands: `cosign verify
  # wakir-provisioner` is red for a true reason (its pinned digest 404s
  # in ghcr) and will open exactly one receiver issue. That is the
  # intended behaviour, not a regression — the receiver closes it by
  # itself once the provisioner rebuild + pin refresh lands.
  # ------------------------------------------------------------------
  scheduled-failure-receiver:
    name: Scheduled-failure receiver
    needs:
      - cosign-verify-spire
      - cosign-verify-python
      - cosign-verify-wakir-provisioner
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout (the receiver action is a local composite action)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Open or update the receiver issue
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: ./.github/actions/report-scheduled-failure
        with:
          mode: fail
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Close the receiver issue on recovery
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        uses: ./.github/actions/report-scheduled-failure
        with:
          mode: resolve
          github-token: ${{ secrets.GITHUB_TOKEN }}
