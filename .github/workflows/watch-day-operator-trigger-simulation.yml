# SPDX-License-Identifier: Apache-2.0
#
# Tag-62 Watch-Day-Practice-Run Operator-Trigger-Pipeline / Noa-SRE
# ---------------------------------------------------------------------------
#
# Pre-KW-24-Real-Run simulation of the operator (Mira-Hand) trigger-
# sequence on Cutover-Day T0 (Tue 2026-06-09). The pipeline pins the
# operator-runbook ceremony around the Tag-56 Watch-Day-Practice-Run
# CI gate (`.github/workflows/phase-3c-watch-day-practice-run.yml`).
#
# Context (Marathon-Continuous-Mode Pre-Sealing)
# ----------------------------------------------
#
#   Tag-54 (PR #347)  spec + verdict module
#   Tag-55 (PR #353)  practice-run simulator
#   Tag-56 (PR #359)  CI-gate workflow + scheduled cron 0 5 * * 2
#   Tag-57 (PR #368)  cron-pre-fire-probe (cron + path + routing)
#   Tag-59 (PR #377)  replay workflow (verdict-formula stability)
#   Tag-61 (PR #390)  multi-sample fixture matrix (green/caution/red)
#   Tag-62 (this)     operator-trigger-pipeline (this workflow)
#
# The Tag-56..61 substrates pin individual contracts: verdict-
# formula, cron-pin, path-filter, routing-table, replay-stability,
# multi-class fixture coverage. **None** of them pin the operator
# ceremony itself: open the workflow in the GitHub UI, click
# Run-workflow, supply `diagnostic=true`, wait for the verdict
# envelope upload. If any step of that ceremony silently regresses
# (workflow renamed, default ref changed, diagnostic input renamed,
# envelope schema bumped), the existing gates do **not** catch it
# until KW-24 morning at 05:00 UTC.
#
# Tag-62 closes that gap with four stages:
#
#   Stage 1 - Pre-Trigger Health-Check
#       Three subordinate probes:
#         * cron-pin INTACT (Tag-57 contract re-asserted at boot)
#         * alert-routing OK (Page + Ticket anchors still named in
#           the Tag-54 spec)
#         * replay-fixtures INTACT (Tag-61 three-class fixture
#           bundle still committed)
#       Aggregated to green/yellow/red.
#
#   Stage 2 - Simulate Operator-Trigger
#       Synthesize a workflow_dispatch event-shape envelope:
#         { event: "workflow_dispatch",
#           workflow: "phase-3c-watch-day-practice-run.yml",
#           ref: "refs/heads/main",
#           inputs: { "diagnostic": "true" },
#           actor: "mira-kessler" }
#       Validate envelope shape and pinned values. **No GH-API
#       call** -- this is a hermetic synthesis.
#
#   Stage 3 - Post-Trigger Verification
#       Load the Tag-61 GREEN fixture (proxy for what the Tag-56
#       workflow would emit on a real green Tuesday), derive the
#       Tag-56-step-5 envelope shape from it, and pin:
#         * envelope keys = {schema_version, tag, tool, verdict, stages}
#         * envelope.tag = 56
#         * envelope.verdict = "READY"
#         * stages dict non-empty
#       Verdict-drift is red (operator must not proceed); schema
#       drift is yellow.
#
#   Stage 4 - Aggregate Verdict
#       OPERATOR-TRIGGER-READY  -- all three stages green
#       TRIGGER-CAUTION         -- exactly one stage yellow, rest green
#       TRIGGER-BLOCKED         -- any stage red, or 2+ stages yellow
#
# Trigger surface
# ---------------
#
#   * workflow_dispatch: -- operator-hand manual run.
#   * pull_request: (path-filtered) -- any PR touching the Tag-62
#     substrate or the substrates the simulator depends on.
#
# Notably **no** push: trigger and **no** schedule: trigger.
# Tag-62 is review-time + on-demand, not a calendar re-pin. The
# Tag-56 / Tag-57 / Tag-59 workflows are the calendar-pinned twins.
#
# Sandbox boundary
# ----------------
#
# Hermetic: stdlib + python 3.11. No podman, no NATS, no
# AlertManager, no Mira-Notify emit, no live VM, no Anthropic API,
# no GitHub-API call. Reads four on-disk artifacts (Tag-56 workflow
# YAML, Tag-54 spec MD, Tag-61 fixture JSON x3) as text.
#
# Required status check (follow-up)
# ---------------------------------
#
# Per `feedback_branch_protection_check_names.md` the required
# status check, once promoted to a branch-protection gate, is
# `Stage 4 Aggregate Verdict (OPERATOR-TRIGGER-READY/CAUTION/BLOCKED) /
# watch-day-operator-trigger-simulation`. Initial landing does NOT
# add the gate; that is a follow-up after one green run on main.
#
# Author: Noa Bergstroem (SRE)
# Anchor: Tag-62 Marathon-Continuous-Mode Pre-KW-24 Operator-
#         Trigger-Test-Pipeline.

name: watch-day-operator-trigger-simulation

on:
  workflow_dispatch:
    inputs:
      diagnostic_override:
        description: "Override the simulated diagnostic input value (default: 'true')"
        required: false
        default: "true"
      fixture_set:
        description: "Fixture set for post-trigger verification (green | caution | red)"
        required: false
        default: "green"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/watch-day-operator-trigger-simulation.yml"
      - ".github/workflows/phase-3c-watch-day-practice-run.yml"
      - ".github/workflows/watch-day-cron-pre-fire-probe.yml"
      - ".github/workflows/watch-day-practice-run-replay.yml"
      - "tooling/ci/simulate_watch_day_operator_trigger.py"
      - "tooling/ci/aggregate_watch_day_practice_run_verdict.py"
      - "tooling/ci/verify_watch_day_cron_pre_fire_readiness.py"
      - "docs/observability/pre-cutover-watch-day-spec.md"
      - "tests/observability/test_watch_day_operator_trigger_pipeline_tag62.py"
      - "tests/observability/fixtures/watch-day-practice-run-sample-green.json"
      - "tests/observability/fixtures/watch-day-practice-run-sample-caution.json"
      - "tests/observability/fixtures/watch-day-practice-run-sample-red.json"

permissions:
  contents: read

concurrency:
  group: watch-day-operator-trigger-simulation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-1-pre-trigger-health-check:
    name: Stage 1 Pre-Trigger Health-Check (cron + routing + fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage_1_status: ${{ steps.probe.outputs.stage_1_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stage 1 - pre-trigger health-check
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          set +e
          python3 tooling/ci/simulate_watch_day_operator_trigger.py \
            pre-trigger \
            --output out/stage-1-pre-trigger.json
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            echo "stage_1_status=green" >> "$GITHUB_OUTPUT"
          elif [[ $rc -eq 2 ]]; then
            echo "stage_1_status=yellow" >> "$GITHUB_OUTPUT"
            echo "::warning::Stage 1 CAUTION: pre-trigger health-check yellow"
          else
            echo "stage_1_status=red" >> "$GITHUB_OUTPUT"
            echo "::warning::Stage 1 BLOCK: pre-trigger health-check red"
          fi
      - name: Upload Stage 1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-1-pre-trigger
          path: out/stage-1-pre-trigger.json
          if-no-files-found: warn

  stage-2-simulate-operator-trigger:
    name: Stage 2 Simulate Operator-Trigger (workflow_dispatch event-shape)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage_2_status: ${{ steps.probe.outputs.stage_2_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stage 2 - simulate operator-trigger
        id: probe
        shell: bash
        env:
          DIAGNOSTIC_OVERRIDE: ${{ github.event.inputs.diagnostic_override }}
        run: |
          set -uo pipefail
          mkdir -p out
          override_arg=()
          if [[ -n "${DIAGNOSTIC_OVERRIDE:-}" && "${DIAGNOSTIC_OVERRIDE}" != "true" ]]; then
            override_arg=(--diagnostic-override "${DIAGNOSTIC_OVERRIDE}")
          fi
          set +e
          python3 tooling/ci/simulate_watch_day_operator_trigger.py \
            trigger \
            "${override_arg[@]}" \
            --output out/stage-2-trigger.json
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            echo "stage_2_status=green" >> "$GITHUB_OUTPUT"
          elif [[ $rc -eq 2 ]]; then
            echo "stage_2_status=yellow" >> "$GITHUB_OUTPUT"
            echo "::warning::Stage 2 CAUTION: trigger envelope yellow (diagnostic override)"
          else
            echo "stage_2_status=red" >> "$GITHUB_OUTPUT"
            echo "::warning::Stage 2 BLOCK: trigger envelope shape regressed"
          fi
      - name: Upload Stage 2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-2-trigger
          path: out/stage-2-trigger.json
          if-no-files-found: warn

  stage-3-post-trigger-verification:
    name: Stage 3 Post-Trigger Verification (envelope-shape + verdict-stable)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage_3_status: ${{ steps.probe.outputs.stage_3_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stage 3 - post-trigger verification
        id: probe
        shell: bash
        env:
          FIXTURE_SET: ${{ github.event.inputs.fixture_set }}
        run: |
          set -uo pipefail
          mkdir -p out
          fixture="${FIXTURE_SET:-green}"
          if [[ -z "${fixture}" ]]; then
            fixture="green"
          fi
          set +e
          python3 tooling/ci/simulate_watch_day_operator_trigger.py \
            post-trigger \
            --fixture-set "${fixture}" \
            --output out/stage-3-post-trigger.json
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            echo "stage_3_status=green" >> "$GITHUB_OUTPUT"
          elif [[ $rc -eq 2 ]]; then
            echo "stage_3_status=yellow" >> "$GITHUB_OUTPUT"
            echo "::warning::Stage 3 CAUTION: post-trigger envelope yellow"
          else
            echo "stage_3_status=red" >> "$GITHUB_OUTPUT"
            echo "::warning::Stage 3 BLOCK: post-trigger verdict-drift or shape regression"
          fi
      - name: Upload Stage 3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-3-post-trigger
          path: out/stage-3-post-trigger.json
          if-no-files-found: warn

  stage-4-aggregate-verdict:
    name: Stage 4 Aggregate Verdict (OPERATOR-TRIGGER-READY/CAUTION/BLOCKED)
    runs-on: ubuntu-latest
    needs:
      - stage-1-pre-trigger-health-check
      - stage-2-simulate-operator-trigger
      - stage-3-post-trigger-verification
    if: always()
    outputs:
      verdict: ${{ steps.aggregate.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Aggregate Stages 1..3 into operator-trigger verdict
        id: aggregate
        shell: bash
        env:
          STAGE_1_STATUS: ${{ needs.stage-1-pre-trigger-health-check.outputs.stage_1_status }}
          STAGE_2_STATUS: ${{ needs.stage-2-simulate-operator-trigger.outputs.stage_2_status }}
          STAGE_3_STATUS: ${{ needs.stage-3-post-trigger-verification.outputs.stage_3_status }}
        run: |
          set -uo pipefail
          mkdir -p out
          s1="${STAGE_1_STATUS:-red}"
          s2="${STAGE_2_STATUS:-red}"
          s3="${STAGE_3_STATUS:-red}"
          set +e
          python3 tooling/ci/simulate_watch_day_operator_trigger.py \
            aggregate \
            --stage-1 "$s1" \
            --stage-2 "$s2" \
            --stage-3 "$s3" \
            --output out/watch-day-operator-trigger-verdict.json
          rc=$?
          set -e
          verdict=$(python3 -c "import json,sys; print(json.load(open('out/watch-day-operator-trigger-verdict.json'))['verdict'])")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo "## Tag-62 Watch-Day Operator-Trigger Pipeline Verdict: \`$verdict\`"
            echo ""
            echo "| Stage | Status |"
            echo "|------|--------|"
            echo "| Stage 1 Pre-Trigger Health-Check | \`$s1\` |"
            echo "| Stage 2 Simulate Operator-Trigger | \`$s2\` |"
            echo "| Stage 3 Post-Trigger Verification | \`$s3\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$verdict" in
            OPERATOR-TRIGGER-READY)
              echo "Tag-62 operator-trigger pipeline: PASS"
              exit 0
              ;;
            TRIGGER-CAUTION)
              echo "::warning::Tag-62 operator-trigger pipeline: CAUTION"
              exit 0
              ;;
            TRIGGER-BLOCKED)
              echo "::error::Tag-62 operator-trigger pipeline: BLOCKED"
              exit 1
              ;;
            *)
              echo "::error::Tag-62 operator-trigger pipeline: unknown verdict $verdict"
              exit 1
              ;;
          esac
      - name: Upload final verdict artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-day-operator-trigger-verdict
          path: out/watch-day-operator-trigger-verdict.json
          if-no-files-found: warn
