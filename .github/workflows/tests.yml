# SPDX-License-Identifier: Apache-2.0
#
# Wirelang production-CI lane
# ---------------------------------------------
#
# Purpose: prove that the wirelang test suite stays green on the FULL
# install set (`rfc8785`, `jsonschema`, `cryptography`, `shamir-mnemonic`)
# and that the test-count delta between this lane and the sandbox lane
# stays within the documented envelope. Together with `sandbox-ci.yml`
# this forms the two-sided cross-check described in the
# lane contract (sandbox = lower bound, production = upper bound).
#
# Lane policy
# -----------
# - Sandbox lane (companion workflow `sandbox-ci.yml`):
#   minimal install set; ~291 tests pass with rfc8785/jsonschema-gated
#   modules skipped via `pytest.importorskip`.
# - Production lane (this workflow): full install set; ~435 tests pass
#   with zero importorskip-skips on rfc8785/jsonschema keys. Drift
#   between the two lane counts is a CI-fail signal.
#
# Drift envelope
# --------------
# Lineage:
#   - baseline: production 435, sandbox 291, delta 144.
#   - (TV-W-1): production 448, sandbox 303 + 86 skip,
#     delta 145 (drift 1, no re-baseline).
#   - (Phase-2 datalog ratification): production 464,
#     sandbox 315 + 90 skip, delta 149 (drift 5 = tol 5, at-edge).
#     Re-baselined to 149 because the new schema-admission tests for
#     `peer_org` / `federation_route` are jsonschema-gated by design;
#     §6.3 re-baseline list item 1 in
#     wirelang/specs/datalog-caveat-vocabulary-phase-2.md.
#   - ADR-0052 Class-P promotion of
#     `caveat_hash`: five new schema-admission probes
#     (T-V0.2.1-01..05) land jsonschema-gated;
#     EXPECTED_DELTA re-baselined 149 → 154 per §6.3 re-baseline
#     list item 1.
# We allow ±5 tests of slack to absorb routine churn (a single new
# test module added under one lane only, or a single fixture-driven
# parametrise expansion). Anything outside that envelope means either
# a test was silently re-classified across the importorskip boundary
# or a new dependency-gated module was added without updating the
# sandbox-skip-list. Either case warrants a human look — that is what
# the drift-detection job is for.
#
# Trigger surface mirrors `sandbox-ci.yml` so the two lanes always run
# on the same change-set. The drift-detection job runs after both lane
# jobs complete and can therefore compare their collected-counts.
#
# This workflow is the deliverable for the Phase-1b CI
# build-out and acts as the upper-bound regression net for the
# wirelang suite.

name: tests

on:
  push:
    branches:
      - main
    # No `paths:` filter — see the pull_request note below; the same
    # invariant applies to pushes on `main`.
  # No `paths:` filter. This workflow feeds a required status context;
  # a required context that never reports leaves the pull request
  # pending forever, so it fires on every pull request.
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  production-suite:
    name: wirelang suite with rfc8785 + jsonschema
    runs-on: ubuntu-latest
    outputs:
      collected: ${{ steps.collect.outputs.collected }}
      passed: ${{ steps.run.outputs.passed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install full production deps
        # Deliberate set: rfc8785 + jsonschema present, plus the
        # always-required runtime deps. This is the lane that exercises
        # the trail-of-bits rfc8785 implementation and the
        # Draft 2020-12 jsonschema validator path.
        # NB: PyYAML is required by wirelang.persona.persona_canonical_form
        # at module load (frontmatter parser); it is currently not
        # declared in pyproject.toml's runtime deps. Add it explicitly
        # here so the lane can import the persona package. Long-term fix
        # belongs in pyproject.toml's `dependencies` list.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest>=8.0" \
            "pytest-subtests>=0.11" \
            "rfc8785>=0.1.4" \
            "jsonschema>=4.21" \
            "cryptography>=42" \
            "shamir-mnemonic>=0.3.0" \
            "PyYAML>=6.0"

      - name: Verify rfc8785 + jsonschema are present
        # Hard-fail the lane if either library is somehow absent;
        # otherwise the lane silently degrades into a duplicate of the
        # sandbox lane and stops being an upper-bound check.
        run: |
          python - <<'PY'
          import importlib.util, sys
          required = ("rfc8785", "jsonschema")
          missing = [m for m in required if importlib.util.find_spec(m) is None]
          if missing:
              print(f"production-ci invariant broken: {missing} unexpectedly absent", file=sys.stderr)
              sys.exit(1)
          print("production-ci invariant ok: rfc8785 and jsonschema are present")
          PY

      - name: Collect-gate + test count (production lane)
        id: collect
        # Emits the same integer the drift-detection job below has always
        # consumed (node-ID count == the `<N> tests collected` summary
        # number; verified equal at 3307 for wirelang/ at the baseline
        # commit), and additionally fails on the two things a count
        # comparison cannot see:
        #
        #   * a collection error -- previously only caught as a side
        #     effect of `bash -e`, and only as "the step exited 2", never
        #     named;
        #   * a module that collects zero node IDs because a module-level
        #     `pytest.importorskip` fired on something this lane is
        #     supposed to have installed. Exit code 0, smaller count,
        #     nothing red. In THIS lane that is always a defect: the
        #     "Verify rfc8785 + jsonschema are present" step above makes
        #     "everything is installed" the lane's contract.
        #
        # The sandbox lane runs the same script with --profile sandbox,
        # where skipping IS the contract, so only the collection-error
        # half applies there. The deliberate production/sandbox split is
        # untouched.
        run: |
          python tooling/ci/collect_gate.py \
            --profile production \
            --root wirelang \
            --github-output collected

      # ------------------------------------------------------------------
      # Whole-tree collection gate.
      # ------------------------------------------------------------------
      #
      # Collection, not execution. When this step was written, 177 of
      # this repository's 413 test modules were run by no workflow at
      # all; the Welle-3 lane promotion (ADR-0075) took that to zero, 97
      # into required lanes and 80 into the non-blocking observation
      # lane. The step keeps its job either way: collection is the
      # cheapest possible statement about a module, it covers the
      # observation lane and the required ones alike, and which lane a
      # module belongs in stays an owned decision recorded in
      # `tests/lanes/lane_assignment.json` rather than something this
      # step smuggles in. What it buys: no module can rot silently. An import that breaks, a module that starts
      # reaching for an undeclared wheel, a file that stops being
      # collectable at all -- all of that goes red at the cost of ~10
      # seconds, without asserting a single thing about their contents.
      - name: Collect-gate — whole tree (tests + wirelang + infra)
        run: |
          python tooling/ci/collect_gate.py \
            --profile production \
            --root tests \
            --root wirelang \
            --root infra

      # ------------------------------------------------------------------
      # Lane-assignment guard.
      # ------------------------------------------------------------------
      #
      # Keeps `tests/lanes/lane_assignment.json` equal to what
      # `.github/workflows/` actually does: a new test module without an
      # entry is red, a module that loses its required lane is red, and a
      # required status context whose name no longer matches a job
      # display-name is red here instead of leaving pull requests pending
      # forever. It does NOT require that everything runs.
      - name: Lane-assignment + collect-gate self-test
        run: |
          python -m pytest tests/lanes/ -v --tb=short

      # ------------------------------------------------------------------
      # Exemption expiry (ADR-0075 §3, approved 2026-09-15, hard variant).
      # ------------------------------------------------------------------
      #
      # The pytest module above is the gate: an expired `review_by` in
      # `tests/lanes/lane_assignment.json` fails this required context.
      # The step below adds the half a hermetic test cannot do — it
      # compares the file against the pull request's base commit and
      # refuses a review date that moved without `renewed_on` and
      # `renewal_reason`. Without it, the way out of a red lane is to
      # edit one character on the morning it goes red.
      #
      # `--require-base` on purpose: if the base version cannot be read,
      # the check must say so and fail rather than pass quietly. A check
      # that silently becomes a no-op is the defect class this whole
      # wave is about.
      - name: Exemption renewal check (review dates may not move silently)
        if: github.event_name == 'pull_request'
        run: |
          python tooling/ci/check_exemption_renewal.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --require-base

      - name: Exemption expiry — summary
        # Always, including on a red run: the 14-day warning window is
        # the damper ADR-0075 §3 asks for, and a damper nobody sees is
        # not a damper. Never fails on its own.
        if: always()
        run: |
          python tooling/ci/exemption_expiry.py --summary

      # ------------------------------------------------------------------
      # Workflow-shape suite (ADR-0075 / Welle-3 lane promotion, step 1).
      # ------------------------------------------------------------------
      #
      # `tests/workflows/` holds the hermetic structure tests over
      # `.github/workflows/*.yml`, and among them the one guard that every
      # other gate in this repository depends on:
      # `test_required_context_error_propagation.py` asserts that a
      # required status context built on `needs:` cannot fail open — it
      # must carry `if: always()` AND turn every `needs.<job>.result` into
      # its own exit code before it runs anything else.
      #
      # It is attached HERE, to a job whose display name is already a
      # branch-protection context, and deliberately NOT to a new gate job
      # under `runtime-acceptance-gates.yml`. Two reasons, both load-
      # bearing:
      #
      #   1. Ordering. The next step of the Welle-3 promotion extends the
      #      acceptance-gate aggregator with new `needs:` entries. If the
      #      guard only became live *through* that same change, the change
      #      itself would be the first thing it never checked. Wiring the
      #      guard into an independent, already-required lane first makes
      #      the aggregator extension the first edit the guard covers.
      #   2. Dependencies. This lane installs PyYAML. The guard module
      #      opens with `pytest.importorskip("yaml")`, so in a fresh gate
      #      job that installs only `-e . pytest` it would collect zero
      #      tests and report green without checking anything — the exact
      #      class of defect it exists to catch.
      #
      # Cost: 177 tests, under two seconds.
      - name: Workflow-shape suite (fail-open guard over required contexts)
        run: |
          python -m pytest tests/workflows/ -v --tb=short -rs

      - name: Run wirelang test suite (production lane)
        id: run
        # Expectation: full collected set passes; no importorskip-skips
        # on rfc8785/jsonschema (the shamir-mnemonic-gated wat tests
        # may still skip; they are not part of the drift envelope).
        run: |
          python -m pytest wirelang/ -v --tb=short --junitxml=junit.xml
          # Extract pass-count from junit for the drift-detection job.
          # Use a tiny inline python to avoid depending on xmllint.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          tree = ET.parse("junit.xml")
          root = tree.getroot()
          # junitxml root is testsuites or testsuite depending on plugin.
          suites = root.findall("testsuite") or [root]
          tests = sum(int(s.get("tests", "0")) for s in suites)
          failures = sum(int(s.get("failures", "0")) for s in suites)
          errors = sum(int(s.get("errors", "0")) for s in suites)
          skipped = sum(int(s.get("skipped", "0")) for s in suites)
          print(f"passed={tests - failures - errors - skipped}")
          PY

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-junit
          path: junit.xml
          retention-days: 14

      # ------------------------------------------------------------------
      # Cross-language Bridge-Audit-Roundtrip-E2E.
      # ------------------------------------------------------------------
      #
      # The integration test in `tests/integration/test_bridge_audit_
      # roundtrip_e2e.py` exercises the Python emit / Rust replay
      # roundtrip. The Python half lands in the wirelang suite above;
      # the Rust half needs `cargo build` of the `replay_cli` binary
      # before the E2E branch of the test can run. Without the binary
      # the test skips its E2E lane cleanly (7 Python-only tests still
      # pass), so this step is the gate that turns those 7 skips into
      # 14 passes.
      #
      # ubuntu-latest ships rustup + a stable toolchain by default;
      # no explicit setup-action is required.
      - name: Build replay_cli (Rust)
        # Restrict the build to the one binary the integration test
        # needs; pulling the whole workspace would 5x the build time
        # without benefit.
        run: |
          cargo build \
            --manifest-path wirelang-rust/Cargo.toml \
            -p persona-engine-bridge-audit-replay \
            --bin replay_cli
          ls -l wirelang-rust/target/debug/replay_cli

      - name: Run Bridge-Audit-Roundtrip-E2E integration tests
        env:
          # Pin the binary path so the test's discovery helper resolves
          # deterministically (CI runner layouts vary).
          WAKIR_REPLAY_CLI_BIN: ${{ github.workspace }}/wirelang-rust/target/debug/replay_cli
        run: |
          python -m pytest tests/integration/test_bridge_audit_roundtrip_e2e.py \
            -v --tb=short

      # ------------------------------------------------------------------
      # Build the submit_worker binary so the
      # tests/wat/test_anchor_backend.py real-binary smoke test
      # (test_real_binary_smoke_ots_cli_path_aborts_without_ots) runs
      # instead of skipping. Same restricted-build pattern as
      # replay_cli above. The smoke test verifies that the binary
      # surfaces a clean exit-3 internal-config error when ots is
      # absent from PATH — proving the bridge wires up on the
      # negative path without requiring the opentimestamps-client
      # to actually be installed in CI.
      # ------------------------------------------------------------------
      - name: Build submit_worker (Rust, anchor-backend bridge)
        run: |
          cargo build \
            --manifest-path wirelang-rust/Cargo.toml \
            -p persona-engine-anchor-submit-worker \
            --bin submit_worker
          ls -l wirelang-rust/target/debug/submit_worker

      - name: Run WAT anchor-backend real-binary smoke
        env:
          WAKIR_SUBMIT_WORKER_BIN: ${{ github.workspace }}/wirelang-rust/target/debug/submit_worker
        run: |
          python -m pytest tests/wat/test_anchor_backend.py \
            -v --tb=short

  sandbox-suite-shadow:
    # Shadow-run of the sandbox lane inside this workflow so the
    # drift-detection job can compare collected-counts in a single
    # workflow run. The authoritative sandbox lane lives in
    # `sandbox-ci.yml` and stays the source of truth for the lower
    # bound; this shadow is purely a co-located measurement so we do
    # not have to cross workflow boundaries (which GitHub Actions does
    # not support cleanly without polling the REST API).
    name: wirelang suite without rfc8785 / jsonschema (shadow)
    runs-on: ubuntu-latest
    outputs:
      collected: ${{ steps.collect.outputs.collected }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal sandbox deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest>=8.0" \
            "pytest-subtests>=0.11" \
            "cryptography>=42" \
            "shamir-mnemonic>=0.3.0"

      - name: Verify rfc8785 + jsonschema are absent
        run: |
          python - <<'PY'
          import importlib.util, sys
          forbidden = ("rfc8785", "jsonschema")
          present = [m for m in forbidden if importlib.util.find_spec(m) is not None]
          if present:
              print(f"sandbox-shadow invariant broken: {present} unexpectedly importable", file=sys.stderr)
              sys.exit(1)
          print("sandbox-shadow invariant ok: rfc8785 and jsonschema are absent")
          PY

      - name: Collect-gate + test count (sandbox shadow)
        id: collect
        # Same script, sandbox profile: a collection error is still red,
        # but a module that collects nothing is EXPECTED here -- that is
        # what the "Verify rfc8785 + jsonschema are absent" step above
        # establishes and what the drift envelope measures. The gate does
        # not second-guess it.
        run: |
          python tooling/ci/collect_gate.py \
            --profile sandbox \
            --root wirelang \
            --github-output collected

      - name: Run wirelang test suite (sandbox shadow)
        # Co-located run so a sandbox-only failure is caught here too,
        # without waiting for the authoritative sandbox-ci workflow.
        run: |
          python -m pytest wirelang/ -v --tb=short

  drift-detection:
    name: production-vs-sandbox drift envelope
    needs: [production-suite, sandbox-suite-shadow]
    # Same fail-open class as the runtime-acceptance-gates aggregator:
    # this job's display name is a branch-protection context, and a
    # required context that *skips* because a dependency failed does not
    # block a merge. `always()` keeps it reporting; the result check
    # below keeps it honest.
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require both suite jobs to have succeeded
        env:
          SUITE_RESULTS: |
            production-suite=${{ needs.production-suite.result }}
            sandbox-suite-shadow=${{ needs.sandbox-suite-shadow.result }}
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            [ -n "${line}" ] || continue
            job="${line%%=*}"
            result="${line#*=}"
            if [ "${result}" != "success" ]; then
              echo "::error::suite job ${job} result=${result:-<none>} (expected success)"
              bad=1
            else
              echo "suite job ${job}: success"
            fi
          done <<< "${SUITE_RESULTS}"
          if [ "${bad}" -ne 0 ]; then
            echo "drift envelope: an upstream suite job did not succeed" >&2
            exit 1
          fi

      - name: Compare collected-counts
        # Baseline lineage:
        # -: production 435, sandbox 291, delta 144.
        # -: production 448, sandbox 303 + 86 skip → delta 145
        #   (drift 1 ≤ tol 5, no re-baseline).
        # -: production 464, sandbox 315 + 90 skip → delta 149
        #   (drift 5 = tol 5, at-edge — re-baselined to 149 here per
        #   the §6.3 re-baseline list of
        #   datalog-caveat-vocabulary-phase-2.md, item 1: vocabulary
        #   addition `peer_org` / `federation_route` triggered the
        #   schema-admission test additions).
        # - ADR-0052 Class-P promotion of
        #   `caveat_hash` lands five new jsonschema-gated probes in
        #   test_datalog_vocabulary_phase_2.py (T-V0.2.1-01..05);
        #   the five new ratification probes in
        #   test_caveat_hash_promotion_substrate.py (T-CHP-07..11)
        #   are regex-based and run in BOTH lanes (no drift impact).
        #   Re-baselined to 154 here per §6.3 re-baseline list item
        #   1 (vocabulary addition triggers schema-admission test
        #   additions).
        # - CI-Fix: the 16
        #   `test_persona_*.py` modules are now module-level
        #   `pytest.importorskip("rfc8785"|"jsonschema")`-gated. They
        #   used to silently crash collection in the sandbox lane
        #   (the persona-package imports rfc8785 at module load
        #   unconditionally); with the explicit guard they skip
        #   cleanly. Persona-side delta: production 1258 collected,
        #   sandbox 949 collected → delta 309. Re-baselined from 154
        #   to 309. This is a one-time correction of a pre-existing
        #   crash that was hidden behind the collect-output parse
        #   bug; future drift over this baseline still warns at the
        #   same ±5 tolerance.
        # -: the new
        #   `test_recovery_workflow_cross_lang_parity.py` module
        #   gates on `rfc8785` via module-level
        #   `pytest.importorskip("rfc8785")` so the sandbox lane
        #   skips it cleanly. The module adds 16 tests (T01..T12
        #   + 4 parametrised T11 vector pins; T11 is one parametrised
        #   id over 5 fixture names, so the production count picks
        #   up 11 + 5 = 16 tests). Persona-side delta: production
        #   1274 collected, sandbox 949 collected → delta 325.
        #   Re-baselined 309 → 325 in the same PR that adds the
        #   gated module — exactly the deliberate-review path the
        #   workflow comment above flags.
        # -: the new
        #   `test_frontmatter_parser_cross_lang_parity.py` module
        #   (Phase-3a Item 11 / Modul 11) gates on `yaml` + `rfc8785`
        #   via module-level `pytest.importorskip(...)` so the sandbox
        #   lane skips it cleanly. The module adds 16 tests (T01..T10
        #   + T07 parametrised over 7 fixture vectors → 6 + 7 = 13,
        #   plus T01..T06 + T08..T10 = 9, total 9 + 7 = 16). Observed
        #   delta on first push: production 1290 collected, sandbox
        #   949 collected → delta 346. Re-baselined 325 → 346 in
        #   the same PR — gated-module-only addition, deliberate
        #   review path per the workflow comment above.
        # -: the new
        #   `test_v907_verify_cross_lang_parity.py` module (Phase-3a
        #   Item 12 / Modul 12) gates on `yaml` + `rfc8785` and adds
        #   15 tests (T01..T05 + T08..T10 = 9, plus T06..T07
        #   parametrised over 6 vectors = 6, total 9 + 6 = 15).
        #   Re-baselined 346 → 361 in PR #235.
        # -: the new
        #   `test_bridge_audit_diff_engine_cross_lang_parity.py`
        #   module (Phase-3a Item 13 / Modul 13) gates on `rfc8785`
        #   and adds 15 tests (T01..T05 + T07..T10 = 9, plus T06
        #   parametrised over 6 vectors = 6, total 9 + 6 = 15).
        #   Re-baselined 361 → 376 in PR #241.
        # -: the new
        #   `test_bridge_audit_replay_cross_lang_parity.py` module
        #   (Phase-3a Item 11 / Modul 14, closes the bridge-audit
        #   trilogy: writer/diff-engine/replay) gates on `rfc8785`
        #   and adds 23 tests (constants pin x6 + determinism +
        #   wire-shape + hash-shape + fixture-structure x3 +
        #   parametrised per-vector x6 + success-path-invariants +
        #   build_trace_from_report + live-engine-cross-check +
        #   kind-coverage x2 = 23 total). Re-baselined 376 → 399
        #   in PR #246.
        # -: the new
        #   `test_migrate_version_cross_lang_parity.py` module
        #   (Phase-3a Item 15 / Modul 15 — closes the
        #   Phase-3a-Foundation sweep at 15/15) gates on `rfc8785`
        #   via module-level `pytest.importorskip("rfc8785")`. The
        #   module adds 26 tests (T01..T08 = 8 non-parametrised,
        #   plus T09 parametrised over 6 fixtures = 6, plus T10,
        #   plus T11 split into two named tests = 2, plus T12
        #   parametrised over 8 inputs = 8, plus T13 = 1; total
        #   8 + 6 + 1 + 2 + 8 + 1 = 26). Re-baselined 399 → 425
        #   in this PR.
        # Tolerance ±5 absorbs routine churn going forward.
        # If the observed delta drifts outside the envelope, fail
        # loud — either a test was silently re-classified across the
        # importorskip boundary or a new dependency-gated module
        # was added without updating the sandbox-skip-list.
        env:
          PRODUCTION_COUNT: ${{ needs.production-suite.outputs.collected }}
          SANDBOX_COUNT: ${{ needs.sandbox-suite-shadow.outputs.collected }}
          #: re-baselined 425 -> 448 because
          # the new `test_manifest_0_5_0_pre_cutover.py` adds 23
          # PyYAML-gated tests (the pin-pack loader uses
          # pytest.importorskip("yaml") so all 23 collect in the
          # production lane but skip in the sandbox lane, lifting the
          # delta by exactly 23).
          #: re-baselined 448 -> 493 because
          # the bridge-audit-writer wire-in adds two new
          # PyYAML-gated test modules:
          #   - test_bridge_audit_writer_wire_in.py: 25 tests
          #   - test_manifest_0_5_1_pre_cutover.py: 23 tests
          # Both modules use pytest.importorskip("yaml") for the
          # 0.5.1-pre-cutover pin-pack/manifest loader, so all 48
          # collect in production but skip in sandbox -- the delta
          # lifts by exactly 45 (48 minus 3 superseded tests on
          # `test_manifest_0_5_0_pre_cutover.py` that no longer
          # parametrise the 10th record as "scaffolded-only").
          #: re-baselined 493 -> 529 because
          # the 0.5.2-final-pre-cutover final pre-cutover
          # consolidation marker adds one new PyYAML-gated test module:
          #   - test_manifest_0_5_2_final_pre_cutover.py: 36 tests
          # The module uses pytest.importorskip("yaml") for the
          # 0.5.2-final-pre-cutover pin-pack/manifest loader, so all
          # 36 collect in production but skip in sandbox -- the delta
          # lifts by exactly 36.
          #: re-baselined 529 -> 545 because
          # the engine-0.5.2-production-readiness-audit adds
          # one new PyYAML-gated test module:
          #   - test_production_readiness_audit_0_5_2.py: 16 tests
          # Same importorskip("yaml") pattern as the 0.5.2-final
          # manifest tests; production collects 16, sandbox skips
          # all 16. Delta lifts by exactly 16 (529 + 16 = 545).
          # Re-baselined 545 -> 563 because
          # the engine-0.5.3-production-readiness-audit (post-
          # Final-Bump counterpart of the pre-cutover audit) adds one new PyYAML-gated
          # test module:
          #   - test_production_readiness_audit_0_5_3.py: 18 tests
          # Same importorskip("yaml") pattern as above; production
          # collects 18, sandbox skips all 18. Delta lifts by exactly
          # 18 (545 + 18 = 563).
          EXPECTED_DELTA: '563'
          DELTA_TOLERANCE: '5'
        run: |
          python - <<'PY'
          import os, sys
          prod = int(os.environ["PRODUCTION_COUNT"])
          sand = int(os.environ["SANDBOX_COUNT"])
          expected = int(os.environ["EXPECTED_DELTA"])
          tol = int(os.environ["DELTA_TOLERANCE"])

          observed = prod - sand
          drift = abs(observed - expected)

          print(f"production-lane collected:  {prod}")
          print(f"sandbox-lane collected:     {sand}")
          print(f"observed delta:             {observed}")
          print(f"expected delta: {expected}")
          print(f"tolerance:                  ±{tol}")
          print(f"absolute drift:             {drift}")

          # Lower-bound sanity: production must be strictly greater than
          # sandbox. Equal counts mean either the sandbox lane silently
          # gained the gated libs or the production lane silently lost
          # them — both are invariant breaks.
          if prod <= sand:
              print(
                  f"\nDRIFT FAIL: production_count ({prod}) <= sandbox_count "
                  f"({sand}); upper/lower bound invariant broken.",
                  file=sys.stderr,
              )
              sys.exit(1)

          if drift > tol:
              print(
                  f"\nDRIFT FAIL: |observed - expected| = {drift} > {tol}.\n"
                  f"Either a gated test module was added/removed without\n"
                  f"updating the sandbox-skip envelope, or a test was\n"
                  f"silently re-classified across the importorskip\n"
                  f"boundary. Re-baseline EXPECTED_DELTA in tests.yml\n"
                  f"only after a deliberate review of the change.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("\nDRIFT OK: envelope intact.")
          PY
