# SPDX-License-Identifier: Apache-2.0
#
# OTS Pre-Anchor Activation Probe (Tag-59)
# ----------------------------------------
#
# Purpose
# =======
#
# Tag-57 PR #366 closed OPEN-K2 with an *audit-only* manifest-hash
# OTS-anchor wiring (no real OTS calendar call). Tag-58 PR #371
# (Reza) sealed the Wirelang-Spec v0.4.3 against post-freeze drift
# with a cutover window pinned at 2026-06-09.
#
# Tag-59 adds the *pre-activation-probe* mode to the K2 helper:
# a hermetic dry-run that walks the exact OTS-call pipeline shape
# (input validation, hash computation, payload shape, sandbox
# boundary) WITHOUT performing any network I/O. When the
# Aufsichtsrat authorises live anchoring (KW-24 cutover gate), a
# separate Operator-Hand step performs the real ``ots stamp``
# invocation — this probe is the green-light tripwire that asserts
# the Repo-Side pipeline is ready.
#
# Stages
# ======
#
# Stage 1 — pre-activation-probe mode on every pre-cutover manifest
#           (0.5.0, 0.5.1, 0.5.2-final). Hermetic, stdlib-only.
# Stage 2 — Schema-validate every emitted verdict envelope against
#           the documented v1 shape (required keys, verdict literal,
#           ``ar_authorisation_required: true``).
# Stage 3 — Aggregate verdict: ``PROBE-READY`` if every per-manifest
#           verdict is PROBE-READY, otherwise ``PROBE-DEFECT``.
#           Emit job-summary table.
#
# AR-Authorisation Pfad
# =====================
#
# See ``docs/operations/manifest-hash-ots-anchor-wiring.md`` §7. The
# probe never crosses the Sandbox boundary; the live OTS call is a
# separate Operator-Hand workflow that consumes the probe verdict
# as an input gate.

name: ots-pre-anchor-activation-probe

on:
  push:
    branches:
      - main
    paths:
      - 'tooling/ots/emit_manifest_hash_ots_marker.py'
      - 'tooling/ots/manifest-hash-ots-anchor-stub.json'
      - 'wirelang/persona_engine/MANIFEST-0.5.0-pre-cutover.md'
      - 'wirelang/persona_engine/MANIFEST-0.5.1-pre-cutover.md'
      - 'wirelang/persona_engine/MANIFEST-0.5.2-final-pre-cutover.md'
      - 'tests/ci/test_ots_pre_anchor_activation_probe_tag59.py'
      - 'docs/operations/manifest-hash-ots-anchor-wiring.md'
      - '.github/workflows/ots-pre-anchor-activation-probe.yml'
  pull_request:
    paths:
      - 'tooling/ots/emit_manifest_hash_ots_marker.py'
      - 'tooling/ots/manifest-hash-ots-anchor-stub.json'
      - 'wirelang/persona_engine/MANIFEST-0.5.0-pre-cutover.md'
      - 'wirelang/persona_engine/MANIFEST-0.5.1-pre-cutover.md'
      - 'wirelang/persona_engine/MANIFEST-0.5.2-final-pre-cutover.md'
      - 'tests/ci/test_ots_pre_anchor_activation_probe_tag59.py'
      - 'docs/operations/manifest-hash-ots-anchor-wiring.md'
      - '.github/workflows/ots-pre-anchor-activation-probe.yml'
  workflow_dispatch:
    inputs:
      enforce:
        description: 'If "true", exit 1 on PROBE-DEFECT (default: true).'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read

jobs:
  ots-pre-anchor-activation-probe:
    name: OTS Pre-Anchor Activation Probe (Tag-59)
    runs-on: ubuntu-latest

    env:
      PROBE_ENFORCE: ${{ github.event.inputs.enforce || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (stdlib-only; no pip install)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage 1 — Run pre-activation-probe per manifest
        id: stage1
        shell: bash
        run: |
          set -eu
          mkdir -p out/probe-verdicts
          MANIFESTS=(
            "wirelang/persona_engine/MANIFEST-0.5.0-pre-cutover.md"
            "wirelang/persona_engine/MANIFEST-0.5.1-pre-cutover.md"
            "wirelang/persona_engine/MANIFEST-0.5.2-final-pre-cutover.md"
          )
          for m in "${MANIFESTS[@]}"; do
            name="$(basename "${m}" .md)"
            python3 tooling/ots/emit_manifest_hash_ots_marker.py \
              --mode pre-activation-probe \
              --manifest "${m}" \
              --probe-verdict-out "out/probe-verdicts/${name}.json" \
              --actor "${GITHUB_ACTOR:-ci}" \
              --now "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          done
          ls -la out/probe-verdicts/

      - name: Stage 2 — Validate verdict-envelope shape
        id: stage2
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import json, pathlib, sys
          required = {
              "schema_version",
              "kind",
              "mode",
              "verdict",
              "stages",
              "manifest_sha256",
              "manifest_size_bytes",
              "probed_at_utc",
              "ar_authorisation_required",
              "anchors",
          }
          stage_keys = {
              "input_validation",
              "hash_computation",
              "payload_shape",
              "sandbox_boundary",
          }
          fail = 0
          for p in sorted(pathlib.Path("out/probe-verdicts").glob("*.json")):
              data = json.loads(p.read_text(encoding="utf-8"))
              keys = set(data.keys())
              if keys != required:
                  print(f"::error file={p}::verdict key drift: {keys ^ required}")
                  fail += 1
                  continue
              if data["schema_version"] != 1:
                  print(f"::error file={p}::schema_version != 1")
                  fail += 1
              if data["kind"] != "ots-pre-activation-probe-verdict":
                  print(f"::error file={p}::kind drift: {data['kind']}")
                  fail += 1
              if data["mode"] != "pre-activation-probe":
                  print(f"::error file={p}::mode drift: {data['mode']}")
                  fail += 1
              if data["verdict"] not in ("PROBE-READY", "PROBE-DEFECT"):
                  print(f"::error file={p}::verdict literal drift: {data['verdict']}")
                  fail += 1
              if data["ar_authorisation_required"] is not True:
                  print(f"::error file={p}::ar_authorisation_required must be true")
                  fail += 1
              if set(data["stages"].keys()) != stage_keys:
                  print(f"::error file={p}::stages key drift: {set(data['stages'].keys()) ^ stage_keys}")
                  fail += 1
              print(f"{p.name}: shape OK, verdict={data['verdict']}")
          sys.exit(0 if fail == 0 else 1)
          PY

      - name: Stage 3 — Aggregate verdict
        id: stage3
        shell: bash
        run: |
          set -u
          aggregate="$(python3 - <<'PY'
          import json, pathlib
          per = []
          all_ready = True
          for p in sorted(pathlib.Path("out/probe-verdicts").glob("*.json")):
              data = json.loads(p.read_text(encoding="utf-8"))
              per.append((p.name, data["verdict"]))
              if data["verdict"] != "PROBE-READY":
                  all_ready = False
          print("PROBE-READY" if all_ready else "PROBE-DEFECT")
          PY
          )"
          echo "aggregate=${aggregate}" >> "$GITHUB_OUTPUT"
          {
            echo "# OTS Pre-Anchor Activation Probe (Tag-59)"
            echo
            echo "**Aggregate verdict:** \`${aggregate}\`"
            echo
            echo "| Manifest | Verdict |"
            echo "| --- | --- |"
            for f in out/probe-verdicts/*.json; do
              name="$(basename "${f}" .json)"
              v="$(python3 -c 'import sys, json; print(json.load(open(sys.argv[1]))["verdict"])' "${f}")"
              echo "| \`${name}\` | \`${v}\` |"
            done
            echo
            echo "See \`docs/operations/manifest-hash-ots-anchor-wiring.md\` §6 / §7."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ots-pre-anchor-activation-probe: aggregate=${aggregate}"

      - name: Run hermetic Tag-59 test-suite
        run: |
          set -eu
          python3 -m pytest tests/ci/test_ots_pre_anchor_activation_probe_tag59.py -v

      - name: Stage 3 — Enforce aggregate verdict
        shell: bash
        run: |
          set -u
          verdict="${{ steps.stage3.outputs.aggregate }}"
          enforce="${PROBE_ENFORCE}"
          echo "ots-pre-anchor-activation-probe: aggregate=${verdict} enforce=${enforce}"
          if [ "${enforce}" = "true" ] && [ "${verdict}" = "PROBE-DEFECT" ]; then
            echo "::error::OTS pre-anchor activation probe verdict is PROBE-DEFECT. Refusing to merge — see job summary."
            exit 1
          fi
          if [ "${verdict}" = "PROBE-DEFECT" ]; then
            echo "::warning::OTS pre-anchor activation probe is DEFECT — running audit-only."
          else
            echo "OTS pre-anchor activation probe READY (AR-authorisation gate next; see runbook §7)."
          fi
