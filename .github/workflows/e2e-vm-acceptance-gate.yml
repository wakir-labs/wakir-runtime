#
# End-to-End disposable-VM Acceptance-Gate CI lane.
# ========================================================================
#
# Purpose: prove that the acceptance-gate harness
# (`infra/test-e2e/vm-lifecycle-harness/`) correctly grades a Federation-
# Server live-substrate bring-up and surfaces the 2026-05-13 substance-bug
# vectors as structured signal. Closes the sandbox-hermetic-test gap
# documented in `feedback_live_bringup_sandbox_gap.md`.
#
# One lane
# --------
# `harness-logic` (every PR, always runs):
#    Hermetic Python suite `tests/infra/test_vm_e2e_acceptance_gate.py`.
#    Proves the gate grades correctly given synthetic smoke JSON + log
#    fixtures. NO real VM. Sandbox-safe per ADR-0051.
#
# The withdrawn second lane
# -------------------------
# This workflow used to carry a second job that booted a disposable
# Fedora-CoreOS VM and graded a full bring-up. It required a
# self-hosted runner carrying a nested-KVM label. No runner ever
# carried that label, and none exists: the job could not be scheduled
# at all, so it stood at `skipping` on every pull request while this
# workflow went on reporting `success` from the hermetic job alone.
# A gate whose runner does not exist reports success for something
# that never happened, so it was withdrawn under ADR-0077.
#
# Live bring-up evidence comes from the operator-hand run on the
# substrate node — `scripts/federation-live-vm-acceptance.sh`, driven
# per `docs/test-plans/phase-2-live-vm-acceptance.md`. That is the
# one path that has produced live evidence, and it is now named as
# the one path rather than as one of three.
#
# Trigger surface
# ---------------
# - PR or push touching the bootstrap script,
# - PR or push touching SPIRE-federation/agent Quadlet templates,
# - PR or push touching the smoke binary,
# - PR or push touching the harness or its tests,
# - Manual dispatch (no inputs; the lane is hermetic).
#
# Cross-Review Zone N (QA × internal audit)
# ---------------------------------------
# Harness-logic-lane evidence is audit-grade (deterministic, signed by
# GH-Actions) and says one thing: the gate grades correctly. It says
# nothing about whether a bring-up passed. The internal-audit sample
# for "did the Pilot-VM bring-up actually pass acceptance this run" is
# the operator-hand run's own log and verdict artefacts, not anything
# this workflow produces.

name: e2e-vm-acceptance-gate

# YAML key-quoting hygiene note:
# The bare key `on:` is a YAML 1.1 reserved-word that some safe-mode
# YAML parsers resolve as the boolean `True` instead of the string
# `"on"`. GitHub Actions itself parses YAML 1.2-style and tolerates
# the bare form, but external linters (and any python-yaml-based
# pre-merge check) flag it. We quote the key defensively so both
# resolver-paths agree.
"on":
  push:
    branches:
      - main
    paths:
      - 'infra/spire/federation/wakir-pilot-bootstrap.sh'
      - 'infra/spire/federation/quadlet/**'
      - 'infra/spire/agent/quadlet/**'
      - 'quadlet/wakir-nats-kv-bucket-init.container'
      - 'bin/proxmox-bringup-smoke'
      - 'infra/test-e2e/vm-lifecycle-harness/**'
      - 'tests/infra/test_vm_e2e_acceptance_gate.py'
      - '.github/workflows/e2e-vm-acceptance-gate.yml'
  pull_request:
    paths:
      - 'infra/spire/federation/wakir-pilot-bootstrap.sh'
      - 'infra/spire/federation/quadlet/**'
      - 'infra/spire/agent/quadlet/**'
      - 'quadlet/wakir-nats-kv-bucket-init.container'
      - 'bin/proxmox-bringup-smoke'
      - 'infra/test-e2e/vm-lifecycle-harness/**'
      - 'tests/infra/test_vm_e2e_acceptance_gate.py'
      - '.github/workflows/e2e-vm-acceptance-gate.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:

  harness-logic:
    name: Harness-logic — hermetic gate grading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run harness-logic suite
        run: |
          python -m pytest \
            tests/infra/test_vm_e2e_acceptance_gate.py \
            -v --color=yes

      - name: Static-check shell scripts (shellcheck — non-blocking)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning \
              infra/test-e2e/vm-lifecycle-harness/*.sh || \
              echo "::warning::shellcheck found issues (non-blocking)"
          else
            sudo apt-get install -y shellcheck
            shellcheck -S warning \
              infra/test-e2e/vm-lifecycle-harness/*.sh || \
              echo "::warning::shellcheck found issues (non-blocking)"
          fi
