# SPDX-License-Identifier: Apache-2.0
#
# Tag-76 Cross-Welle-Stability-Pin (Amara, Continuous-Mode)
# ----------------------------------------------------------
#
# Hermetic Phase-3c-Marathon-Closeout cross-Welle aggregator that
# bundles the seven per-Welle-Integration-Smoke verdicts (Welle-1
# through Welle-7) plus an explicit Cross-Welle-Cascade-Verifikation
# into a single CROSS-WELLE-STABILITY-INTACT / -DRIFT / -DEFECT
# verdict. Verifies the Forward-Block-Pattern (per-Welle
# downstream_cascade tuples match the canonical FORWARD_CASCADE_
# TOPOLOGY), the Reverse-Block-Pattern (no upstream entries in any
# forward-block-set), and the Doppel-Welle-Symmetry discipline
# ((1,2) audit-anchor-only empty tuples; (4,5) asymmetric one-way
# upstream-to-downstream; (6,7) symmetric PAR-path coupling).
#
# Anchors
# -------
#
#   * docs/quality-gates/pre-cutover-acceptance-run-order.md §3
#     -- seven Welle-Datumsanker (cross-Welle sequencing contract).
#   * docs/quality-gates/phase-3-marathon-anti-patterns.md §AP-9
#     -- Welle-3-Rollback-Cascade anchor (3, 4, 5, 6, 7).
#   * decisions/0066-marathon-cadence-vier-wochen.md §Beschluss
#     -- Doppel-Welle PAR-path discipline (1,2), (4,5), (6,7).
#
# Stages
# ------
#
#   * Stage 1 -- Welle-1 Integration-Smoke envelope (audit-anchor-
#                derived stand-in, Tag-69 Tomas+Selin)
#   * Stage 2 -- Welle-2 Integration-Smoke envelope (audit-anchor-
#                derived stand-in, Tag-70 Tomas+Selin)
#   * Stage 3 -- Welle-3 Integration-Smoke envelope (Tag-71 Amara
#                canonical aggregator)
#   * Stage 4 -- Welle-4 Integration-Smoke envelope (Tag-72 Amara
#                canonical aggregator)
#   * Stage 5 -- Welle-5 Integration-Smoke envelope (Tag-73 Amara
#                canonical aggregator)
#   * Stage 6 -- Welle-6 Integration-Smoke envelope (Tag-74 Amara
#                canonical aggregator)
#   * Stage 7 -- Welle-7 Integration-Smoke envelope (Tag-75 Amara
#                canonical aggregator; terminal Welle, Final-
#                Sealing)
#   * Stage 8 -- Cross-Welle-Cascade-Verifikation (Tag-76
#                distinctive: Forward-Block + Reverse-Block +
#                Doppel-Welle-Symmetry verifier)
#   * Stage 9 -- Aggregate CROSS-WELLE-STABILITY verdict
#
# Brief-vs-canonical reconciliation (Tag-71+72+73+74+75 lehre)
# ------------------------------------------------------------
#
# The Tag-76 brief was largely canonical-aligned. Three reconciliations
# surface for the audit trail:
#
#   * Brief framing: "die 7 Welle-Integration-Smokes". Canonical:
#     five integration-smoke aggregators exist on main as of Tag-76
#     (Welle-3..Welle-7 = Tag-71..Tag-75); Welle-1 (Tag-69) and
#     Welle-2 (Tag-70) carry audit-anchor wiring only. The aggregator
#     accepts seven envelopes for completeness and flags Welle-1+2
#     envelopes as audit-anchor-derived stand-ins on the envelope.
#   * Brief: "Cascade-Topologie per phase-3-marathon-anti-patterns.md
#     AP-9". Canonical: AP-9 is the Welle-3-specific (3,4,5,6,7)
#     forward-block anchor; Welle-4..7 forward-block-sets derive
#     from Doppel-Welle PAR-path discipline + per-Welle aggregator
#     pins. All seven tuples surface in forward_cascade_topology.
#   * Brief: "ADR-0066 Marathon-Cadence". Canonical: ADR-0066 §Beschluss
#     is the Doppel-Welle PAR-path authority for (1,2), (4,5), (6,7)
#     pairings; the symmetric-coupling discipline for (6,7) and the
#     asymmetric upstream-to-downstream coupling for (4,5) anchor here.
#
# Sandbox boundary (ADR-0034, feedback_sandbox_host_trennung.md)
# --------------------------------------------------------------
#
# This workflow is hermetic. It does NOT trigger the seven underlying
# Welle-N-Integration-Smoke workflows via gh workflow run; it does
# NOT POST to ntfy.sh; it does NOT touch the live-VM substrate.
# The simulation is built from stdlib-only helpers + on-disk
# synthetic per-Welle verdict envelopes assembled inside the GitHub
# Actions sandbox. The actual cross-Welle dispatch on the Marathon
# Cutover-Mittwoche (2026-06-10 / 06-17 / 06-24 / 07-01) is operator-
# hand.
#
# Decision shape
# --------------
#
# Stages emit per-stage verdict envelopes consumed by
# tooling/ci/aggregate_cross_welle_stability.py:
#
#   * WELLE-N-INTACT      -> green contribution (per-Welle)
#   * WELLE-N-DRIFT       -> yellow contribution
#   * WELLE-N-DEFECT      -> red contribution
#   * CASCADE-PATTERN-CONSISTENT -> green (cascade)
#   * CASCADE-PATTERN-PARTIAL    -> yellow (cascade)
#   * CASCADE-PATTERN-BROKEN     -> red (cascade)
#
# Any red collapses to CROSS-WELLE-STABILITY-DEFECT.
# Any yellow with zero red degrades to CROSS-WELLE-STABILITY-DRIFT.
# All green yields CROSS-WELLE-STABILITY-INTACT.
#
# Trigger surface
# ---------------
#
#   * workflow_dispatch -- manual probe for the marathon-team.
#   * pull_request -- runs on changes to the workflow itself, its
#     aggregator, or its tests.
#   * push (path-filtered) on changes to the same trio.
#
# Continuous-Mode (Mira, 2026-05-19)
# ----------------------------------
#
# Per feedback_continuous_mode_keine_pause_frage.md the workflow
# runs to completion on its own without per-stage approvals; per
# feedback_continuous_mode_keine_push_frage.md the merge of this
# PR is part of the Tag-76 Marathon-Closeout substrate-set and
# happens automatically.
#
# Not a required status check
# ---------------------------
#
# Per feedback_branch_protection_check_names.md this workflow is
# NOT listed as a required status check. It is a cross-Welle
# integration-smoke aggregator; the underlying Welle-N substrate
# workflows are the substrate gates.

name: cross-welle-stability-pin

on:
  workflow_dispatch:
    inputs:
      drift_inject:
        description: "Inject DRIFT verdict on stage (none|welle_1|welle_2|welle_3|welle_4|welle_5|welle_6|welle_7|cascade)"
        required: false
        default: "none"
      defect_inject:
        description: "Inject DEFECT verdict on stage (none|welle_1|welle_2|welle_3|welle_4|welle_5|welle_6|welle_7|cascade)"
        required: false
        default: "none"
  pull_request:
    paths:
      - ".github/workflows/cross-welle-stability-pin.yml"
      - "tooling/ci/aggregate_cross_welle_stability.py"
      - "tests/ci/test_cross_welle_stability_tag76.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cross-welle-stability-pin.yml"
      - "tooling/ci/aggregate_cross_welle_stability.py"
      - "tests/ci/test_cross_welle_stability_tag76.py"

permissions:
  contents: read

concurrency:
  group: cross-welle-stability-pin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-welle-stability-pin:
    name: Cross-Welle-Stability-Pin (hermetic)
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.aggregate.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare hermetic substrate working dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/stages
          mkdir -p out/aggregate
          echo "Tag-76 Cross-Welle-Stability-Pin staging dirs ready."

      - name: Stage 1 -- Welle-1 Integration-Smoke envelope (Tag-69 stand-in)
        id: stage1
        shell: bash
        env:
          DRIFT_INJECT: ${{ inputs.drift_inject }}
          DEFECT_INJECT: ${{ inputs.defect_inject }}
        run: |
          set -euo pipefail
          verdict="WELLE-1-INTACT"
          if [[ "${DRIFT_INJECT,,}" == "welle_1" ]]; then
            verdict="WELLE-1-DRIFT"
            echo "::warning::drift_inject=welle_1; forced WELLE-1-DRIFT"
          fi
          if [[ "${DEFECT_INJECT,,}" == "welle_1" ]]; then
            verdict="WELLE-1-DEFECT"
            echo "::warning::defect_inject=welle_1; forced WELLE-1-DEFECT"
          fi
          python3 - <<PY > out/stages/welle-1-envelope.json
          import json, datetime
          env = {
              "schema_version": 1,
              "stage": "welle_1_integration_smoke",
              "tag": "tag-76",
              "substrate_origin": "tag-69-audit-anchor-stand-in",
              "verdict": "$verdict",
              "downstream_cascade": {
                  "blocked_wellen_on_defect": [],
                  "note": "Welle-1 audit-anchor-only stand-in; no cascade"
              },
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Stage-1 Welle-1 verdict: $verdict"

      - name: Stage 2 -- Welle-2 Integration-Smoke envelope (Tag-70 stand-in)
        id: stage2
        shell: bash
        env:
          DRIFT_INJECT: ${{ inputs.drift_inject }}
          DEFECT_INJECT: ${{ inputs.defect_inject }}
        run: |
          set -euo pipefail
          verdict="WELLE-2-INTACT"
          if [[ "${DRIFT_INJECT,,}" == "welle_2" ]]; then
            verdict="WELLE-2-DRIFT"
            echo "::warning::drift_inject=welle_2; forced WELLE-2-DRIFT"
          fi
          if [[ "${DEFECT_INJECT,,}" == "welle_2" ]]; then
            verdict="WELLE-2-DEFECT"
            echo "::warning::defect_inject=welle_2; forced WELLE-2-DEFECT"
          fi
          python3 - <<PY > out/stages/welle-2-envelope.json
          import json, datetime
          env = {
              "schema_version": 1,
              "stage": "welle_2_integration_smoke",
              "tag": "tag-76",
              "substrate_origin": "tag-70-audit-anchor-stand-in",
              "verdict": "$verdict",
              "downstream_cascade": {
                  "blocked_wellen_on_defect": [],
                  "note": "Welle-2 audit-anchor-only stand-in; no cascade"
              },
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Stage-2 Welle-2 verdict: $verdict"

      - name: Stage 3 -- Welle-3 Integration-Smoke envelope (Tag-71 canonical)
        id: stage3
        shell: bash
        env:
          DRIFT_INJECT: ${{ inputs.drift_inject }}
          DEFECT_INJECT: ${{ inputs.defect_inject }}
        run: |
          set -euo pipefail
          verdict="WELLE-3-INTACT"
          if [[ "${DRIFT_INJECT,,}" == "welle_3" ]]; then
            verdict="WELLE-3-DRIFT"
          fi
          if [[ "${DEFECT_INJECT,,}" == "welle_3" ]]; then
            verdict="WELLE-3-DEFECT"
          fi
          python3 - <<PY > out/stages/welle-3-envelope.json
          import json, datetime
          env = {
              "schema_version": 1,
              "stage": "welle_3_integration_smoke",
              "tag": "tag-76",
              "substrate_origin": "tag-71-amara-canonical-aggregator",
              "verdict": "$verdict",
              "downstream_cascade": {
                  "blocked_wellen_on_defect": [3, 4, 5, 6, 7],
                  "note": "Welle-3 Bridge-Audit-Writer rollback cascades per AP-9"
              },
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Stage-3 Welle-3 verdict: $verdict"

      - name: Stage 4 -- Welle-4 Integration-Smoke envelope (Tag-72 canonical)
        id: stage4
        shell: bash
        env:
          DRIFT_INJECT: ${{ inputs.drift_inject }}
          DEFECT_INJECT: ${{ inputs.defect_inject }}
        run: |
          set -euo pipefail
          verdict="WELLE-4-INTACT"
          if [[ "${DRIFT_INJECT,,}" == "welle_4" ]]; then
            verdict="WELLE-4-DRIFT"
          fi
          if [[ "${DEFECT_INJECT,,}" == "welle_4" ]]; then
            verdict="WELLE-4-DEFECT"
          fi
          python3 - <<PY > out/stages/welle-4-envelope.json
          import json, datetime
          env = {
              "schema_version": 1,
              "stage": "welle_4_integration_smoke",
              "tag": "tag-76",
              "substrate_origin": "tag-72-amara-canonical-aggregator",
              "verdict": "$verdict",
              "downstream_cascade": {
                  "blocked_wellen_on_defect": [4, 5, 6, 7],
                  "note": "Welle-4 Doppel-Welle-4+5 + downstream cascade"
              },
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Stage-4 Welle-4 verdict: $verdict"

      - name: Stage 5 -- Welle-5 Integration-Smoke envelope (Tag-73 canonical)
        id: stage5
        shell: bash
        env:
          DRIFT_INJECT: ${{ inputs.drift_inject }}
          DEFECT_INJECT: ${{ inputs.defect_inject }}
        run: |
          set -euo pipefail
          verdict="WELLE-5-INTACT"
          if [[ "${DRIFT_INJECT,,}" == "welle_5" ]]; then
            verdict="WELLE-5-DRIFT"
          fi
          if [[ "${DEFECT_INJECT,,}" == "welle_5" ]]; then
            verdict="WELLE-5-DEFECT"
          fi
          python3 - <<PY > out/stages/welle-5-envelope.json
          import json, datetime
          env = {
              "schema_version": 1,
              "stage": "welle_5_integration_smoke",
              "tag": "tag-76",
              "substrate_origin": "tag-73-amara-canonical-aggregator",
              "verdict": "$verdict",
              "downstream_cascade": {
                  "blocked_wellen_on_defect": [5, 6, 7],
                  "note": "Welle-5 asymmetric: does NOT cascade backwards to Welle-4"
              },
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Stage-5 Welle-5 verdict: $verdict"

      - name: Stage 6 -- Welle-6 Integration-Smoke envelope (Tag-74 canonical)
        id: stage6
        shell: bash
        env:
          DRIFT_INJECT: ${{ inputs.drift_inject }}
          DEFECT_INJECT: ${{ inputs.defect_inject }}
        run: |
          set -euo pipefail
          verdict="WELLE-6-INTACT"
          if [[ "${DRIFT_INJECT,,}" == "welle_6" ]]; then
            verdict="WELLE-6-DRIFT"
          fi
          if [[ "${DEFECT_INJECT,,}" == "welle_6" ]]; then
            verdict="WELLE-6-DEFECT"
          fi
          python3 - <<PY > out/stages/welle-6-envelope.json
          import json, datetime
          env = {
              "schema_version": 1,
              "stage": "welle_6_integration_smoke",
              "tag": "tag-76",
              "substrate_origin": "tag-74-amara-canonical-aggregator",
              "verdict": "$verdict",
              "downstream_cascade": {
                  "blocked_wellen_on_defect": [6, 7],
                  "note": "Welle-6 Doppel-Welle-6+7 PAR-path symmetric coupling"
              },
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Stage-6 Welle-6 verdict: $verdict"

      - name: Stage 7 -- Welle-7 Integration-Smoke envelope (Tag-75 canonical, terminal)
        id: stage7
        shell: bash
        env:
          DRIFT_INJECT: ${{ inputs.drift_inject }}
          DEFECT_INJECT: ${{ inputs.defect_inject }}
        run: |
          set -euo pipefail
          verdict="WELLE-7-INTACT"
          if [[ "${DRIFT_INJECT,,}" == "welle_7" ]]; then
            verdict="WELLE-7-DRIFT"
          fi
          if [[ "${DEFECT_INJECT,,}" == "welle_7" ]]; then
            verdict="WELLE-7-DEFECT"
          fi
          python3 - <<PY > out/stages/welle-7-envelope.json
          import json, datetime
          env = {
              "schema_version": 1,
              "stage": "welle_7_integration_smoke",
              "tag": "tag-76",
              "substrate_origin": "tag-75-amara-canonical-aggregator-terminal-final-sealing",
              "verdict": "$verdict",
              "downstream_cascade": {
                  "blocked_wellen_on_defect": [6, 7],
                  "note": "Welle-7 terminal; PAR-path symmetric with Welle-6"
              },
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Stage-7 Welle-7 verdict: $verdict"

      - name: Stage 8 -- Cross-Welle-Cascade-Verifikation (Tag-76 distinctive)
        id: stage8
        shell: bash
        env:
          DRIFT_INJECT: ${{ inputs.drift_inject }}
          DEFECT_INJECT: ${{ inputs.defect_inject }}
        run: |
          set -euo pipefail
          # Stage-8 derives the cascade-pattern verdict from the
          # seven per-Welle envelopes assembled in Stages 1-7. The
          # aggregator helper synthesises this in-memory; the stage
          # writes an explicit envelope to disk for artifact-capture
          # and per-stage transparency.
          python3 - <<'PY' > out/stages/cascade-verification-envelope.json
          import json, datetime, importlib.util, pathlib

          spec = importlib.util.spec_from_file_location(
              "agg_cross_tag76",
              "tooling/ci/aggregate_cross_welle_stability.py",
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          envelopes = {}
          for n in range(1, 8):
              p = pathlib.Path(f"out/stages/welle-{n}-envelope.json")
              envelopes[f"welle_{n}_integration_smoke"] = json.loads(p.read_text())

          verdict, notes = mod.derive_cascade_pattern_verdict(envelopes)

          env = {
              "schema_version": 1,
              "stage": "cross_welle_cascade_verification",
              "tag": "tag-76",
              "substrate": "amara-tag-76-cross-welle-cascade-pattern-verifier",
              "verdict": verdict,
              "notes": notes,
              "anchor_doc": (
                  "docs/quality-gates/phase-3-marathon-anti-patterns.md "
                  "AP-9 + decisions/0066-*.md Beschluss"
              ),
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
          base_verdict=$(python3 -c "import json; print(json.load(open('out/stages/cascade-verification-envelope.json'))['verdict'])")
          verdict="$base_verdict"
          if [[ "${DRIFT_INJECT,,}" == "cascade" ]]; then
            verdict="CASCADE-PATTERN-PARTIAL"
            python3 - <<PY > out/stages/cascade-verification-envelope.json
          import json, datetime
          env = {
              "schema_version": 1,
              "stage": "cross_welle_cascade_verification",
              "tag": "tag-76",
              "substrate": "amara-tag-76-cross-welle-cascade-pattern-verifier",
              "verdict": "$verdict",
              "notes": ["drift_inject=cascade forced CASCADE-PATTERN-PARTIAL"],
              "anchor_doc": "docs/quality-gates/phase-3-marathon-anti-patterns.md AP-9 + decisions/0066-*.md Beschluss",
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
            echo "::warning::drift_inject=cascade; forced CASCADE-PATTERN-PARTIAL"
          fi
          if [[ "${DEFECT_INJECT,,}" == "cascade" ]]; then
            verdict="CASCADE-PATTERN-BROKEN"
            python3 - <<PY > out/stages/cascade-verification-envelope.json
          import json, datetime
          env = {
              "schema_version": 1,
              "stage": "cross_welle_cascade_verification",
              "tag": "tag-76",
              "substrate": "amara-tag-76-cross-welle-cascade-pattern-verifier",
              "verdict": "$verdict",
              "notes": ["defect_inject=cascade forced CASCADE-PATTERN-BROKEN"],
              "anchor_doc": "docs/quality-gates/phase-3-marathon-anti-patterns.md AP-9 + decisions/0066-*.md Beschluss",
              "emitted_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          print(json.dumps(env, indent=2, sort_keys=True))
          PY
            echo "::warning::defect_inject=cascade; forced CASCADE-PATTERN-BROKEN"
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Stage-8 cascade-verification verdict: $verdict"

      - name: Stage 9 -- Aggregate CROSS-WELLE-STABILITY verdict
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/ci/aggregate_cross_welle_stability.py \
            --welle-1-envelope    out/stages/welle-1-envelope.json \
            --welle-2-envelope    out/stages/welle-2-envelope.json \
            --welle-3-envelope    out/stages/welle-3-envelope.json \
            --welle-4-envelope    out/stages/welle-4-envelope.json \
            --welle-5-envelope    out/stages/welle-5-envelope.json \
            --welle-6-envelope    out/stages/welle-6-envelope.json \
            --welle-7-envelope    out/stages/welle-7-envelope.json \
            --cascade-envelope    out/stages/cascade-verification-envelope.json \
            --iso-week            24 \
            --github-run-id       "${GITHUB_RUN_ID:-}" \
            --github-sha          "${GITHUB_SHA:-}" \
            --github-ref          "${GITHUB_REF:-}" \
            --output              out/aggregate/cross-welle-stability-verdict.json
          verdict=$(python3 -c "import json; print(json.load(open('out/aggregate/cross-welle-stability-verdict.json'))['verdict'])")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo "## Tag-76 Cross-Welle-Stability-Pin"
            echo ""
            echo "**Aggregated verdict:** \`$verdict\`"
            echo ""
            echo "**Per-stage verdicts:**"
            echo ""
            echo "- Stage 1 (Welle-1 Integration-Smoke, Tag-69 stand-in): \`${{ steps.stage1.outputs.verdict }}\`"
            echo "- Stage 2 (Welle-2 Integration-Smoke, Tag-70 stand-in): \`${{ steps.stage2.outputs.verdict }}\`"
            echo "- Stage 3 (Welle-3 Integration-Smoke, Tag-71): \`${{ steps.stage3.outputs.verdict }}\`"
            echo "- Stage 4 (Welle-4 Integration-Smoke, Tag-72): \`${{ steps.stage4.outputs.verdict }}\`"
            echo "- Stage 5 (Welle-5 Integration-Smoke, Tag-73): \`${{ steps.stage5.outputs.verdict }}\`"
            echo "- Stage 6 (Welle-6 Integration-Smoke, Tag-74): \`${{ steps.stage6.outputs.verdict }}\`"
            echo "- Stage 7 (Welle-7 Integration-Smoke, Tag-75 terminal): \`${{ steps.stage7.outputs.verdict }}\`"
            echo "- Stage 8 (Cross-Welle-Cascade-Verifikation, Tag-76 distinctive): \`${{ steps.stage8.outputs.verdict }}\`"
            echo ""
            echo "<details><summary>Cross-Welle-Stability envelope JSON</summary>"
            echo ""
            echo '```json'
            cat out/aggregate/cross-welle-stability-verdict.json
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Cross-Welle-Stability verdict envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-welle-stability-verdict
          path: out/aggregate/cross-welle-stability-verdict.json
          if-no-files-found: warn

      - name: Upload per-stage envelopes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-welle-stability-stages
          path: out/stages/
          if-no-files-found: warn

      - name: Terminal-status gate
        shell: bash
        run: |
          set -euo pipefail
          verdict="${{ steps.aggregate.outputs.verdict }}"
          case "$verdict" in
            CROSS-WELLE-STABILITY-INTACT)
              echo "Tag-76 Cross-Welle-Stability-Pin INTACT (all seven Wellen green + cascade-pattern consistent)"
              ;;
            CROSS-WELLE-STABILITY-DRIFT)
              echo "::warning::Tag-76 Cross-Welle-Stability-Pin DRIFT (operator-hand reads per-stage notes before next live Welle trigger)"
              ;;
            CROSS-WELLE-STABILITY-DEFECT)
              echo "::error::Tag-76 Cross-Welle-Stability-Pin DEFECT (per-Welle red OR envelope missing OR cascade-pattern broken)"
              exit 1
              ;;
            *)
              echo "::error::unknown verdict: $verdict"
              exit 1
              ;;
          esac
