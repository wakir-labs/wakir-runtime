# SPDX-License-Identifier: Apache-2.0
#
# Tag-67 Watch-Day Pre-Cutover Live-Smoke / Noa-SRE
# ---------------------------------------------------------------------------
#
# Pre-KW-24 hermetic End-to-End Pre-Cutover probe that runs the entire
# Watch-Day Coupling-Map Tag-54..66 in sequence and emits a single
# tri-state verdict:
#
#     LIVE-SMOKE-INTACT  -- all six stages green.
#     DRIFT              -- 1..2 stages yellow, none red.
#     DEFECT             -- any stage red, or >=3 stages yellow.
#
# Substrate provenance (single-sourced in
# tooling/ci/aggregate_watch_day_pre_cutover_live_smoke.py
# SUBSTRATE_INVENTORY):
#
#     Tag-56  Watch-Day-Practice-Run CI-Gate
#             (phase-3c-watch-day-practice-run)
#     Tag-57  Cron-Pre-Fire Probe
#             (watch-day-cron-pre-fire-probe)
#     Tag-59  Replay Workflow
#             (watch-day-practice-run-replay)
#     Tag-61  Multi-Sample Replay extension
#     Tag-62  Operator-Trigger Pipeline
#             (watch-day-operator-trigger-simulation)
#     Tag-63  Operator-Trigger + Alert-Routing Integration
#             (operator-trigger-alert-routing-integration)
#     Tag-66  Audit-Trail Verifier
#             (watch-day-operator-trigger-audit-trail-verify)
#
# Six-stage layout
# ----------------
#
#     Stage 1  Practice-Run CI-Gate                       (Tag-56)
#     Stage 2  Cron-Pre-Fire Probe                        (Tag-57)
#     Stage 3  Replay Multi-Sample                        (Tag-59+61)
#     Stage 4  Operator-Trigger Integration               (Tag-62+63)
#     Stage 5  Audit-Trail Verify                         (Tag-66)
#     Stage 6  Substrate Coupling-Map cross-check         (Tag-67)
#
# Each stage runs the per-tag helper in pin/replay/coupling-map mode.
# No actual deployment, no actual cron-scheduling, no actual operator
# dispatch -- hermetic.
#
# Author: Noa Bergstroem (SRE)
# Anchor: Tag-67 Marathon-Continuous-Mode Pre-KW-24 Pre-Cutover Probe.

name: watch-day-pre-cutover-live-smoke

on:
  workflow_dispatch:
    inputs:
      diagnostic_marker:
        description: "free-form diagnostic marker for the run"
        required: false
        default: "tag-67-live-smoke"
  pull_request:
    paths:
      - ".github/workflows/watch-day-pre-cutover-live-smoke.yml"
      - ".github/workflows/phase-3c-watch-day-practice-run.yml"
      - ".github/workflows/watch-day-cron-pre-fire-probe.yml"
      - ".github/workflows/watch-day-practice-run-replay.yml"
      - ".github/workflows/watch-day-operator-trigger-simulation.yml"
      - ".github/workflows/operator-trigger-alert-routing-integration.yml"
      - ".github/workflows/watch-day-operator-trigger-audit-trail-verify.yml"
      - "tooling/ci/aggregate_watch_day_pre_cutover_live_smoke.py"
      - "tooling/ci/aggregate_watch_day_practice_run_verdict.py"
      - "tooling/ci/verify_watch_day_cron_pre_fire_readiness.py"
      - "tooling/ci/simulate_watch_day_operator_trigger.py"
      - "tooling/ci/verify_watch_day_operator_trigger_audit_trail.py"
      - "tests/observability/test_watch_day_live_smoke_tag67.py"

permissions:
  contents: read

jobs:
  pre-cutover-live-smoke:
    name: pre-cutover-live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------------------------------------------
      # Stage 1 -- Tag-56 Practice-Run CI-Gate aggregator (aggregate-
      # mode with synthetic all-green env to verify the helper itself
      # still emits READY shape; hermetic).
      # ----------------------------------------------------------------
      - name: Stage 1 - practice-run-ci-gate (Tag-56)
        id: stage1
        env:
          STEP1_STATUS: green
          STEP2_STATUS: green
          STEP3_STATUS: green
          STEP4_STATUS: green
        run: |
          set -e
          python tooling/ci/aggregate_watch_day_practice_run_verdict.py \
            --mode aggregate --output stage1_verdict.json
          verdict=$(python -c "import json;print(json.load(open('stage1_verdict.json'))['verdict'])")
          echo "stage1_verdict=$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = "READY" ]; then
            echo "STAGE1_STATUS=green" >> "$GITHUB_ENV"
          elif [ "$verdict" = "CAUTION" ]; then
            echo "STAGE1_STATUS=yellow" >> "$GITHUB_ENV"
          else
            echo "STAGE1_STATUS=red" >> "$GITHUB_ENV"
          fi

      # ----------------------------------------------------------------
      # Stage 2 -- Tag-57 Cron-Pre-Fire readiness pin (hermetic; no
      # actual cron scheduling). Tag-68 helper-surface-drift-fix:
      # the helper's CLI surface uses ``--mode {all,cron,paths,
      # routing}``; the prior ``--mode pin`` invocation was a drift
      # that the Tag-67 Live-Smoke surfaced as a hidden Stage-2
      # regression. The ``all`` mode runs the full readiness pin
      # (cron + paths + routing), which is what the workflow comment
      # ("readiness pin") already promised.
      # ----------------------------------------------------------------
      - name: Stage 2 - cron-pre-fire-probe (Tag-57)
        id: stage2
        continue-on-error: true
        run: |
          set +e
          python tooling/ci/verify_watch_day_cron_pre_fire_readiness.py \
            --mode all
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "STAGE2_STATUS=green" >> "$GITHUB_ENV"
          elif [ $rc -eq 2 ]; then
            echo "STAGE2_STATUS=yellow" >> "$GITHUB_ENV"
          else
            echo "STAGE2_STATUS=red" >> "$GITHUB_ENV"
          fi

      # ----------------------------------------------------------------
      # Stage 3 -- Tag-59+61 Replay Multi-Sample. We re-run the
      # practice-run aggregator in replay-mode against the pinned
      # multi-sample fixture set. Tag-68 helper-surface-drift-fix:
      # the canonical fixture path is
      # ``tests/observability/fixtures/watch-day-practice-run-sample-
      # <set>.json`` (set in via Tag-59 PR + Tag-61 multi-sample
      # extension). The earlier Tag-67 draft probed a legacy path
      # ``tests/fixtures/observability/watch_day_practice_run_pinned.json``
      # which never existed in main -- that is the Stage-3-yellow
      # drift the Tag-67 Live-Smoke surfaced (PR #425). This step is
      # multi-path-aware: it tries the canonical path first, then the
      # legacy path, then falls back to yellow.
      # ----------------------------------------------------------------
      - name: Stage 3 - replay-multi-sample (Tag-59+61)
        id: stage3
        continue-on-error: true
        run: |
          set +e
          canonical_dir="tests/observability/fixtures"
          legacy_fixture="tests/fixtures/observability/watch_day_practice_run_pinned.json"
          # Prefer the canonical multi-sample green fixture (Tag-61
          # default; Tag-59 backwards-compatible). The aggregator
          # derives the fixture-path itself when --fixture-set is set,
          # but we pass --fixture-path explicitly so Stage 3 logs the
          # exact file the workflow probed (operator-debug surface).
          fixture=""
          if [ -f "${canonical_dir}/watch-day-practice-run-sample-green.json" ]; then
            fixture="${canonical_dir}/watch-day-practice-run-sample-green.json"
            fixture_set="green"
          elif [ -f "$legacy_fixture" ]; then
            fixture="$legacy_fixture"
            fixture_set="green"
          fi
          if [ -z "$fixture" ]; then
            # No fixture in any known path -- substrate present but
            # cannot replay (Tag-68 documented Stage-3-yellow case).
            echo "STAGE3_STATUS=yellow" >> "$GITHUB_ENV"
            echo "stage3_note=fixture-missing-in-canonical-and-legacy-paths" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tooling/ci/aggregate_watch_day_practice_run_verdict.py \
            --mode replay \
            --fixture-set "$fixture_set" \
            --fixture-path "$fixture"
          rc=$?
          echo "stage3_fixture_used=$fixture" >> "$GITHUB_OUTPUT"
          if [ $rc -eq 0 ]; then
            echo "STAGE3_STATUS=green" >> "$GITHUB_ENV"
          elif [ $rc -eq 2 ]; then
            echo "STAGE3_STATUS=yellow" >> "$GITHUB_ENV"
          else
            echo "STAGE3_STATUS=red" >> "$GITHUB_ENV"
          fi

      # ----------------------------------------------------------------
      # Stage 4 -- Tag-62+63 Operator-Trigger pipeline simulation. The
      # Tag-62 helper emits a canonical envelope; we read it and
      # ensure it has the canonical required-key-set. This is the
      # cross-substrate check (Tag-63 routes; Tag-62 emits).
      #
      # Tag-68 helper-surface-drift-fix: the helper's CLI surface uses
      # subcommands ``{pre-trigger, trigger, post-trigger, aggregate}``
      # (not ``--mode emit``). The trigger output wraps the dispatch
      # envelope under ``details.envelope`` (not at the top level).
      # Both prior drifts caused Stage-4-yellow in Tag-67 PR #425.
      # ----------------------------------------------------------------
      - name: Stage 4 - operator-trigger-integration (Tag-62+63)
        id: stage4
        continue-on-error: true
        run: |
          set +e
          python tooling/ci/simulate_watch_day_operator_trigger.py \
            trigger --output stage4_envelope.json
          rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then
            # rc 0 = green stage, rc 2 = yellow stage from the
            # Tag-62 helper itself; both produce a usable envelope.
            echo "STAGE4_STATUS=red" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ ! -f stage4_envelope.json ]; then
            echo "STAGE4_STATUS=red" >> "$GITHUB_ENV"
            exit 0
          fi
          python -c "
          import json, sys
          payload = json.load(open('stage4_envelope.json'))
          # Tag-68 fix: the dispatch envelope lives at
          # payload['details']['envelope'], not at the top level.
          envelope = payload.get('details', {}).get('envelope', {})
          required = {'event','workflow','ref','inputs'}
          if not required.issubset(envelope.keys()):
              sys.exit(2)
          "
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "STAGE4_STATUS=green" >> "$GITHUB_ENV"
          elif [ $rc -eq 2 ]; then
            echo "STAGE4_STATUS=yellow" >> "$GITHUB_ENV"
          else
            echo "STAGE4_STATUS=red" >> "$GITHUB_ENV"
          fi

      # ----------------------------------------------------------------
      # Stage 5 -- Tag-66 Audit-Trail Verifier. Runs the Tag-66
      # helper's catalog-conformance check (hermetic, no envelope
      # required; substrate-pin mode). Tag-68 helper-surface-drift-fix:
      # the helper's CLI surface uses subcommands (stage-1, stage-2,
      # stage-3, aggregate, full). Tag-67 PR #425 invoked
      # ``--mode catalog`` -- which did not resolve. The Tag-68 fix
      # adds an explicit ``catalog`` subcommand (aliasing stage-3
      # cross-substrate marker-reference check, semantically the
      # catalog conformance) AND a ``--mode catalog`` flag-shim so
      # this exact call resolves cleanly without changing the
      # workflow's invocation surface.
      # ----------------------------------------------------------------
      - name: Stage 5 - audit-trail-verify (Tag-66)
        id: stage5
        continue-on-error: true
        run: |
          set +e
          python tooling/ci/verify_watch_day_operator_trigger_audit_trail.py \
            --mode catalog
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "STAGE5_STATUS=green" >> "$GITHUB_ENV"
          elif [ $rc -eq 2 ]; then
            echo "STAGE5_STATUS=yellow" >> "$GITHUB_ENV"
          else
            # Helper exists but invocation failed -- red. Tag-68 fixed
            # the prior 'mode missing -> yellow' fallback because we
            # now own the 'catalog' mode and a hard error here is a
            # real substrate regression.
            echo "STAGE5_STATUS=red" >> "$GITHUB_ENV"
          fi

      # ----------------------------------------------------------------
      # Stage 6 -- Tag-67 Substrate Coupling-Map cross-check. The new
      # aggregator verifies every workflow + helper + test in the
      # Tag-54..66 inventory is physically present on disk.
      # ----------------------------------------------------------------
      - name: Stage 6 - substrate-coupling-map (Tag-67)
        id: stage6
        continue-on-error: true
        run: |
          set +e
          python tooling/ci/aggregate_watch_day_pre_cutover_live_smoke.py \
            pin-substrate --repo-root .
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "STAGE6_STATUS=green" >> "$GITHUB_ENV"
          elif [ $rc -eq 2 ]; then
            echo "STAGE6_STATUS=yellow" >> "$GITHUB_ENV"
          else
            echo "STAGE6_STATUS=red" >> "$GITHUB_ENV"
          fi

      # ----------------------------------------------------------------
      # Final -- aggregate verdict.
      # ----------------------------------------------------------------
      - name: Aggregate verdict
        id: verdict
        run: |
          set +e
          python tooling/ci/aggregate_watch_day_pre_cutover_live_smoke.py \
            aggregate --output live_smoke_verdict.json
          rc=$?
          verdict=$(python -c "import json;print(json.load(open('live_smoke_verdict.json'))['verdict'])")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo "## Tag-67 Watch-Day Pre-Cutover Live-Smoke"
            echo ""
            echo "**Verdict:** \`$verdict\`"
            echo ""
            echo "| Stage | Label | Status |"
            echo "|------:|-------|--------|"
            echo "| 1 | practice-run-ci-gate (Tag-56)      | $STAGE1_STATUS |"
            echo "| 2 | cron-pre-fire-probe (Tag-57)       | $STAGE2_STATUS |"
            echo "| 3 | replay-multi-sample (Tag-59+61)    | $STAGE3_STATUS |"
            echo "| 4 | operator-trigger-integration (62+63) | $STAGE4_STATUS |"
            echo "| 5 | audit-trail-verify (Tag-66)        | $STAGE5_STATUS |"
            echo "| 6 | substrate-coupling-map (Tag-67)    | $STAGE6_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Verdict is a Pre-Cutover signal, not a blocking gate.
          # The job succeeds as long as the probe substrate itself
          # functions (all six stage-helpers were invoked + the
          # aggregator emitted a well-formed envelope). The verdict
          # category (INTACT / DRIFT / DEFECT) drives the diagnostic
          # summary + the artifact -- Mira/AR can promote to blocking
          # later by failing this step on DEFECT.
          if [ "$verdict" != "LIVE-SMOKE-INTACT" ] \
             && [ "$verdict" != "DRIFT" ] \
             && [ "$verdict" != "DEFECT" ]; then
            # Probe substrate itself failed -- e.g. aggregator could
            # not parse env vars / emit envelope. That IS a blocker.
            exit 1
          fi
          exit 0

      - name: Upload verdict artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tag-67-live-smoke-verdict
          path: |
            live_smoke_verdict.json
            stage1_verdict.json
            stage4_envelope.json
          if-no-files-found: warn
