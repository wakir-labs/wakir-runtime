# SPDX-License-Identifier: Apache-2.0
#
# 15-Binary Image-Build-Reproducibility-Live-Test Daily Workflow (Tag-53, Kai)
# ----------------------------------------------------------------------------
#
# Purpose
# -------
#
# Tag-51 PR #328 (build-reproducibility-daily.yml) covers the
# *Cargo.lock derivation* axis: two in-process derivations of the
# build-graph produce byte-equal output. That is a property of the
# Python derivation script (no dict-ordering bug, no timestamp leak
# into a hash).
#
# This Tag-53 workflow covers the *image-build* axis: do two
# ``cargo build --release`` invocations against the same Cargo.lock
# produce byte-equal ELF binaries? That is a property of the Rust
# toolchain + workspace build-graph + environment surface (no
# clock-leak into ELF headers, no ``RUSTFLAGS`` drift, no
# ``CARGO_BUILD_JOBS``-dependent macro expansion).
#
# Both axes must be GREEN for the AR-Hand-Gate provenance bundle
# to attest end-to-end build-reproducibility.
#
# Daily schedule at 08:15 UTC -- offset by 30min after the Tag-51
# Cargo.lock-derivation audit at 07:45 UTC so an operator looking
# at both at the same time sees distinct, non-overlapping
# Job-Summary blocks.
#
# Audit-Trail anchor
# ------------------
#
# ADR-0066 §AR-Hand-Gate provenance bundle now includes:
#
#   * The Tag-47 Cosign-Keyless-OIDC-Drift-Probe verdict.
#   * The Tag-48 15-binary SBOM bundle.
#   * The Tag-49 SBOM-vs-baseline verifier verdict.
#   * The Tag-51 Cargo.lock-derivation build-reproducibility verdict.
#   * **The Tag-53 image-build-reproducibility verdict (this gauge).**
#
# Sandbox posture
# ---------------
#
# Strict hermetic: ``--mode=sandbox-stub`` is the CI default. No
# podman / cargo / cosign / network egress from the workflow.
# Live verification is Operator-Hand only per
# ``feedback_sandbox_host_trennung.md`` + ADR-0051; a future
# Mini-Welle wires ``--mode=live`` against a Pilot-VM host.
#
# Trigger surface
# ---------------
#
#   * ``schedule: cron "15 8 * * *"`` -- daily at 08:15 UTC.
#   * ``workflow_dispatch`` -- operator-hand manual invocation.
#   * ``push:`` (path-filtered) -- any change to the verifier
#     script, test file, or Cargo.lock re-runs the verifier so
#     substrate-side breakage surfaces on the PR base before
#     merge.
#   * ``pull_request:`` (path-filtered) -- same path-filter so PRs
#     touching these files run the verifier in dry-run before
#     merge.
#
# Not a required status check
# ---------------------------
#
# Per ``feedback_branch_protection_check_names.md`` this workflow
# tracks a daily provenance signal, not individual PR acceptance.
# It is NOT listed as a required status check on PRs; it surfaces
# signal only via Job-Summary + artefact + Mira-Notify event.

name: image-build-reproducibility-daily

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scripts/observability/verify-15-binary-image-build-reproducibility.py"
      - "tests/observability/test_verify_15_binary_image_build_reproducibility.py"
      - "wirelang-rust/Cargo.lock"
      - ".github/workflows/image-build-reproducibility-daily.yml"
  pull_request:
    paths:
      - "scripts/observability/verify-15-binary-image-build-reproducibility.py"
      - "tests/observability/test_verify_15_binary_image_build_reproducibility.py"
      - "wirelang-rust/Cargo.lock"
      - ".github/workflows/image-build-reproducibility-daily.yml"

permissions:
  contents: read

concurrency:
  group: image-build-reproducibility-daily
  cancel-in-progress: false

jobs:
  audit-image-build-reproducibility:
    name: 15-Binary Image-Build-Reproducibility (daily)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run hermetic verifier tests
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
              'pytest==9.0.3'
          python3 -m pytest -v \
              tests/observability/test_verify_15_binary_image_build_reproducibility.py

      - name: Run image-build-reproducibility audit (sandbox-stub)
        id: audit
        run: |
          set -euo pipefail
          mkdir -p out/image-build-reproducibility
          set +e
          python3 \
              scripts/observability/verify-15-binary-image-build-reproducibility.py \
                  --cargo-lock wirelang-rust/Cargo.lock \
                  --mode sandbox-stub \
                  --out-json out/image-build-reproducibility/verdict.json \
                  --out-textfile out/image-build-reproducibility/metrics.prom \
                  --out-markdown out/image-build-reproducibility/summary.md \
                  --out-mira-notify out/image-build-reproducibility/mira-notify.json
          rc=$?
          set -e
          echo "audit_rc=${rc}" >> "${GITHUB_OUTPUT}"
          # Exit codes:
          #   0 -- GREEN, all byte-equal.
          #   1 -- input / argument error (treat as workflow failure).
          #   2 -- RED, one or more binaries byte-unequal.
          # We propagate rc=1 as a hard failure; rc=2 we let the
          # next step surface via Job-Summary + Mira-Notify
          # artefact and then fail the job at the end.
          if [ "${rc}" -eq 1 ]; then
            echo "Verifier reported input/argument error." >&2
            exit 1
          fi

      - name: Render Job-Summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f out/image-build-reproducibility/summary.md ]; then
            cat out/image-build-reproducibility/summary.md \
                >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "## 15-Binary Image-Build-Reproducibility -- audit failed before summary." \
                >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Surface Mira-Notify drift event
        if: always()
        run: |
          set -euo pipefail
          notify_path="out/image-build-reproducibility/mira-notify.json"
          if [ -s "${notify_path}" ]; then
            echo "## Mira-Notify Drift Event Emitted" \
                >> "${GITHUB_STEP_SUMMARY}"
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            cat "${notify_path}" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload image-build-reproducibility bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-build-reproducibility-${{ github.run_id }}
          path: out/image-build-reproducibility/
          retention-days: 30
          if-no-files-found: warn

      - name: Fail job on drift verdict
        if: steps.audit.outputs.audit_rc == '2'
        run: |
          echo "Image-build-reproducibility audit returned RED (drift detected)." >&2
          exit 1
