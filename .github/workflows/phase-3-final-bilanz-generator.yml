#
# Phase-3 Final Bilanz Generator workflow hook (Noa Tag-43).
#
# Two triggers:
#   1. workflow_dispatch  -- manual operator invocation.
#   2. push on main when state/phase-3-complete-marker.json changes --
#      auto-trigger after Tomas writes the COMPLETE marker.
#
# The generator uses --auto-after-complete-marker so it is idempotent
# (no-op if the marker is missing or not yet COMPLETE). The bilanz
# artefact is uploaded so the operator can inspect without checking
# out the repo.

name: phase-3-final-bilanz-generator

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Pass --strict (exit 1 on breach)"
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - "state/phase-3-complete-marker.json"
      - "scripts/observability/phase-3-final-bilanz-generator.py"
      - "tests/observability/test_phase_3_final_bilanz_generator.py"
      - "tests/fixtures/phase-3-marathon-bilanz/**"
  pull_request:
    paths:
      - "scripts/observability/phase-3-final-bilanz-generator.py"
      - "tests/observability/test_phase_3_final_bilanz_generator.py"
      - "tests/fixtures/phase-3-marathon-bilanz/**"
      - ".github/workflows/phase-3-final-bilanz-generator.yml"

permissions:
  contents: read

jobs:
  generate:
    name: generate-phase-3-bilanz
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest

      - name: Run tests
        run: |
          python3 -m pytest tests/observability/test_phase_3_final_bilanz_generator.py -v
          python3 -m pytest tests/observability/test_bilanz_generator_validation_runs.py -v

      - name: Validate reference samples (Tag-44)
        # Both samples are stdlib-only validatable; this catches sample
        # drift on every workflow_dispatch / marker-write.
        run: |
          python3 scripts/observability/bilanz-output-schema-validator.py \
              samples/bilanz-output-happy-path.json --quiet
          python3 scripts/observability/bilanz-output-schema-validator.py \
              samples/bilanz-output-rollback-path.json --quiet

      - name: Run fixture validation tests (Selin Tag-44)
        run: |
          python3 -m pytest tests/fixtures/phase-3-marathon-bilanz/test_bilanz_generator_with_fixtures.py -v

      - name: Generate bilanz (auto-trigger mode)
        run: |
          python3 scripts/observability/phase-3-final-bilanz-generator.py \
              --auto-after-complete-marker \
              ${{ inputs.strict == 'true' && '--strict' || '' }}

      - name: Validate generated bilanz against schema 1.0.0
        # Tag-44: belt-and-suspenders schema check on the live output.
        # If the marker was absent the generator exited 0 silently and
        # this step is a no-op.
        if: hashFiles('reports/phase-3-marathon-bilanz.json') != ''
        run: |
          python3 scripts/observability/bilanz-output-schema-validator.py \
              reports/phase-3-marathon-bilanz.json

      - name: Upload bilanz artefacts
        if: hashFiles('reports/phase-3-marathon-bilanz.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-marathon-bilanz
          path: |
            reports/phase-3-marathon-bilanz.md
            reports/phase-3-marathon-bilanz.json
          retention-days: 90
